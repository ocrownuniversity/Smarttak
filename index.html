<!--
  ============================================================================
  SMILETAK — single-file real-time messaging platform
  ============================================================================
  Everything the app needs to RUN lives in this one index.html: React (no
  build step, no JSX — plain React.createElement so it runs directly from a
  <script> tag), Tailwind (CDN), and the Firebase compat SDK.

  TWO THINGS CANNOT LIVE INSIDE THIS FILE, BY PLATFORM DESIGN (not preference):
    1. firestore.rules  — Firestore security rules are not JavaScript, they
       are a separate config artifact deployed straight to Firebase's
       servers via the CLI/console. They cannot be pasted into a webpage.
    2. Background push  — real push-when-the-tab-is-closed requires a
       Service Worker file served at its own URL, which browsers refuse to
       load from inline script. Per your choice, SmileTak skips background
       push entirely: notifications are in-app only (toasts + the bell) and,
       when the tab is open and permission is granted, real OS notifications
       via the Notifications API. This can be upgraded later by dropping in
       a firebase-messaging-sw.js without touching this file's data model.

  AUTH DESIGN NOTE:
  You asked for phone number + password login with securely hashed
  passwords, but no Cloud Functions and everything client-side. Rolling our
  own password hashing in client JS would mean either (a) shipping a bcrypt
  compare that requires reading other users' password hashes from Firestore
  client-side — which defeats security rules entirely — or (b) a Cloud
  Function, which you've ruled out. Instead SmileTak uses Firebase
  Authentication itself (battle-tested hashing, done by Google's servers,
  zero custom crypto in this file) but maps your phone number to a
  synthetic internal email under the hood, e.g. "2348012345678@smiletak.local".
  You never see this — the UI only ever asks for phone + password. This
  keeps request.auth.uid available for real Firestore security rules, keeps
  passwords out of Firestore entirely, and needs zero redesign later: real
  phone OTP can be added as a *linked* credential on top of the same UID.

  FIRESTORE COLLECTIONS:
    users/{uid}                – profile, presence, isAdmin, isSuspended
    usernames/{usernameLower}  – { uid }  (uniqueness reservation)
    phoneIndex/{phoneDigits}   – { uid }  (uniqueness reservation)
    chats/{chatId}             – { members:[uid,uid], lastMessage, lastMessageAt, lastSenderId, typing:{uid:ts} }
    chats/{chatId}/messages/{messageId}
    chatMembers/{chatId_uid}   – per-user chat meta: pinned, archived, muted, unreadCount, lastReadAt, deletedForClear
    statuses/{statusId}        – { uid, type, content/mediaURL, createdAt, expiresAt }
    statuses/{statusId}/views/{viewerUid}
    blockedUsers/{blockerUid_blockedUid}
    reports/{reportId}
    notifications/{uid}/items/{itemId}
    settings/site              – global toggles (admin-editable)

  Fill in YOUR OWN Firebase project config below (create a new, separate
  Firebase project for SmileTak — do not reuse Yeloface's project, per the
  requirement that the two apps stay independent).
  ============================================================================
-->

<script>
  // If any CDN script above failed to load (slow/blocked connection), fail
  // loudly with a retry button instead of leaving the person on an infinite
  // spinner with a cryptic console error.
  window.addEventListener('load', function () {
    setTimeout(function () {
      var missing = [];
      if (typeof tailwind === 'undefined') missing.push('Tailwind (styling)');
      if (typeof React === 'undefined') missing.push('React');
      if (typeof firebase === 'undefined') missing.push('Firebase');
      if (missing.length) {
        document.getElementById('root').innerHTML =
          '<div style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0b0f16;color:#fff;padding:24px;text-align:center;font-family:sans-serif;">' +
          '<div style="font-size:32px;">⚠️</div>' +
          '<div style="font-weight:700;font-size:16px;">Couldn\'t load required scripts</div>' +
          '<div style="font-size:13px;opacity:.7;max-width:320px;">' + missing.join(', ') + ' failed to load — this is usually a slow or blocked internet connection, not a bug in the app. Check your connection and try again.</div>' +
          '<button onclick="location.reload()" style="background:#00A884;color:#fff;border:none;padding:10px 22px;border-radius:999px;font-weight:600;font-size:14px;">Retry</button>' +
          '</div>';
      }
    }, 4000);
  });
</script>

    tailwind.config = {

    };
  }
</script>
<style>
  html,body{height:100%;overscroll-behavior-y:none;}
  html{font-size:130%;} /* bumps every Tailwind text-* size (they're rem-based) app-wide */
  body{font-family:'Inter',sans-serif;}
  #root{height:100%;overflow:hidden;}
  input,textarea,select{font-size:16px!important;}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px;}
  .dark ::-webkit-scrollbar-thumb{background:#354254;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .fade-in{animation:fadein .2s ease-out;}
  html.st-high-contrast{filter:contrast(1.18) saturate(1.1);}
  html.st-high-contrast body{text-shadow:0 0 0.2px currentColor;}
  html.st-reduce-motion *,html.st-reduce-motion *::before,html.st-reduce-motion *::after{animation-duration:0.001ms!important;animation-iteration-count:1!important;transition-duration:0.001ms!important;}
  @keyframes msgin{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
  .msg-in{animation:msgin .15s ease-out;}
  @keyframes pulse-dot{0%,100%{opacity:.3}50%{opacity:1}}
  .typing-dot{animation:pulse-dot 1.2s infinite;}
  .no-scrollbar::-webkit-scrollbar{display:none;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .spinner{animation:spin .7s linear infinite;}
  @keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
  .skel{background:linear-gradient(90deg,#e5e9ef 25%,#f1f4f8 37%,#e5e9ef 63%);background-size:800px 100%;animation:shimmer 1.4s ease-in-out infinite;border-radius:8px;}
  @keyframes pinflash{0%,100%{background-color:transparent}30%{background-color:rgba(245,158,11,.28)}}
  .flash-highlight{animation:pinflash 1.1s ease-out;border-radius:14px;}
  .dark .skel{background:linear-gradient(90deg,#1c2532 25%,#26313f 37%,#1c2532 63%);background-size:800px 100%;}
  html.st-reduce-motion .skel{animation:none;background:#e5e9ef;}
  html.st-reduce-motion.dark .skel{background:#1c2532;}
  /* ============== Global legibility boost ==============
     Feedback: most body text and icons across the app read as too light/
     faded. The app leans heavily on Tailwind's text-slate-400/500/300
     utilities for secondary text (timestamps, hints, icons) — those are
     Tailwind's stock light greys, which have low contrast against a white
     background. Overriding the utility classes directly here (rather than
     touching every className in the app) darkens all of them at once,
     consistently, in both light and dark mode. !important is required
     because Tailwind's CDN build injects its own stylesheet dynamically and
     its insertion order relative to this block isn't guaranteed. */
  body{font-weight:500;}
  .text-slate-300{color:#7c8ba1!important;}
  .text-slate-400{color:#52657a!important;}
  .text-slate-500{color:#37455a!important;}
  .dark .text-slate-300{color:#c7d0dc!important;}
  .dark .text-slate-400{color:#a8b4c4!important;}
  .dark .text-slate-500{color:#dbe1e9!important;}
  ::placeholder{color:#6b7a90!important;opacity:1;}
  .dark ::placeholder{color:#8a97a8!important;opacity:1;}
</style>

/* Combine a country dial code (e.g. "+234") with a local number as typed
   by the user (which may have a leading trunk "0", spaces, dashes, etc.)
   into a single E.164-style digit string with NO leading "+" (phone is
   always stored as bare digits — the "+" is added only for display). */
function buildFullPhone(dial, local) {
  let digits = (local || '').replace(/\D/g, '');
  digits = digits.replace(/^0+/, ''); // drop local trunk prefix, e.g. 0803... -> 803...
  const dialDigits = (dial || '').replace(/\D/g, '');
  return dialDigits + digits;
}

/* Deduplicate label for countries sharing a dial code (e.g. US/Canada = +1). */
function countryLabel(c) { return c[0] + ' (+' + c[2] + ')'; }
function phoneToEmail(p) { return normalizePhone(p).replace(/\D/g, '') + '@smiletak.local'; }
function isValidEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((e || '').trim()); }
function usernameKey(u) { return (u || '').trim().toLowerCase(); }
function timeAgo(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const s = Math.floor((Date.now() - d.getTime()) / 1000);
  if (s < 10) return 'just now';
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  if (s < 604800) return Math.floor(s / 86400) + 'd ago';
  return d.toLocaleDateString();
}
function fmtClock(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
function fmtDay(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const today = new Date(); const yest = new Date(); yest.setDate(today.getDate() - 1);
  if (d.toDateString() === today.toDateString()) return 'Today';
  if (d.toDateString() === yest.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([], { day: 'numeric', month: 'short', year: d.getFullYear() !== today.getFullYear() ? 'numeric' : undefined });
}
function initials(name) {
  return (name || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
}
function chatIdFor(a, b) { return [a, b].sort().join('_'); }
// Used to match a phone-book contact's number against a registered user's
// stored phone (country code + digits, no "+"). We compare on the last 9
// digits rather than the full string because phones save numbers in all
// kinds of formats — with/without country code, leading 0, spaces, dashes —
// and the last 9 digits are enough to uniquely identify a local number
// without needing a full phone-number-parsing library.
function phoneMatchKey(raw) {
  const digits = (raw || '').replace(/\D/g, '').replace(/^0+/, '');
  return digits.slice(-9);
}
function fmtDuration(secs) {
  const s = Math.max(0, Math.round(secs || 0));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

/* ============================== PREMIUM + BUSINESS BADGES ============================== */
function isPremiumActive(u) {
  return !!(u && u.isPremium && u.premiumExpiresAt && u.premiumExpiresAt.toMillis && u.premiumExpiresAt.toMillis() > Date.now());
}
function isBusinessPremiumActive(u) {
  return !!(u && u.isBusinessPremium && u.businessPremiumExpiresAt && u.businessPremiumExpiresAt.toMillis && u.businessPremiumExpiresAt.toMillis() > Date.now());
}
function PremiumBadge({ size }) {
  return h('i', { className: 'fa-solid fa-crown text-amber-400', title: 'Premium member', style: { fontSize: (size || 12) + 'px' } });
}
function BizPremiumBadge({ size }) {
  return h('i', { className: 'fa-solid fa-gem text-sky-500', title: 'Business Premium', style: { fontSize: (size || 12) + 'px' } });
}
function VerifiedBadge({ size }) {
  return h('i', { className: 'fa-solid fa-circle-check text-sky-500', title: 'Verified business', style: { fontSize: (size || 12) + 'px' } });
}
function NameWithBadges({ name, user, className }) {
  return h('span', { className: 'inline-flex items-center gap-1 min-w-0 ' + (className || '') },
    h('span', { className: 'truncate' }, name),
    user && isPremiumActive(user) && h(PremiumBadge, { size: 11 }),
    user && isBusinessPremiumActive(user) && h(BizPremiumBadge, { size: 11 }),
    user && user.businessVerified && h(VerifiedBadge, { size: 11 })
  );
}

/* ============================== ADVERTISING ==============================
   Admin-managed ad campaigns (smiletak_adCampaigns). No self-serve
   advertiser flow — the admin creates/uploads/enables campaigns from the
   Admin panel. Impressions/clicks are incremented by whichever logged-in
   client sees/taps the ad (security rule restricts that update to ONLY
   the impressions/clicks fields, so a viewer can never edit the ad
   itself). Premium members never see ads. */
const loggedAdImpressions = new Set();
function logAdImpression(ad) {
  if (!ad || loggedAdImpressions.has(ad.id)) return;
  loggedAdImpressions.add(ad.id);
  db.collection('smiletak_adCampaigns').doc(ad.id).update({ impressions: FieldValue.increment(1) }).catch(() => {});
}
// Ad link URLs are free-text fields advertisers/admins type in. Without a
// scheme (e.g. "zmonie.com" instead of "https://zmonie.com"), window.open
// treats it as a path relative to the current page — so it would open
// https://lokiface.com/zmonie.com, a dead route inside this app, instead of
// the advertiser's actual site. This normalizes it before ever opening it.
function normalizeExternalUrl(url) {
  if (!url) return '';
  const trimmed = url.trim();
  if (/^(https?:|mailto:|tel:)/i.test(trimmed)) return trimmed;
  return 'https://' + trimmed;
}
function logAdClick(ad) {
  if (!ad) return;
  db.collection('smiletak_adCampaigns').doc(ad.id).update({ clicks: FieldValue.increment(1) }).catch(() => {});
  if (ad.targetURL) window.open(normalizeExternalUrl(ad.targetURL), '_blank');
}
function useAd(type) {
  const [ad, setAd] = useState(null);
  useEffect(() => {
    let alive = true;
    db.collection('smiletak_adCampaigns').where('type', '==', type).where('enabled', '==', true).limit(20).get()
      .then(s => {
        if (!alive) return;
        const now = Date.now();
        const eligible = s.docs.map(d => Object.assign({ id: d.id }, d.data())).filter(c => {
          const start = c.startAt ? c.startAt.toMillis() : 0;
          const end = c.endAt ? c.endAt.toMillis() : Infinity;
          return now >= start && now <= end;
        });
        setAd(eligible.length ? eligible[Math.floor(Math.random() * eligible.length)] : null);
      }).catch(() => {});
    return () => { alive = false; };
  }, [type]);
  return ad;
}
function bytesToSize(b) {
  if (!b) return '';
  const u = ['B', 'KB', 'MB', 'GB']; let i = 0; let n = b;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return n.toFixed(n < 10 && i > 0 ? 1 : 0) + ' ' + u[i];
}

/* Single global ad experience for the whole app: pops up over whatever
   screen is open (wide banner, same ~2.45:1 letterbox shape as the
   reference creative), auto-hides after 30 seconds, and — if there's more
   than one active campaign — cycles through them one after another, 5
   minutes apart, instead of repeating the same one. An X in the corner
   lets the person dismiss it immediately instead of waiting out the 30
   seconds — closing early still starts the same 5-minute wait before the
   next one shows. Runs once at the app root so it's a single global cycle,
   not a separate one per screen/placement. (Status ads are a different,
   separate thing — they stay as normal-looking cards in the Status feed.) */
function FloatingAdOverlay() {
  const { profile } = useAuth();
  const [ad, setAd] = useState(null);
  const [visible, setVisible] = useState(false);
  const hideTimer = useRef(null);
  const nextTimer = useRef(null);
  const cycleIndex = useRef(0);

  const scheduleNext = () => {
    clearTimeout(nextTimer.current);
    nextTimer.current = setTimeout(fetchAndShow, 5 * 60 * 1000);
  };
  const fetchAndShow = () => {
    db.collection('smiletak_adCampaigns').where('type', '==', 'app_banner').where('enabled', '==', true).limit(20).get()
      .then(s => {
        const now = Date.now();
        const eligible = s.docs.map(d => Object.assign({ id: d.id }, d.data())).filter(c => {
          const start = c.startAt ? c.startAt.toMillis() : 0;
          const end = c.endAt ? c.endAt.toMillis() : Infinity;
          return now >= start && now <= end;
        }).sort((a, b) => a.id < b.id ? -1 : 1);
        if (!eligible.length) { scheduleNext(); return; }
        // Round-robin through all active campaigns one after another,
        // instead of re-rolling randomly (which could repeat the same ad).
        const picked = eligible[cycleIndex.current % eligible.length];
        cycleIndex.current += 1;
        setAd(picked);
        setVisible(true);
        logAdImpression(picked);
        clearTimeout(hideTimer.current);
        hideTimer.current = setTimeout(() => { setVisible(false); scheduleNext(); }, 30000);
      }).catch(() => scheduleNext());
  };
  useEffect(() => {
    fetchAndShow();
    return () => { clearTimeout(hideTimer.current); clearTimeout(nextTimer.current); };
    // eslint-disable-next-line
  }, []);

  const closeNow = () => {
    setVisible(false);
    clearTimeout(hideTimer.current);
    scheduleNext();
  };

  if (!visible || !ad || isPremiumActive(profile)) return null;
  const hasMedia = (ad.mediaType === 'image' || ad.mediaType === 'video') && ad.mediaURL;

  return h('div', { className: 'fixed left-0 right-0 top-[9.75rem] z-40 px-3 pointer-events-none flex justify-center' },
    h('div', {
      className: 'relative w-full max-w-md aspect-[2.45/1] rounded-2xl overflow-hidden shadow-xl border-2 border-amber-300 dark:border-amber-500/40 bg-white dark:bg-ink-800 pointer-events-auto cursor-pointer',
      onClick: () => logAdClick(ad)
    },
      ad.mediaType === 'image' && ad.mediaURL && h('img', { src: ad.mediaURL, className: 'absolute inset-0 w-full h-full object-cover' }),
      ad.mediaType === 'video' && ad.mediaURL && h('video', { src: ad.mediaURL, className: 'absolute inset-0 w-full h-full object-cover', muted: true, autoPlay: true, loop: true, playsInline: true }),
      !hasMedia && h('div', { className: 'absolute inset-0 flex flex-col items-center justify-center p-3 text-center bg-gradient-to-br from-amber-50 to-white dark:from-ink-800 dark:to-ink-800' },
        h('p', { className: 'text-sm font-extrabold' }, ad.headline || ad.advertiserName || 'Sponsored'),
        ad.body && h('p', { className: 'text-xs text-slate-500 dark:text-slate-400 mt-1' }, ad.body)
      ),
      hasMedia && (ad.headline || ad.body || ad.advertiserName) && h('div', { className: 'absolute bottom-0 left-0 right-0 px-3 pt-6 pb-2 bg-gradient-to-t from-black/75 via-black/40 to-transparent' },
        h('p', { className: 'text-white text-sm font-extrabold drop-shadow' }, ad.headline || ad.advertiserName),
        ad.body && h('p', { className: 'text-white/85 text-xs mt-0.5 drop-shadow' }, ad.body)
      ),
      h('span', { className: 'absolute top-2 left-2 bg-amber-400 text-ink-900 text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm tracking-wide z-10' }, 'SPONSORED'),
      h('button', {
        onClick: (e) => { e.stopPropagation(); closeNow(); },
        className: 'absolute top-2 right-2 w-6 h-6 rounded-full bg-black/60 text-white flex items-center justify-center text-xs z-10'
      }, h('i', { className: 'fa-solid fa-xmark' }))
    )
  );
}

/* ============================== DEVICE-LOCAL SETTINGS ==============================
   A handful of group-settings features (Chat lock, Media visibility) are, by
   nature, PER-DEVICE rather than synced account data — exactly like
   WhatsApp's own "Lock and hide this chat on this device" wording. These
   live in localStorage, never in Firestore, and never leave the device.
   Wrapped in try/catch since some embedded/privacy-mode browsers throw on
   localStorage access entirely. */
function lsGet(key, fallback) {
  try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; }
}
function lsSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage unavailable — feature just won't persist */ }
}
// Not cryptographic — this is a convenience "keep my kid/coworker from
// casually opening this chat" lock, same threat model as WhatsApp's device
// chat lock, not a secrets vault. A determined attacker with devtools access
// could bypass any client-side lock; real confidentiality would need the
// message content itself encrypted at rest, which this simple hash does not do.
function simplePinHash(pin) {
  let h = 0;
  const salted = 'smiletak-lock:' + pin;
  for (let i = 0; i < salted.length; i++) h = (Math.imul(31, h) + salted.charCodeAt(i)) | 0;
  return String(h);
}
async function uploadFile(path, file, onProgress) {
  const ref = storage.ref().child(path);
  const task = ref.put(file);
  return new Promise((resolve, reject) => {
    task.on('state_changed',
      snap => onProgress && onProgress(snap.bytesTransferred / snap.totalBytes),
      reject,
      async () => resolve(await task.snapshot.ref.getDownloadURL())
    );
  });
}
/* Same as uploadFile, but returns a cancel() handle too — used anywhere a
   person might be stuck waiting a long time (e.g. a video on a slow
   connection) and needs a way out instead of watching a frozen spinner. */
function uploadFileCancelable(path, file, onProgress) {
  const ref = storage.ref().child(path);
  const task = ref.put(file);
  const promise = new Promise((resolve, reject) => {
    task.on('state_changed',
      snap => onProgress && onProgress(snap.bytesTransferred / snap.totalBytes),
      reject,
      async () => { try { resolve(await task.snapshot.ref.getDownloadURL()); } catch (e) { reject(e); } }
    );
  });
  return { promise, cancel: () => task.cancel() };
}
function requestNotifyPermission() {
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
}
function fireLocalNotification(title, body, icon) {
  try {
    if ('Notification' in window && Notification.permission === 'granted' && document.visibilityState !== 'visible') {
      new Notification(title, { body, icon });
    }
  } catch (e) { /* ignore */ }
}
/* Short two-tone "ding" chime for incoming messages, built with the Web
   Audio API (same approach as useRingTone below) so no audio file needs to
   be shipped. Gated behind the device-local 'st_notifSoundEnabled' setting
   (see NotificationSettingsScreen) so people can turn it off.

   IMPORTANT: mobile browsers (Chrome included) refuse to let a freshly
   created AudioContext actually produce sound unless it's resumed from
   inside a genuine user-gesture handler (tap/click/keypress). The chime is
   triggered from a Firestore realtime listener — not a tap — so a
   brand-new context created there stays permanently 'suspended' and no
   sound comes out, even though nothing throws an error. The fix is to keep
   ONE shared context alive for the whole session and "unlock" it the
   moment the person taps anywhere in the app; after that first unlock,
   the same context can be reused to play sound from background callbacks
   for the rest of the session. */
let _notifAudioCtx = null;
function _getNotifAudioCtx() {
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  if (!AudioCtx) return null;
  if (!_notifAudioCtx) _notifAudioCtx = new AudioCtx();
  return _notifAudioCtx;
}
function _unlockNotifAudio() {
  const ctx = _getNotifAudioCtx();
  if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {});
}
['pointerdown', 'touchstart', 'click', 'keydown'].forEach(evt => {
  document.addEventListener(evt, _unlockNotifAudio, { passive: true });
});
function playNotificationSound() {
  try {
    if (!lsGet('st_notifSoundEnabled', true)) return;
    const ctx = _getNotifAudioCtx();
    if (!ctx) return;
    // Best-effort resume even here — if this call happens to be the very
    // first "tap" won't have fired yet, this at least tries; once the
    // person has tapped anywhere once, this always succeeds instantly.
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    const now = ctx.currentTime;
    [[880, 0], [1175, 0.09]].forEach(([freq, delay]) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, now + delay);
      gain.gain.exponentialRampToValueAtTime(0.18, now + delay + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + delay + 0.16);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now + delay);
      osc.stop(now + delay + 0.18);
    });
  } catch (e) { /* sound is best-effort, never block on it */ }
}

      if (!snap.exists && user.uid === SUPER_ADMIN_UID) {

    if (!user) return;
    db.collection('smiletak_users').doc(user.uid).update({ online: true, lastSeen: FieldValue.serverTimestamp() }).catch(() => {});
    const onVis = () => {

/* Captures the browser's "beforeinstallprompt" event (fired when the PWA
   is installable but not yet installed) so a custom "Install app" button
   can trigger it on demand, instead of relying on the browser's own
   address-bar install icon which people often don't notice. Chrome/Edge
   fire this event; Safari/iOS never do (there's no programmatic install
   prompt there — people use Share → Add to Home Screen instead), so the
   button below simply won't render on iOS, which is expected. */
function useInstallPrompt() {
  const [deferredEvent, setDeferredEvent] = useState(null);
  const [installed, setInstalled] = useState(
    () => window.matchMedia && window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true
  );
  useEffect(() => {
    const onPrompt = (e) => { e.preventDefault(); setDeferredEvent(e); };
    const onInstalled = () => { setInstalled(true); setDeferredEvent(null); };
    window.addEventListener('beforeinstallprompt', onPrompt);
    window.addEventListener('appinstalled', onInstalled);
    return () => {
      window.removeEventListener('beforeinstallprompt', onPrompt);
      window.removeEventListener('appinstalled', onInstalled);
    };
  }, []);
  const promptInstall = async () => {
    if (!deferredEvent) return;
    deferredEvent.prompt();
    await deferredEvent.userChoice;
    // Whether they accepted or dismissed, this specific prompt event can
    // only be used once — clear it either way.
    setDeferredEvent(null);
  };
  return { canInstall: !!deferredEvent && !installed, promptInstall };
}

function AuthScreen() {
  const { canInstall, promptInstall } = useInstallPrompt();
  const toast = useToast();
  const [mode, setMode] = useState('login');
  const [adminMode, setAdminMode] = useState(false);
  const [busy, setBusy] = useState(false);
  const [form, setForm] = useState({ fullName: '', username: '', phone: '', password: '', confirm: '', email: '', resetEmail: '' });
  const [countryIdx, setCountryIdx] = useState(0); // defaults to COUNTRIES[0] = Nigeria
  const [avatarFile, setAvatarFile] = useState(null);
  const [avatarPreview, setAvatarPreview] = useState(null);
  const set = (k) => (e) => setForm(f => Object.assign({}, f, { [k]: e.target.value }));
  const country = COUNTRIES[countryIdx];

  const onPickAvatar = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    setAvatarFile(f);

  const doLogin = async () => {
    if (adminMode) {
      if (!form.email.trim() || !form.password) return toast('Enter email and password', 'error');
      setBusy(true);
      try {
        await auth.signInWithEmailAndPassword(form.email.trim(), form.password);
      } catch (e) {
        toast(e.code === 'auth/invalid-credential' || e.code === 'auth/user-not-found' || e.code === 'auth/wrong-password'
          ? 'Incorrect email or password' : (e.message || 'Login failed'), 'error');

    }
    if (!form.phone.trim() || !form.password) return toast('Enter phone and password', 'error');
    setBusy(true);
    try {
      const fullPhone = buildFullPhone(country[2], form.phone);
      await auth.signInWithEmailAndPassword(phoneToEmail(fullPhone), form.password);
    } catch (e) {
      toast(e.code === 'auth/invalid-credential' || e.code === 'auth/user-not-found' || e.code === 'auth/wrong-password'
        ? 'Incorrect phone number or password' : (e.message || 'Login failed'), 'error');
    } finally { setBusy(false); }
  };

  const doRegister = async () => {
    const { fullName, username, phone, password, confirm, email } = form;
    if (!fullName.trim() || !username.trim() || !phone.trim() || !password || !email.trim()) return toast('Please fill in all required fields', 'error');
    if (!isValidEmail(email)) return toast('Enter a valid email address', 'error');
    if (password.length < 6) return toast('Password must be at least 6 characters', 'error');
    if (password !== confirm) return toast('Passwords do not match', 'error');
    const uKey = usernameKey(username);
    if (!/^[a-z0-9_.]{3,20}$/.test(uKey)) return toast('Username: 3-20 chars, letters/numbers/./_ only', 'error');
    const phoneDigits = buildFullPhone(country[2], phone); // full number, country code + local digits, no "+"
    if (phoneDigits.replace(/\D/g, '').length < 7) return toast('Enter a valid phone number', 'error');

    setBusy(true);
    try {
      const uSnap = await db.collection('smiletak_usernames').doc(uKey).get();
      if (uSnap.exists) { toast('That username is already taken', 'error'); setBusy(false); return; }
      // Phone uniqueness isn't pre-checked here (smiletak_phoneIndex is
      // intentionally unreadable by anyone, including a not-yet-signed-in
      // user, to keep phone numbers from being enumerable). Firebase Auth
      // itself already guarantees uniqueness, since each phone number maps
      // to one synthetic email — createUserWithEmailAndPassword below will
      // reject with auth/email-already-in-use if that phone is taken, and
      // that's caught in the catch block with a clear message.

      const cred = await auth.createUserWithEmailAndPassword(phoneToEmail(phoneDigits), password);
      const uid = cred.user.uid;

      }

      const batch = db.batch();
      batch.set(db.collection('smiletak_users').doc(uid), {

        username: uKey,
        usernameDisplay: username.trim(),
        phone: phoneDigits,

        online: true,
        lastSeen: FieldValue.serverTimestamp(),
        createdAt: FieldValue.serverTimestamp(),
        isAdmin: uid === SUPER_ADMIN_UID,
        isSuspended: false

      batch.set(db.collection('smiletak_usernames').doc(uKey), { uid });
      batch.set(db.collection('smiletak_phoneIndex').doc(phoneDigits.replace(/\D/g, '')), { uid });
      await batch.commit();
      toast('Welcome to SmileTak!', 'success');
    } catch (e) {

    } finally { setBusy(false); }

      if (e.code === 'auth/user-not-found') setMode('login');
    } finally { setBusy(false); }
  };

  return h('div', { className: 'h-full w-full flex items-center justify-center bg-gradient-to-br from-brand-600 to-brand-800 p-4' },
    h('div', { className: 'w-full max-w-sm bg-white dark:bg-ink-800 rounded-2xl shadow-xl p-6 fade-in max-h-[92vh] overflow-y-auto no-scrollbar' },
      h('div', { className: 'flex flex-col items-center mb-5' },
        h('img', { src: LOGO_DATA_URI, className: 'w-14 h-14 rounded-2xl mb-2 shadow-sm' }),
        h('h1', { className: 'text-xl font-extrabold' }, 'SmileTak'),
        h('p', { className: 'text-xs text-slate-400' }, mode === 'login' ? 'Log in to keep chatting' : mode === 'forgot' ? 'Reset your password' : 'Create your account')
      ),
      canInstall && h('button', {
        onClick: promptInstall,
        className: 'w-full mb-4 flex items-center justify-center gap-2 border border-brand-600 text-brand-600 rounded-xl py-2.5 font-semibold text-sm hover:bg-brand-50 dark:hover:bg-brand-600/10'
      }, h('i', { className: 'fa-solid fa-download' }), 'Install App'),
      mode === 'forgot'
        ? [
            h('p', { key: 'hint', className: 'text-xs text-slate-400 mb-3 -mt-2' }, 'Enter the email you signed up with — we\'ll send a link to reset your password.'),
            h('input', { key: 'resetEmail', className: inputCls, placeholder: 'Email address', value: form.resetEmail, onChange: set('resetEmail') }),
            h('button', {

            }, busy && h('span', { className: 'w-4 h-4 border-2 border-white/50 border-t-white rounded-full spinner' }), 'Send reset link'),
            h('p', { key: 'back', className: 'text-center text-sm text-slate-400 mt-4' },
              h('button', { className: 'text-brand-600 font-semibold', onClick: () => setMode('login') }, 'Back to log in')
            )
          ]
        : [

/* ============================== APP SHELL ============================== */
/* Generic helper: makes a locally-controlled "open/close" panel (a modal,
   viewer, sheet, etc.) participate in the browser's back button. Opening it
   pushes one history entry; pressing back (hardware/gesture/browser button)
   closes it instead of leaving the page; closing it via its own UI (an X
   button, selecting an item) cleanly consumes that same history entry so
   back-stack depth never grows unbounded. */
function useBackClose(isOpen, onClose) {
  const wasOpen = useRef(false);
  useEffect(() => {
    if (isOpen && !wasOpen.current) {
      wasOpen.current = true;
      window.history.pushState({ __panel: true }, '');
    }
    if (!isOpen) wasOpen.current = false;
  }, [isOpen]);
  useEffect(() => {
    const onPop = () => { if (wasOpen.current) { wasOpen.current = false; onClose(); } };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, [onClose]);
  return function closeViaBack() {
    if (wasOpen.current) window.history.back();
    else onClose();
  };
}

// Fires onLongPress after a press-and-hold (touch or mouse), and fires
// onTap for a normal short click/tap. Also wired to right-click so it
// works the same way with a mouse.
function useLongPress(onLongPress, onTap, ms) {
  const timer = useRef(null);
  const fired = useRef(false);
  const moved = useRef(false);
  const start = () => {
    fired.current = false;
    moved.current = false;
    timer.current = setTimeout(() => { fired.current = true; onLongPress(); }, ms || 500);
  };
  const clear = () => { if (timer.current) clearTimeout(timer.current); };
  // A finger move means the person is scrolling the list, not tapping the
  // row — cancel the pending long-press AND remember that this wasn't a
  // tap, so touchend below doesn't still open the chat underneath the scroll.
  const onMove = () => { moved.current = true; clear(); };
  const end = () => { clear(); if (!fired.current && !moved.current && onTap) onTap(); };
  return {
    onMouseDown: start,
    onMouseUp: end,
    onMouseLeave: clear,
    onTouchStart: start,
    onTouchEnd: end,
    onTouchMove: onMove,
    onContextMenu: (e) => { e.preventDefault(); if (!fired.current) { fired.current = true; onLongPress(); } }
  };
}

/* ============================== BOTTOM-NAV UNREAD BADGES ==============================
   Small red-number badges for the Chats / Updates / Calls tabs, shown next
   to each label the same way the marked-up screenshot requested. Chat/group
   unread counts already exist as real Firestore fields (unreadCount) and are
   summed here. Status "unviewed" and missed-call "unseen" have no such
   field anywhere else in the app, so — following the same device-local
   pattern already used for chat-lock/media-visibility settings (see
   lsGet/lsSet above) — we track a per-device "last seen" marker in
   localStorage and clear it the moment the person opens that tab. */
function useUnreadBadges(profile) {
  const [dmUnread, setDmUnread] = useState(0);
  const [groupUnread, setGroupUnread] = useState(0);
  const [statusList, setStatusList] = useState([]); // [{ uid, latestMs }]
  const [missedCalls, setMissedCalls] = useState([]); // recent missed/cancelled incoming calls
  const [seenTick, setSeenTick] = useState(0); // bumped after marking something seen, to force a re-read of localStorage
  // Previous per-doc unreadCount snapshots — kept only for the badge-count
  // math below now (the sound trigger moved off of unreadCount, see the two
  // effects further down and the comment there for why).
  const prevDmCounts = useRef({});
  const prevGroupCounts = useRef({});
  // Muted flags, mirrored here from chatMembers/groupMembers (a normal
  // same-user write, so this part IS reliable) so the message-based sound
  // effects below can skip muted chats/groups without needing their own
  // separate read of the same collections.
  const mutedDmChats = useRef({});
  const mutedGroups = useRef({});

  useEffect(() => {
    if (!profile) { setDmUnread(0); return; }
    const unsub = db.collection('smiletak_chatMembers').where('uid', '==', profile.id).onSnapshot(snap => {
      let sum = 0;
      const nextCounts = {};
      const nextMuted = {};
      snap.docs.forEach(d => {
        const m = d.data();
        nextCounts[d.id] = m.unreadCount || 0;
        nextMuted[m.chatId] = !!m.muted;
        if (!m.archived && m.unreadCount > 0) sum += m.unreadCount;
      });
      prevDmCounts.current = nextCounts;
      mutedDmChats.current = nextMuted;
      setDmUnread(sum);
    });
    return unsub;
  }, [profile]);

  useEffect(() => {
    if (!profile) { setGroupUnread(0); return; }
    const unsub = db.collection('smiletak_groupMembers').where('uid', '==', profile.id).onSnapshot(snap => {
      let sum = 0;
      const nextCounts = {};
      const nextMuted = {};
      snap.docs.forEach(d => {
        const m = d.data();
        nextCounts[d.id] = m.unreadCount || 0;
        nextMuted[m.groupId] = !!m.muted;
        if (!m.archived && m.unreadCount > 0) sum += m.unreadCount;
      });
      prevGroupCounts.current = nextCounts;
      mutedGroups.current = nextMuted;
      setGroupUnread(sum);
    });
    return unsub;
  }, [profile]);

  // ============ NOTIFICATION SOUND — driven by lastMessageAt/lastSenderId ============
  // The chime used to be triggered by unreadCount going up (see the two
  // effects above). That count is bumped by the SENDER writing into the
  // RECIPIENT's own chatMembers/groupMembers doc — a cross-user write that
  // sendMessage() itself already comments is "typically blocked by
  // security rules" and silently swallows the failure. In a real chat
  // between two different accounts that write often never lands, so the
  // count never actually changes and the chime never fires — even though
  // manually flipping the settings toggle (which calls the chime directly,
  // with no Firestore write involved) works fine.
  //
  // lastMessageAt/lastSenderId on smiletak_chats/smiletak_groups don't have
  // that problem: they're written by the SENDER to a doc they're already a
  // member of, which is an ordinary same-user write, so it always lands.
  // Using those instead makes the chime reliable regardless of how the
  // recipient's security rules are configured.
  const prevChatMsgAt = useRef({});
  const chatSoundInit = useRef(false);
  useEffect(() => {
    if (!profile) return;
    const unsub = db.collection('smiletak_chats').where('members', 'array-contains', profile.id).onSnapshot(snap => {
      snap.docChanges().forEach(change => {
        const c = change.doc.data();
        const id = change.doc.id;
        const ms = c.lastMessageAt && c.lastMessageAt.toMillis ? c.lastMessageAt.toMillis() : 0;
        const prevMs = prevChatMsgAt.current[id] || 0;
        if (chatSoundInit.current && ms > prevMs && c.lastSenderId && c.lastSenderId !== profile.id && !mutedDmChats.current[id]) {
          playNotificationSound();
        }
        prevChatMsgAt.current[id] = ms;
      });
      chatSoundInit.current = true;
    });
    return unsub;
  }, [profile]);

  const prevGroupMsgAt = useRef({});
  const groupSoundInit = useRef(false);
  useEffect(() => {
    if (!profile) return;
    const unsub = db.collection('smiletak_groups').where('members', 'array-contains', profile.id).onSnapshot(snap => {
      snap.docChanges().forEach(change => {
        const g = change.doc.data();
        const id = change.doc.id;
        const ms = g.lastMessageAt && g.lastMessageAt.toMillis ? g.lastMessageAt.toMillis() : 0;
        const prevMs = prevGroupMsgAt.current[id] || 0;
        if (groupSoundInit.current && ms > prevMs && g.lastSenderId && g.lastSenderId !== profile.id && !mutedGroups.current[id]) {
          playNotificationSound();
        }
        prevGroupMsgAt.current[id] = ms;
      });
      groupSoundInit.current = true;
    });
    return unsub;
  }, [profile]);


  useEffect(() => {
    if (!profile) { setStatusList([]); return; }
    const cutoff = Timestamp.fromMillis(Date.now() - 24 * 3600 * 1000);
    const unsub = db.collection('smiletak_statuses').where('createdAt', '>', cutoff).onSnapshot(snap => {
      const byUser = {};
      snap.docs.forEach(d => {
        const s = d.data();
        if (s.uid === profile.id) return;
        const ms = s.createdAt && s.createdAt.toMillis ? s.createdAt.toMillis() : Date.now();
        if (!byUser[s.uid] || ms > byUser[s.uid]) byUser[s.uid] = ms;
      });
      setStatusList(Object.keys(byUser).map(uid => ({ uid, latestMs: byUser[uid] })));
    });
    return unsub;
  }, [profile]);

  useEffect(() => {
    if (!profile) { setMissedCalls([]); return; }
    const unsub = db.collection('smiletak_calls').where('calleeId', '==', profile.id).onSnapshot(snap => {
      const rows = snap.docs
        .map(d => Object.assign({ id: d.id }, d.data()))
        .filter(c => c.id.indexOf('__diag_') !== 0)
        .filter(c => c.status === 'missed' || c.status === 'cancelled');
      setMissedCalls(rows);
    });
    return unsub;
  }, [profile]);

  const statusSeenMap = lsGet('st_statusSeen', {});
  const statusUnread = statusList.filter(s => !statusSeenMap[s.uid] || statusSeenMap[s.uid] < s.latestMs).length;

  const callsSeenAt = lsGet('st_callsSeenAt', 0);
  const callsUnread = missedCalls.filter(c => {
    const ms = c.createdAt && c.createdAt.toMillis ? c.createdAt.toMillis() : 0;
    return ms > callsSeenAt;
  }).length;

  const markStatusSeen = () => { lsSet('st_statusSeen', Object.assign({}, lsGet('st_statusSeen', {}), (() => { const m = {}; statusList.forEach(s => { m[s.uid] = Date.now(); }); return m; })())); setSeenTick(t => t + 1); };
  const markCallsSeen = () => { lsSet('st_callsSeenAt', Date.now()); setSeenTick(t => t + 1); };

  return { chats: dmUnread + groupUnread, updates: statusUnread, calls: callsUnread, markStatusSeen, markCallsSeen };
}

function AppShell() {

  const viewRef = useRef(initialView);
  const exitArmed = useRef(false);
  const exitTimer = useRef(null);

  useEffect(() => {
    // Replace the page's initial history entry with our root view, then push
    // a second identical entry as a buffer. Without this second entry, the
    // very first back-button press (from the root tab screen) would pop past
    // our app's own history straight out of the site/tab. With it, that
    // first press lands back on the same root screen instead — and if the
    // person presses back again right away (a clear intent to leave), we
    // let that second press actually exit.
    window.history.replaceState(initialView, '');
    window.history.pushState(initialView, '');
    const onPop = (e) => {
      const state = e.state || initialView;
      const wasAtRoot = viewRef.current.screen === 'tab';
      if (wasAtRoot && state.screen === 'tab') {
        if (!exitArmed.current) {
          exitArmed.current = true;
          toast('Press back again to exit');
          window.history.pushState(initialView, '');
          clearTimeout(exitTimer.current);
          exitTimer.current = setTimeout(() => { exitArmed.current = false; }, 2000);
          return;
        }
        // second back press within the window — let it through, don't re-arm
      } else {
        exitArmed.current = false;
      }
      viewRef.current = state;
      setView(state);
    };
    window.addEventListener('popstate', onPop);
    return () => { window.removeEventListener('popstate', onPop); clearTimeout(exitTimer.current); };
    // eslint-disable-next-line
  }, []);

  const goToTab = (t) => {
    const v = { screen: 'tab', tab: t }; window.history.replaceState(v, ''); viewRef.current = v; setView(v);

  if (profile && profile.isAdmin) tabs.push({ id: 'admin', icon: 'fa-shield-halved', label: 'Admin' });

  return h('div', { className: 'h-full flex flex-col' },
    h('div', { className: 'flex-1 overflow-hidden' },
      tab === 'chats' && h(ChatsListScreen, { onOpenChat: (c) => openChat(c.chatId, c.other), onOpenGroup: openGroup, onNewGroup: openNewGroup, onNewChat: openNewChat, onNewBroadcast: openNewBroadcast, onLinkedDevices: openLinkedDevices, onStarred: openStarred, onViewProfile: openProfile, onNavigate: goToTab, onSettings: openSettings }),
      tab === 'status' && h(StatusScreen, { onViewProfile: openProfile, onOpenChannel: openChannel, onNewChannel: openNewChannel, onExploreChannels: openExploreChannels, onStarred: openStarred, onNavigate: goToTab, onSettings: openSettings, onOpenChat: (other) => openChat(chatIdFor(profile.id, other.id), other) }),
      tab === 'communities' && h(CommunitiesScreen, {}),
      tab === 'profile' && h(MyProfileScreen, { onOpenPremium: openPremium, onOpenBusiness: openBusiness }),
      tab === 'calls' && h(CallsScreen, { onOpenChat: (other) => openChat(chatIdFor(profile.id, other.id), other) }),
      tab === 'admin' && h(AdminPanel, {})
    ),
    h('div', { className: 'flex border-t border-slate-200 dark:border-ink-700 bg-white dark:bg-ink-800 shrink-0' },
      tabs.map(t => h('button', {
        key: t.id,
        onClick: () => goToTab(t.id),
        className: 'flex-1 py-2.5 flex flex-col items-center gap-1 text-xs font-medium relative ' + (tab === t.id ? 'text-brand-600' : 'text-slate-400')
      },
        h('span', { className: 'relative' },
          h('i', { className: 'fa-solid ' + t.icon + ' text-lg' }),
          !!t.badge && h('span', { className: 'absolute -top-1.5 -right-2.5 text-red-600 text-[11px] font-bold leading-none' }, t.badge > 99 ? '99+' : t.badge)
        ),
        t.label
      ))
    )
  );
}

/* ============================== CHATS LIST ============================== */
function ChatsListScreen({ onOpenChat, onOpenGroup, onNewGroup, onNewChat, onNewBroadcast, onLinkedDevices, onStarred, onViewProfile, onNavigate, onSettings }) {
  const { profile } = useAuth();
  const [memberDocs, setMemberDocs] = useState([]);
  const [myChatIds, setMyChatIds] = useState([]);
  const [chatsMap, setChatsMap] = useState({});
  const [othersMap, setOthersMap] = useState({});
  const [groupMemberDocs, setGroupMemberDocs] = useState([]);
  const [myGroupIds, setMyGroupIds] = useState([]);
  const [groupsMap, setGroupsMap] = useState({});
  const [filter, setFilter] = useState('all'); // all | unread | pinned | muted | archived
  const [q, setQ] = useState('');
  const [menuOpen, setMenuOpen] = useState(false);
  const [selected, setSelected] = useState([]); // array of "type_id" keys, e.g. "dm_abc123"
  const [dmsLoaded, setDmsLoaded] = useState(false);
  const [groupsLoaded, setGroupsLoaded] = useState(false);
  const [statusUids, setStatusUids] = useState(new Set());
  const camRef = useRef(null);
  const toast = useToast();

  // Which contacts currently have an active (< 24h old) status update —
  // used to draw the little "someone posted a status" ring around their
  // avatar in the chat list, the same way WhatsApp highlights a contact's
  // avatar when they have a story you haven't seen yet.
  useEffect(() => {
    const cutoff = new Date(Date.now() - 24 * 3600 * 1000);
    const unsub = db.collection('smiletak_statuses').where('createdAt', '>', cutoff).onSnapshot(snap => {
      setStatusUids(new Set(snap.docs.map(d => d.data().uid)));
    });
    return unsub;
  }, []);

  useEffect(() => {
    if (!profile) return;
    const unsub = db.collection('smiletak_chatMembers').where('uid', '==', profile.id).onSnapshot(snap => {
      setMemberDocs(snap.docs.map(d => Object.assign({ id: d.id }, d.data())));
      setDmsLoaded(true);
    });
    return unsub;
  }, [profile]);

  // SELF-HEALING: chatMembers docs are only ever written by their own owner
  // (uid == auth.uid) — a chat's OTHER member can never write your
  // chatMembers doc for you, since that's normally blocked by security
  // rules and there's no server-side function here to do it on their
  // behalf. So instead: whenever this user is listed in a chat's members
  // array but doesn't yet have their own chatMembers doc for it (e.g.
  // someone just started a chat with them), create it themselves, right
  // here, the moment their chat list loads.
  useEffect(() => {
    if (!profile) return;
    const unsub = db.collection('smiletak_chats').where('members', 'array-contains', profile.id).onSnapshot(snap => {
      setMyChatIds(snap.docs.map(d => d.id));
    });
    return unsub;
  }, [profile]);
  useEffect(() => {
    if (!profile) return;
    const known = new Set(memberDocs.map(m => m.chatId));
    myChatIds.forEach(chatId => {
      if (known.has(chatId)) return;
      db.collection('smiletak_chatMembers').doc(chatId + '_' + profile.id).set({
        chatId, uid: profile.id, pinned: false, archived: false, muted: false, unreadCount: 0, lastReadAt: FieldValue.serverTimestamp()
      }, { merge: true }).catch(() => {});
    });
  }, [myChatIds, memberDocs, profile]);

  useEffect(() => {
    memberDocs.forEach(m => {
      if (!chatsMap[m.chatId]) {
        db.collection('smiletak_chats').doc(m.chatId).onSnapshot(s => {
          if (s.exists) setChatsMap(prev => Object.assign({}, prev, { [m.chatId]: Object.assign({ id: s.id }, s.data()) }));
        });
      }
    });
    // eslint-disable-next-line
  }, [memberDocs]);

  useEffect(() => {
    Object.values(chatsMap).forEach(c => {
      const otherUid = (c.members || []).find(u => u !== profile.id);
      if (otherUid && !othersMap[otherUid]) {
        db.collection('smiletak_users').doc(otherUid).onSnapshot(s => {
          if (s.exists) setOthersMap(prev => Object.assign({}, prev, { [otherUid]: Object.assign({ id: s.id }, s.data()) }));
        });
      }
    });
    // eslint-disable-next-line
  }, [chatsMap]);

  // Same self-healing pattern as chats, but for group membership.
  useEffect(() => {
    if (!profile) return;
    const unsub = db.collection('smiletak_groupMembers').where('uid', '==', profile.id).onSnapshot(snap => {
      setGroupMemberDocs(snap.docs.map(d => Object.assign({ id: d.id }, d.data())));
      setGroupsLoaded(true);
    });
    return unsub;
  }, [profile]);
  useEffect(() => {
    if (!profile) return;
    const unsub = db.collection('smiletak_groups').where('members', 'array-contains', profile.id).onSnapshot(snap => {
      setMyGroupIds(snap.docs.map(d => d.id));
    });
    return unsub;
  }, [profile]);
  useEffect(() => {
    if (!profile) return;
    const known = new Set(groupMemberDocs.map(m => m.groupId));
    myGroupIds.forEach(groupId => {
      if (known.has(groupId)) return;
      db.collection('smiletak_groupMembers').doc(groupId + '_' + profile.id).set({
        groupId, uid: profile.id, pinned: false, archived: false, muted: false, unreadCount: 0, lastReadAt: FieldValue.serverTimestamp()
      }, { merge: true }).catch(() => {});
    });
  }, [myGroupIds, groupMemberDocs, profile]);
  useEffect(() => {
    groupMemberDocs.forEach(m => {
      if (!groupsMap[m.groupId]) {
        db.collection('smiletak_groups').doc(m.groupId).onSnapshot(s => {
          if (s.exists) setGroupsMap(prev => Object.assign({}, prev, { [m.groupId]: Object.assign({ id: s.id }, s.data()) }));
        });
      }
    });
    // eslint-disable-next-line
  }, [groupMemberDocs]);

  const dmRows = memberDocs
    .map(m => {
      const chat = chatsMap[m.chatId];
      if (!chat) return null;
      const otherUid = (chat.members || []).find(u => u !== profile.id);
      const other = othersMap[otherUid];
      return { type: 'dm', id: m.chatId, meta: m, chat, other };
    })
    .filter(Boolean);

  const groupRows = groupMemberDocs
    .map(m => {
      const group = groupsMap[m.groupId];
      if (!group) return null;
      return { type: 'group', id: m.groupId, meta: m, chat: group, group };
    })
    .filter(Boolean);

  const allRows = dmRows.concat(groupRows);

  const notArchived = allRows.filter(r => !r.meta.archived);
  const counts = {
    unread: notArchived.filter(r => r.meta.unreadCount > 0).length,
    pinned: notArchived.filter(r => r.meta.pinned).length,
    muted: notArchived.filter(r => r.meta.muted).length,
    archived: allRows.filter(r => r.meta.archived).length
  };

  const rows = allRows
    .filter(r => (filter === 'archived' ? r.meta.archived : !r.meta.archived))
    .filter(r => filter !== 'unread' || r.meta.unreadCount > 0)
    .filter(r => filter !== 'pinned' || r.meta.pinned)
    .filter(r => filter !== 'muted' || r.meta.muted)
    .filter(r => !q.trim() || ((r.type === 'dm' ? (r.other && r.other.fullName) : r.group.name) || '').toLowerCase().includes(q.toLowerCase()))
    .sort((a, b) => {
      if (!!a.meta.pinned !== !!b.meta.pinned) return a.meta.pinned ? -1 : 1;
      const at = a.chat.lastMessageAt ? a.chat.lastMessageAt.toMillis() : 0;
      const bt = b.chat.lastMessageAt ? b.chat.lastMessageAt.toMillis() : 0;
      return bt - at;
    });

  const updateMeta = (row, patch) => {
    const coll = row.type === 'group' ? 'smiletak_groupMembers' : 'smiletak_chatMembers';
    db.collection(coll).doc(row.id + '_' + profile.id).update(patch).catch(e => toast(e.message, 'error'));
  };

  const readAllChats = () => {
    const unreadRows = allRows.filter(r => r.meta.unreadCount > 0);
    if (unreadRows.length === 0) return toast('Nothing to mark as read', 'info');
    unreadRows.forEach(r => updateMeta(r, { unreadCount: 0 }));
    toast('Marked all as read', 'success');
  };

  // SELECTION MODE (long-press a chat, like the native app): shows a top
  // action bar with pin / delete / mute / archive instead of the old
  // per-row chevron dropdown.
  const rowKey = (r) => r.type + '_' + r.id;
  const selectedRows = allRows.filter(r => selected.includes(rowKey(r)));
  const toggleSelect = (r) => setSelected(sel => {
    const k = rowKey(r);
    return sel.includes(k) ? sel.filter(x => x !== k) : sel.concat([k]);
  });
  const startSelect = (r) => setSelected([rowKey(r)]);
  const clearSelect = () => setSelected([]);

  const deleteChat = (row) => {
    // "Delete" removes the chat from *your* list only (your chatMembers /
    // groupMembers doc). The other participant(s) and the chat's messages
    // are untouched, matching the behaviour of the delete icon shown in
    // the screenshot's selection bar.
    const coll = row.type === 'group' ? 'smiletak_groupMembers' : 'smiletak_chatMembers';
    return db.collection(coll).doc(row.id + '_' + profile.id).delete();
  };

  const bulkDelete = async () => {
    if (selectedRows.length === 0) return;
    const n = selectedRows.length;
    if (!window.confirm(n === 1 ? 'Delete this chat?' : 'Delete ' + n + ' chats?')) return;
    try {
      await Promise.all(selectedRows.map(deleteChat));
      toast(n === 1 ? 'Chat deleted' : n + ' chats deleted', 'success');
    } catch (e) { toast(e.message, 'error'); }
    clearSelect();
  };
  const bulkPin = () => { selectedRows.forEach(r => updateMeta(r, { pinned: !r.meta.pinned })); clearSelect(); };
  const bulkMute = () => { selectedRows.forEach(r => updateMeta(r, { muted: !r.meta.muted })); clearSelect(); };
  const bulkArchive = () => { selectedRows.forEach(r => updateMeta(r, { archived: !r.meta.archived })); clearSelect(); };

  const postCameraStatus = async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    try {
      const url = await uploadFile('smiletak/status/' + profile.id + '/' + Date.now() + '_' + f.name, f);
      await db.collection('smiletak_statuses').add({ uid: profile.id, type: 'image', mediaURL: url, createdAt: FieldValue.serverTimestamp() });
      toast('Status posted', 'success');
    } catch (err) { toast('Upload failed: ' + err.message, 'error'); }
  };

  const chips = [
    { id: 'all', label: 'All' },
    { id: 'unread', label: 'Unread', count: counts.unread },
    { id: 'pinned', label: 'Pinned', count: counts.pinned },
    { id: 'muted', label: 'Muted', count: counts.muted }
  ];

  return h('div', { className: 'h-full flex flex-col bg-white dark:bg-ink-900 relative' },
    selected.length > 0
      ? h('div', { className: 'px-4 pt-4 pb-3 flex items-center gap-4 bg-slate-50 dark:bg-ink-800' },
          h('button', { className: 'text-xl', onClick: clearSelect }, h('i', { className: 'fa-solid fa-arrow-left' })),
          h('span', { className: 'text-lg font-bold flex-1' }, selected.length),
          h('button', { className: 'text-xl', title: 'Pin', onClick: bulkPin }, h('i', { className: 'fa-solid fa-thumbtack' })),
          h('button', { className: 'text-xl', title: 'Delete', onClick: bulkDelete }, h('i', { className: 'fa-solid fa-trash' })),
          h('button', { className: 'text-xl', title: 'Mute', onClick: bulkMute }, h('i', { className: 'fa-solid fa-bell-slash' })),
          h('button', { className: 'text-xl', title: 'Archive', onClick: bulkArchive }, h('i', { className: 'fa-solid fa-box-archive' }))
        )
      : h('div', { className: 'px-4 pt-4 pb-3 flex items-center justify-between' },
      h('h1', { className: 'text-2xl font-extrabold' }, filter === 'archived' ? 'Archived' : 'SmileTak'),
      filter === 'archived'
        ? h('button', { className: 'text-sm text-brand-600 font-semibold', onClick: () => setFilter('all') }, 'Back')
        : h('div', { className: 'flex items-center gap-4' },
            h('input', { type: 'file', accept: 'image/*', capture: 'environment', ref: camRef, className: 'hidden', onChange: postCameraStatus }),
            h('button', { className: 'text-xl', onClick: () => camRef.current.click(), title: 'Camera status' }, h('i', { className: 'fa-solid fa-camera' })),
            h('div', { className: 'relative' },
              h('button', { className: 'text-xl', onClick: () => setMenuOpen(o => !o) }, h('i', { className: 'fa-solid fa-ellipsis-vertical' })),
              menuOpen && h('div', { className: 'absolute right-0 top-8 z-20 bg-white dark:bg-ink-700 shadow-lg rounded-xl py-1 w-48 text-sm', onMouseLeave: () => setMenuOpen(false) },
                h('button', { className: 'w-full text-left px-3 py-2 hover:bg-slate-50 dark:hover:bg-ink-600', onClick: () => { setMenuOpen(false); onNewGroup && onNewGroup(); } }, h('i', { className: 'fa-solid fa-users mr-2' }), 'New group'),
                h('button', { className: 'w-full text-left px-3 py-2 hover:bg-slate-50 dark:hover:bg-ink-600', onClick: () => { setMenuOpen(false); onNewBroadcast && onNewBroadcast(); } }, h('i', { className: 'fa-solid fa-bullhorn mr-2' }), 'New broadcast'),
                h('button', { className: 'w-full text-left px-3 py-2 hover:bg-slate-50 dark:hover:bg-ink-600', onClick: () => { setMenuOpen(false); onLinkedDevices && onLinkedDevices(); } }, h('i', { className: 'fa-solid fa-laptop-mobile mr-2' }), 'Linked devices'),
                h('button', { className: 'w-full text-left px-3 py-2 hover:bg-slate-50 dark:hover:bg-ink-600', onClick: () => { setMenuOpen(false); onStarred && onStarred(); } }, h('i', { className: 'fa-solid fa-star mr-2' }), 'Starred'),
                h('button', { className: 'w-full text-left px-3 py-2 hover:bg-slate-50 dark:hover:bg-ink-600', onClick: () => { setMenuOpen(false); readAllChats(); } }, h('i', { className: 'fa-solid fa-check-double mr-2' }), 'Read all'),
                h('button', { className: 'w-full text-left px-3 py-2 hover:bg-slate-50 dark:hover:bg-ink-600', onClick: () => { setMenuOpen(false); setFilter('archived'); } }, h('i', { className: 'fa-solid fa-box-archive mr-2' }), 'Archived'),
                h('button', { className: 'w-full text-left px-3 py-2 hover:bg-slate-50 dark:hover:bg-ink-600', onClick: () => { setMenuOpen(false); onSettings && onSettings(); } }, h('i', { className: 'fa-solid fa-gear mr-2' }), 'Settings')
              )
            )
          )
    ),
    filter !== 'archived' && h('div', { className: 'px-4 pb-3' },
      h('div', { className: 'relative' },
        h('i', { className: 'fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs' }),
        h('input', { className: 'w-full pl-9 pr-3 py-2.5 rounded-full bg-slate-100 dark:bg-ink-800 text-sm focus:outline-none', placeholder: 'Search', value: q, onChange: e => setQ(e.target.value) })
      )
    ),
    filter !== 'archived' && h('div', { className: 'flex gap-2 px-4 pb-2 overflow-x-auto no-scrollbar' },
      chips.map(c => h('button', {
        key: c.id,
        onClick: () => setFilter(c.id),
        className: 'px-3.5 py-1.5 rounded-full text-sm font-medium whitespace-nowrap flex items-center gap-1.5 ' +
          (filter === c.id ? 'bg-brand-600 text-white' : 'bg-slate-100 dark:bg-ink-800 text-slate-700 dark:text-slate-200')
      }, c.label, typeof c.count === 'number' && c.count > 0 && h('span', { className: 'text-xs ' + (filter === c.id ? 'text-white/80' : 'text-slate-400') }, c.count))
      )
    ),
    filter !== 'archived' && counts.archived > 0 && h('div', {
      className: 'flex items-center gap-3 px-4 py-2.5 cursor-pointer hover:bg-slate-50 dark:hover:bg-ink-800 border-b border-slate-100 dark:border-ink-800',
      onClick: () => setFilter('archived')
    },
      h('div', { className: 'w-9 h-9 rounded-full bg-slate-100 dark:bg-ink-700 flex items-center justify-center text-slate-500' }, h('i', { className: 'fa-solid fa-box-archive text-sm' })),
      h('span', { className: 'font-medium text-sm text-slate-600 dark:text-slate-300' }, 'Archived'),
      h('span', { className: 'ml-auto text-xs text-slate-400' }, counts.archived)
    ),
    h('div', { className: 'flex-1 overflow-y-auto no-scrollbar' },
      !(dmsLoaded && groupsLoaded) && Array.from({ length: 7 }).map((_, i) => h(ChatRowSkeleton, { key: 'skel' + i })),
      (dmsLoaded && groupsLoaded) && rows.length === 0 && h('div', { className: 'text-center mt-14 px-8' },
        h('div', { className: 'w-16 h-16 rounded-full bg-brand-50 dark:bg-ink-800 text-brand-500 flex items-center justify-center mx-auto mb-3' },
          h('i', { className: 'fa-solid fa-comment-dots text-2xl' })
        ),
        h('p', { className: 'font-semibold text-sm text-slate-600 dark:text-slate-200 mb-1' },
          filter === 'archived' ? 'No archived chats' :
          filter === 'unread' ? 'No unread chats' :
          filter === 'pinned' ? 'No pinned chats' :
          filter === 'muted' ? 'No muted chats' :
          'No chats yet'
        ),
        h('p', { className: 'text-xs text-slate-400 mb-4' },
          filter === 'all' ? 'Start a conversation and it will show up here.' : 'Chats matching this filter will show up here.'
        ),
        filter === 'all' && h('button', {
          onClick: onNewChat,
          className: 'px-4 py-2 rounded-full bg-brand-600 text-white text-sm font-semibold'
        }, 'Start a new chat')
      ),
      rows.map(r => h(ChatRow, {
        key: r.type + '_' + r.id,
        row: r,
        hasStatus: r.type === 'dm' && !!(r.other && statusUids.has(r.other.id)),
        selectMode: selected.length > 0,
        isSelected: selected.includes(rowKey(r)),
        onOpen: () => {
          if (selected.length > 0) return toggleSelect(r);
          if (r.type === 'group') onOpenGroup(r.id, r.group);
          else onOpenChat({ chatId: r.id, other: r.other });
          if (r.meta.unreadCount) updateMeta(r, { unreadCount: 0 });
        },
        onLongPress: () => startSelect(r),
        onPin: () => updateMeta(r, { pinned: !r.meta.pinned }),
        onMute: () => updateMeta(r, { muted: !r.meta.muted }),
        onArchive: () => updateMeta(r, { archived: !r.meta.archived }),
        onProfile: () => { if (r.type === 'dm' && r.other) onViewProfile(r.other.id); }
      }))
    ),
    filter !== 'archived' && h('button', {
      onClick: onNewChat,
      className: 'absolute bottom-5 right-5 w-14 h-14 rounded-full bg-brand-600 text-white shadow-lg flex items-center justify-center text-xl active:scale-95 transition'
    }, h('i', { className: 'fa-solid fa-comment-medical' }))
  );
}

function ChatRowSkeleton() {
  return h('div', { className: 'flex items-center gap-3 px-4 py-3' },
    h('div', { className: 'skel shrink-0', style: { width: 48, height: 48, borderRadius: 9999 } }),
    h('div', { className: 'flex-1 min-w-0 border-b border-slate-100 dark:border-ink-800 pb-3 -mb-3' },
      h('div', { className: 'flex justify-between items-baseline mb-2' },
        h('div', { className: 'skel', style: { width: '40%', height: 12 } }),
        h('div', { className: 'skel', style: { width: 30, height: 10 } })
      ),
      h('div', { className: 'skel', style: { width: '65%', height: 11 } })
    )
  );
}
function ChatRow({ row, onOpen, onLongPress, selectMode, isSelected, onPin, onMute, onArchive, onProfile, hasStatus }) {
  if (row.type === 'group') return h(GroupChatRow, { row, onOpen, onLongPress, selectMode, isSelected, onPin, onMute, onArchive });
  return h(DmChatRow, { row, onOpen, onLongPress, selectMode, isSelected, onPin, onMute, onArchive, onProfile, hasStatus });
}
// Small checkmark badge shown over an avatar once a chat is selected —
// same spot/behaviour as the green check badge in the native app.
function SelectBadge({ selected }) {
  return h('span', {
    className: 'absolute -bottom-0.5 -right-0.5 w-[18px] h-[18px] rounded-full flex items-center justify-center border-2 border-white dark:border-ink-900 ' +
      (selected ? 'bg-brand-500' : 'bg-white dark:bg-ink-700 border-slate-300 dark:border-ink-600')
  }, selected && h('i', { className: 'fa-solid fa-check text-white text-[9px]' }));
}
function GroupChatRow({ row, onOpen, onLongPress, selectMode, isSelected, onPin, onMute, onArchive }) {
  const { group, meta } = row;
  const unread = !!meta.unreadCount;
  // Two separate press zones (avatar / rest of row), same as before —
  // tapping either opens the chat (or toggles selection once in select
  // mode); holding either starts selection.
  const avatarPress = useLongPress(onLongPress, () => { if (selectMode) onOpen(); }, 500);
  const contentPress = useLongPress(onLongPress, onOpen, 500);

      h('div', { className: 'flex justify-between items-baseline' },
        h('p', { className: 'font-semibold text-[15px] truncate' }, h('i', { className: 'fa-solid fa-users text-slate-400 text-xs mr-1' }), group.name),
        h('span', { className: 'text-[12px] shrink-0 ml-2 ' + (unread ? 'text-brand-500 font-semibold' : 'text-slate-400') }, group.lastMessageAt ? timeAgo(group.lastMessageAt) : '')
      ),

        h('p', { className: 'text-[13px] truncate max-w-[75%] ' + (unread ? 'text-slate-700 dark:text-slate-200 font-medium' : 'text-slate-400') }, group.lastMessage || 'Group created'),

        )
      )
    )
  );
}
function DmChatRow({ row, onOpen, onLongPress, selectMode, isSelected, onPin, onMute, onArchive, onProfile, hasStatus } ) {
  const { meta, chat, other } = row;
  const typing = chat.typing && other && chat.typing[other.id] && (Date.now() - (chat.typing[other.id].toMillis ? chat.typing[other.id].toMillis() : 0) < 5000);

  // Two separate press zones (avatar / rest of row), same as before —

      h('div', { className: 'flex justify-between items-baseline' },
        h('p', { className: 'font-semibold text-[15px] truncate' }, h(NameWithBadges, { name: (other && other.fullName) || 'Unknown user', user: other })),
        h('span', { className: 'text-[12px] shrink-0 ml-2 ' + (unread ? 'text-brand-500 font-semibold' : 'text-slate-400') }, chat.lastMessageAt ? timeAgo(chat.lastMessageAt) : '')
      ),
      h('div', { className: 'flex justify-between items-center mt-0.5' },
        h('p', { className: 'text-[13px] truncate max-w-[75%] ' + (unread ? 'text-slate-700 dark:text-slate-200 font-medium' : 'text-slate-400') },
          typing ? h('span', { className: 'text-brand-500 font-medium' }, 'typing…') :
          (meta.muted && h('i', { className: 'fa-solid fa-volume-xmark mr-1 text-slate-400' })),
          !typing && (chat.lastMessage || 'Say hello 👋')),
        h('div', { className: 'flex items-center gap-1.5 shrink-0' },
          meta.pinned && h('i', { className: 'fa-solid fa-thumbtack text-slate-300 text-[11px]' }),
          unread && h('span', { className: 'bg-brand-500 text-white text-[11px] font-bold rounded-full min-w-[20px] h-[20px] flex items-center justify-center px-1.5' }, meta.unreadCount > 99 ? '99+' : meta.unreadCount)
        )
      )
    )
  );
}
