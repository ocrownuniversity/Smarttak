function GroupCreateScreen({ onBack, onCreated }) {
  const { profile } = useAuth();
  const toast = useToast();
  const [q, setQ] = useState('');
  const [results, setResults] = useState([]);
  const [selected, setSelected] = useState([]); // array of user objects
  const [name, setName] = useState('');
  const [photoFile, setPhotoFile] = useState(null);
  const [creating, setCreating] = useState(false);
  const [step, setStep] = useState('pick'); // pick | name

  const runSearch = async () => {
    const term = q.trim();
    if (!term) { setResults([]); return; }
    try {
      const lower = term.toLowerCase();
      const snaps = await Promise.all([
        db.collection('smiletak_users').orderBy('username').startAt(lower).endAt(lower + '\uf8ff').limit(10).get(),
        db.collection('smiletak_users').orderBy('fullName').startAt(term).endAt(term + '\uf8ff').limit(10).get()
      ]);
      const map = {};
      snaps.forEach(s => s.docs.forEach(d => { if (d.id !== profile.id) map[d.id] = Object.assign({ id: d.id }, d.data()); }));
      setResults(Object.values(map));
    } catch (e) { toast(e.message, 'error'); }
  };

  const toggle = (u) => setSelected(sel => sel.find(x => x.id === u.id) ? sel.filter(x => x.id !== u.id) : sel.concat([u]));

  const create = async () => {
    if (!name.trim()) return toast('Enter a group name', 'error');
    if (selected.length === 0) return toast('Pick at least one member', 'error');
    setCreating(true);
    try {
      let photoURL = null;
      if (photoFile) photoURL = await uploadFile('smiletak/groups/' + Date.now() + '_' + photoFile.name, photoFile);
      const members = [profile.id].concat(selected.map(u => u.id));
      const ref = db.collection('smiletak_groups').doc();
      await ref.set({
        name: name.trim(), photoURL, description: '', members, admins: [profile.id],
        createdBy: profile.id, createdAt: FieldValue.serverTimestamp()
      });
      await db.collection('smiletak_groupMembers').doc(ref.id + '_' + profile.id).set({
        groupId: ref.id, uid: profile.id, pinned: false, archived: false, muted: false, unreadCount: 0, lastReadAt: FieldValue.serverTimestamp()
      });
      toast('Group created', 'success');
      onCreated(ref.id, { id: ref.id, name: name.trim(), photoURL, members, admins: [profile.id] });
    } catch (e) { toast(e.message, 'error'); }
    setCreating(false);
  };

  if (step === 'name') {
    return h('div', { className: 'h-full flex flex-col' },
      h('div', { className: 'flex items-center gap-3 px-3 py-2.5 border-b border-slate-100 dark:border-ink-800' },
        h('button', { onClick: () => setStep('pick'), className: 'text-slate-500' }, h('i', { className: 'fa-solid fa-arrow-left' })),
        h('p', { className: 'font-semibold' }, 'New group · ' + selected.length + ' member(s)')
      ),
      h('div', { className: 'p-4' },
        h('input', { type: 'file', accept: 'image/*', id: 'grp-photo', className: 'hidden', onChange: e => setPhotoFile(e.target.files[0]) }),
        h('label', { htmlFor: 'grp-photo', className: 'flex flex-col items-center mb-4 cursor-pointer' },
          h(Avatar, { url: photoFile ? URL.createObjectURL(photoFile) : null, name: name || 'G', size: 88 }),
          h('span', { className: 'text-xs text-brand-600 mt-1' }, 'Add group photo')
        ),
        h('input', { className: inputCls, placeholder: 'Group name', value: name, onChange: e => setName(e.target.value) }),
        h('button', { onClick: create, disabled: creating, className: 'w-full bg-brand-600 text-white rounded-xl py-2.5 font-semibold text-sm' }, creating ? 'Creating…' : 'Create group')
      )
    );
  }

  return h('div', { className: 'h-full flex flex-col' },
    h('div', { className: 'flex items-center gap-3 px-3 py-2.5 border-b border-slate-100 dark:border-ink-800' },
      h('button', { onClick: onBack, className: 'text-slate-500' }, h('i', { className: 'fa-solid fa-arrow-left' })),
      h('p', { className: 'font-semibold' }, 'Add group members')
    ),
    selected.length > 0 && h('div', { className: 'flex gap-2 px-4 py-2 overflow-x-auto no-scrollbar' },
      selected.map(u => h('div', { key: u.id, className: 'flex flex-col items-center shrink-0', onClick: () => toggle(u) },
        h(Avatar, { url: u.photoURL, name: u.fullName, size: 48 }),
        h('span', { className: 'text-[10px] mt-1 max-w-[52px] truncate' }, u.fullName)
      ))
    ),
    h('div', { className: 'px-4 pb-2' },
      h('input', { className: inputCls + ' mb-0', placeholder: 'Search people to add', value: q, onChange: e => { setQ(e.target.value); }, onKeyUp: runSearch })
    ),
    h('div', { className: 'flex-1 overflow-y-auto no-scrollbar px-2' },
      results.map(u => {
        const picked = !!selected.find(x => x.id === u.id);
        return h('div', { key: u.id, className: 'flex items-center gap-3 px-2 py-2.5 cursor-pointer', onClick: () => toggle(u) },
          h(Avatar, { url: u.photoURL, name: u.fullName, size: 44 }),
          h('div', { className: 'flex-1 min-w-0' }, h('p', { className: 'font-semibold text-sm' }, u.fullName), h('p', { className: 'text-xs text-slate-400' }, '@' + u.username)),
          h('div', { className: 'w-5 h-5 rounded-full border-2 flex items-center justify-center ' + (picked ? 'bg-brand-600 border-brand-600' : 'border-slate-300') }, picked && h('i', { className: 'fa-solid fa-check text-white text-[10px]' }))
        );
      })
    ),
    h('div', { className: 'p-4' },
      h('button', { onClick: () => setStep('name'), disabled: selected.length === 0, className: 'w-full bg-brand-600 text-white rounded-xl py-2.5 font-semibold text-sm disabled:opacity-40' }, 'Next (' + selected.length + ')')
    )
  );
}

function GroupChatWindow({ groupId, group: groupProp, onBack, onInfo }) {
  const { profile } = useAuth();
  const toast = useToast();
  const [group, setGroup] = useState(groupProp || null);
  const [messages, setMessages] = useState([]);
  const [membersMap, setMembersMap] = useState({});
  const [text, setText] = useState('');
  const [uploadPct, setUploadPct] = useState(null);
  const fileRef = useRef(null);
  const scrollRef = useRef(null);
  const call = useCall();

  // Chat lock (device-local, see lsGet/lsSet comment above): if this group
  // is on the locked list and hasn't been unlocked yet this tab session,
  // gate the whole screen behind a PIN prompt before anything else runs.
  const [unlocked, setUnlocked] = useState(() => sessionStorage.getItem('st_unlocked_' + groupId) === '1');
  const isLocked = lsGet('st_lockedGroups', []).includes(groupId) && !unlocked;

  useEffect(() => { const unsub = db.collection('smiletak_groups').doc(groupId).onSnapshot(s => { if (s.exists) setGroup(Object.assign({ id: s.id }, s.data())); }); return unsub; }, [groupId]);
  // "On call" banner: watches for any active smiletak_groupCalls doc tied
  // to this group so members see a call is in progress (and can join it)
  // even if they missed/dismissed the incoming-ring popup.
  const [activeGroupCall, setActiveGroupCall] = useState(null);
  useEffect(() => {
    const unsub = db.collection('smiletak_groupCalls')
      .where('groupId', '==', groupId).where('status', '==', 'active')
      .onSnapshot(snap => setActiveGroupCall(snap.empty ? null : Object.assign({ id: snap.docs[0].id }, snap.docs[0].data())),
        () => {});
    return unsub;
  }, [groupId]);
  const iAmOnThisCall = !!(call.groupCall && activeGroupCall && call.groupCall.id === activeGroupCall.id);
  useEffect(() => {
    if (isLocked) return; // don't even subscribe to messages until unlocked
    const unsub = db.collection('smiletak_groups').doc(groupId).collection('messages').orderBy('createdAt', 'asc').limitToLast(200).onSnapshot(snap => {
      setMessages(snap.docs.map(d => Object.assign({ id: d.id }, d.data())));
    });
    return unsub;
    // eslint-disable-next-line
  }, [groupId, isLocked]);
  useEffect(() => {
    if (!group) return;
    (group.members || []).forEach(uid => {
      if (!membersMap[uid]) db.collection('smiletak_users').doc(uid).get().then(s => { if (s.exists) setMembersMap(prev => Object.assign({}, prev, { [uid]: Object.assign({ id: s.id }, s.data()) })); });
    });
    // eslint-disable-next-line
  }, [group]);
  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [messages.length]);
  useEffect(() => {
    if (isLocked) return;
    db.collection('smiletak_groupMembers').doc(groupId + '_' + profile.id).update({ unreadCount: 0, lastReadAt: FieldValue.serverTimestamp() }).catch(() => {});
  }, [groupId, profile.id, isLocked]);

  // Disappearing messages: opportunistic cleanup. There's no Cloud
  // Functions/cron in this app, so expired messages are swept out whenever
  // anyone with the chat open notices them — same "self-heal on next visit"
  // pattern used elsewhere in this file. Expired docs are also filtered out
  // of `messages` below so nobody sees them even in the brief window before
  // the delete completes.
  useEffect(() => {
    if (isLocked || !messages.length) return;
    const now = Date.now();
    const expired = messages.filter(m => m.expiresAt && m.expiresAt.toMillis && m.expiresAt.toMillis() < now);
    if (!expired.length) return;
    const batch = db.batch();
    expired.forEach(m => batch.delete(db.collection('smiletak_groups').doc(groupId).collection('messages').doc(m.id)));
    batch.commit().catch(() => {});
  }, [messages, groupId, isLocked]);
  const visibleMessages = useMemo(() => {
    const now = Date.now();
    return messages.filter(m => !(m.expiresAt && m.expiresAt.toMillis && m.expiresAt.toMillis() < now));
  }, [messages]);

  const isAdmin = group && (group.admins || []).includes(profile.id);
  const canSend = !group || !group.onlyAdminsCanMessage || isAdmin;

  const sendMessage = async (payload) => {
    if (!canSend) return;
    const base = { senderId: profile.id, createdAt: FieldValue.serverTimestamp(), readBy: [], deletedFor: [] };
    if (group && group.disappearingMs) base.expiresAt = Timestamp.fromMillis(Date.now() + group.disappearingMs);
    await db.collection('smiletak_groups').doc(groupId).collection('messages').add(Object.assign(base, payload));
    const preview = payload.type === 'text' ? payload.text : ('📎 ' + payload.type);
    await db.collection('smiletak_groups').doc(groupId).set({ lastMessage: preview.slice(0, 100), lastMessageAt: FieldValue.serverTimestamp(), lastSenderId: profile.id }, { merge: true });
    // Each OTHER member's own unread bump is a cross-user write and is
    // expected to be blocked — same self-heal reasoning as 1:1 chats.
    (group.members || []).filter(u => u !== profile.id).forEach(uid => {
      db.collection('smiletak_groupMembers').doc(groupId + '_' + uid).set({ unreadCount: FieldValue.increment(1) }, { merge: true }).catch(() => {});
    });
    setText('');
  };

  const onPickFile = async (e) => {
    if (!canSend) return;
    const f = e.target.files[0]; if (!f) return;
    fileRef.current.value = '';
    const capMB = isPremiumActive(profile) ? 200 : 25;
    if (f.size > capMB * 1024 * 1024) { toast('File must be under ' + capMB + 'MB', 'error'); return; }
    let type = 'document';
    if (f.type.startsWith('image/')) type = 'image';
    else if (f.type.startsWith('video/')) type = 'video';
    else if (f.type.startsWith('audio/')) type = 'audio';
    try {
      setUploadPct(0);
      const url = await uploadFile('smiletak/groupMedia/' + groupId + '/' + Date.now() + '_' + f.name, f, p => setUploadPct(p));
      await sendMessage({ type, mediaURL: url, mediaName: f.name, mediaSize: f.size, text: '' });
    } catch (err) { toast('Upload failed: ' + err.message, 'error'); }
    setUploadPct(null);
  };

  const callGroup = (type) => {
    const others = (group.members || []).filter(u => u !== profile.id);
    if (others.length === 0) return;
    call.startGroupCall(others, type, groupId, group.name);
  };

  if (!group) return h('div', { className: 'p-6 flex items-center justify-center' }, h('div', { className: 'w-6 h-6 border-2 border-brand-500 border-t-transparent rounded-full spinner' }));

  if (isLocked) {
    return h(ChatLockGate, {
      name: group.name, photoURL: group.photoURL, onBack,
      onUnlock: () => { sessionStorage.setItem('st_unlocked_' + groupId, '1'); setUnlocked(true); }
    });
  }

  return h('div', { className: 'h-full flex flex-col bg-slate-50 dark:bg-ink-900' },
    h('div', { className: 'flex items-center gap-2 px-3 py-2.5 bg-white dark:bg-ink-800 border-b border-slate-100 dark:border-ink-700' },
      h('button', { onClick: onBack, className: 'text-slate-500 px-1' }, h('i', { className: 'fa-solid fa-arrow-left' })),
      h('div', { className: 'flex items-center gap-2 flex-1 min-w-0 cursor-pointer', onClick: onInfo },
        h(Avatar, { url: group.photoURL, name: group.name, size: 36 }),
        h('div', { className: 'min-w-0' },
          h('p', { className: 'font-semibold text-sm truncate' }, group.name),
          activeGroupCall
            ? h('button', {
                onClick: () => !iAmOnThisCall && call.joinGroupCall({ id: activeGroupCall.id, type: activeGroupCall.type, groupName: group.name }),
                className: 'text-[11px] text-green-600 dark:text-green-400 font-semibold flex items-center gap-1'
              },
                h('span', { className: 'w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse' }),
                iAmOnThisCall ? 'On call' : ('On call · tap to join')
              )
            : h('p', { className: 'text-[11px] text-slate-400 truncate flex items-center gap-1' },
                (group.members || []).length + ' members',
                group.disappearingMs ? h('i', { className: 'fa-solid fa-clock', title: 'Disappearing messages on' }) : null
              )
        )
      ),
      h('button', { className: 'text-slate-400 px-2', onClick: () => callGroup('audio') }, h('i', { className: 'fa-solid fa-phone' })),
      h('button', { className: 'text-slate-400 px-2', onClick: () => callGroup('video') }, h('i', { className: 'fa-solid fa-video' }))
    ),
    h('div', { ref: scrollRef, className: 'flex-1 overflow-y-auto no-scrollbar px-3 py-3' },
      visibleMessages.map(m => m.type === 'call'
        ? h(CallLogRow, { key: m.id, m })
        : h(GroupMessageBubble, { key: m.id, m, mine: m.senderId === profile.id, sender: membersMap[m.senderId], groupId, advancedPrivacy: !!group.advancedPrivacy })
      )
    ),
    typeof uploadPct === 'number' && h('div', { className: 'px-3 pb-1 text-xs text-slate-400' }, 'Uploading… ' + uploadPct + '%'),
    canSend
      ? h('div', { className: 'flex items-center gap-2 px-3 py-2 bg-white dark:bg-ink-800 border-t border-slate-100 dark:border-ink-700' },
          h('input', { type: 'file', ref: fileRef, className: 'hidden', onChange: onPickFile }),
          h('button', { className: 'text-slate-400 px-1', onClick: () => fileRef.current.click() }, h('i', { className: 'fa-solid fa-paperclip text-lg' })),
          h('input', {
            className: 'flex-1 px-4 py-2.5 rounded-full bg-slate-100 dark:bg-ink-700 text-sm focus:outline-none', placeholder: 'Message',
            value: text, onChange: e => setText(e.target.value),
            onKeyDown: e => { if (e.key === 'Enter' && text.trim()) sendMessage({ type: 'text', text: text.trim() }); }
          }),
          h('button', { className: 'w-10 h-10 rounded-full bg-brand-600 text-white flex items-center justify-center shrink-0', onClick: () => text.trim() && sendMessage({ type: 'text', text: text.trim() }) }, h('i', { className: 'fa-solid fa-paper-plane text-sm' }))
        )
      : h('div', { className: 'px-4 py-3 bg-white dark:bg-ink-800 border-t border-slate-100 dark:border-ink-700 text-center text-xs text-slate-400' },
          h('i', { className: 'fa-solid fa-lock mr-1' }), 'Only admins can send messages in this group'
        )
  );
}

/* Device-local PIN gate shown instead of the chat when a group has Chat
   lock turned on (see GroupInfoScreen → ChatLockModal). The PIN itself
   lives only in this browser's localStorage — nothing is sent to Firestore. */
function ChatLockGate({ name, photoURL, onBack, onUnlock }) {
  const toast = useToast();
  const [pin, setPin] = useState('');
  const [error, setError] = useState('');
  const submit = () => {
    const stored = lsGet('st_chatLockPin', null);
    if (!stored) { onUnlock(); return; } // lock was on but PIN got cleared somehow — fail open rather than trap the user out of their own chat
    if (simplePinHash(pin) === stored) { onUnlock(); }
    else { setError('Wrong PIN'); setPin(''); }
  };
  return h('div', { className: 'h-full flex flex-col items-center justify-center gap-4 bg-white dark:bg-ink-900 px-8' },
    h('button', { onClick: onBack, className: 'absolute top-4 left-4 text-slate-500' }, h('i', { className: 'fa-solid fa-arrow-left' })),
    h(Avatar, { url: photoURL, name, size: 72 }),
    h('p', { className: 'font-semibold' }, name),
    h('p', { className: 'text-xs text-slate-400 flex items-center gap-1' }, h('i', { className: 'fa-solid fa-lock' }), 'This chat is locked on this device'),
    h('input', {
      type: 'password', inputMode: 'numeric', maxLength: 6, autoFocus: true, placeholder: 'Enter PIN',
      className: inputCls + ' text-center tracking-widest w-40 mb-0', value: pin,
      onChange: e => { setError(''); setPin(e.target.value.replace(/\D/g, '')); },
      onKeyDown: e => { if (e.key === 'Enter' && pin) submit(); }
    }),
    error && h('p', { className: 'text-xs text-red-500' }, error),
    h('button', { onClick: submit, disabled: !pin, className: 'bg-brand-600 text-white rounded-xl px-6 py-2 text-sm font-semibold disabled:opacity-40' }, 'Unlock')
  );
}

function GroupMessageBubble({ m, mine, sender, groupId, advancedPrivacy }) {
  // Media visibility: a per-device, per-group preference (Group info →
  // Settings → Media visibility). When off, photos/videos in THIS group
  // render as a tap-to-reveal placeholder instead of loading inline — this
  // controls in-app visibility only. A browser page has no way to reach a
  // phone's OS Gallery/MediaStore to hide files there (that needs native
  // app storage permissions), so this intentionally doesn't claim to do that.
  const [revealed, setRevealed] = useState(false);
  const mediaVisible = lsGet('st_mediaVisible_' + groupId, true);
  const showMediaInline = mediaVisible || revealed;
  const isMedia = m.type === 'image' || m.type === 'video';

  return h('div', { className: 'flex mb-2 ' + (mine ? 'justify-end' : 'justify-start') },
    h('div', {
      className: 'max-w-[78%] rounded-2xl px-3 py-2 text-sm ' + (mine ? 'bg-brand-600 text-white rounded-br-sm' : 'bg-white dark:bg-ink-800 rounded-bl-sm shadow-sm'),

    db.collection('smiletak_groups').doc(groupId).collection('messages')
      .where('type', 'in', ['image', 'video', 'audio', 'voice', 'document']).get()

        const byType = {};
        let totalBytes = 0;
        s.docs.forEach(d => {
          const m = d.data();
          const size = m.mediaSize || 0;
          totalBytes += size;
          byType[m.type] = byType[m.type] || { count: 0, bytes: 0 };
          byType[m.type].count++;
          byType[m.type].bytes += size;
        });
        setStats({ byType, totalBytes, total: s.size });
      }).catch(() => setStats({ byType: {}, totalBytes: 0, total: 0 }));
  }, [groupId]);
  const freeUpSpace = () => {
    lsSet('st_mediaVisible_' + groupId, false);
    toast('Media in this chat will now load only when you tap it', 'success');
    onClose();
  };
  const TYPE_LABEL = { image: 'Photos', video: 'Videos', audio: 'Audio files', voice: 'Voice notes', document: 'Documents' };
  return h('div', { className: 'fixed inset-0 z-[900] bg-white dark:bg-ink-900 flex flex-col' },
    h('div', { className: 'flex items-center gap-3 px-3 py-2.5 border-b border-slate-100 dark:border-ink-800' },
      h('button', { onClick: onClose, className: 'text-slate-500' }, h('i', { className: 'fa-solid fa-arrow-left' })),
      h('p', { className: 'font-semibold' }, 'Manage storage')
    ),
    h('div', { className: 'flex-1 overflow-y-auto no-scrollbar p-4' },
      !stats && h('div', { className: 'flex justify-center mt-8' }, h('div', { className: 'w-6 h-6 border-2 border-brand-500 border-t-transparent rounded-full spinner' })),
      stats && h('div', null,
        h('p', { className: 'text-3xl font-extrabold' }, bytesToSize(stats.totalBytes) || '0 B'),
        h('p', { className: 'text-xs text-slate-400 mb-6' }, stats.total + ' item' + (stats.total === 1 ? '' : 's') + ' shared in this group'),
        Object.keys(stats.byType).length === 0 && h('p', { className: 'text-sm text-slate-400' }, 'No media shared yet'),
        Object.keys(stats.byType).map(t => h('div', { key: t, className: 'flex items-center justify-between py-2.5 border-b border-slate-100 dark:border-ink-800' },
          h('span', { className: 'text-sm' }, TYPE_LABEL[t] || t),

}

  return Math.round(ms / 3600000) + ' hours';

function NewBroadcastScreen({ onBack }) {
  const { profile } = useAuth();
  const toast = useToast();
  const [q, setQ] = useState('');
  const [results, setResults] = useState([]);
  const [selected, setSelected] = useState([]);
  const [text, setText] = useState('');
  const [sending, setSending] = useState(false);

  const runSearch = async () => {
    const term = q.trim();
    if (!term) { setResults([]); return; }
    try {
      const snaps = await Promise.all([
        db.collection('smiletak_users').orderBy('username').startAt(term.toLowerCase()).endAt(term.toLowerCase() + '\uf8ff').limit(10).get(),
        db.collection('smiletak_users').orderBy('fullName').startAt(term).endAt(term + '\uf8ff').limit(10).get()
      ]);
      const map = {};
      snaps.forEach(s => s.docs.forEach(d => { if (d.id !== profile.id) map[d.id] = Object.assign({ id: d.id }, d.data()); }));
      setResults(Object.values(map));
    } catch (e) { toast(e.message, 'error'); }
  };
  const toggle = (u) => setSelected(sel => sel.find(x => x.id === u.id) ? sel.filter(x => x.id !== u.id) : sel.concat([u]));

  const send = async () => {
    if (selected.length === 0) return toast('Pick at least one recipient', 'error');
    if (!text.trim()) return toast('Write a message', 'error');
    setSending(true);
    try {
      await Promise.all(selected.map(async (other) => {
        const chatId = chatIdFor(profile.id, other.id);
        await db.collection('smiletak_chats').doc(chatId).set({ members: [profile.id, other.id], createdAt: FieldValue.serverTimestamp() }, { merge: true });
        await db.collection('smiletak_chatMembers').doc(chatId + '_' + profile.id).set({ chatId, uid: profile.id, pinned: false, archived: false, muted: false, unreadCount: 0, lastReadAt: FieldValue.serverTimestamp() }, { merge: true });
        await db.collection('smiletak_chats').doc(chatId).collection('messages').add({ type: 'text', text: text.trim(), senderId: profile.id, createdAt: FieldValue.serverTimestamp(), readBy: [], deletedFor: [] });
        await db.collection('smiletak_chats').doc(chatId).set({ lastMessage: text.trim().slice(0, 100), lastMessageAt: FieldValue.serverTimestamp(), lastSenderId: profile.id }, { merge: true });
        await db.collection('smiletak_chatMembers').doc(chatId + '_' + other.id).set({ unreadCount: FieldValue.increment(1) }, { merge: true }).catch(() => {});
      }));
      toast('Sent to ' + selected.length + ' people', 'success');
      onBack();
    } catch (e) { toast(e.message, 'error'); }
    setSending(false);
  };

  return h('div', { className: 'h-full flex flex-col' },
    h('div', { className: 'flex items-center gap-3 px-3 py-2.5 border-b border-slate-100 dark:border-ink-800' },
      h('button', { onClick: onBack, className: 'text-slate-500' }, h('i', { className: 'fa-solid fa-arrow-left' })),
      h('p', { className: 'font-semibold' }, 'New broadcast')
    ),
    h('p', { className: 'text-xs text-slate-400 px-4 pt-3' }, 'Your message will be sent as an individual chat to each person below — they won\u2019t see who else received it.'),
    selected.length > 0 && h('div', { className: 'flex gap-2 px-4 py-2 overflow-x-auto no-scrollbar' },
      selected.map(u => h('div', { key: u.id, className: 'flex flex-col items-center shrink-0', onClick: () => toggle(u) },
        h(Avatar, { url: u.photoURL, name: u.fullName, size: 44 }),
        h('span', { className: 'text-[10px] mt-1 max-w-[48px] truncate' }, u.fullName)
      ))
    ),
    h('div', { className: 'px-4 pb-2 pt-2' },
      h('input', { className: inputCls + ' mb-0', placeholder: 'Search people to add', value: q, onChange: e => setQ(e.target.value), onKeyUp: runSearch })
    ),
    h('div', { className: 'flex-1 overflow-y-auto no-scrollbar px-2' },
      results.map(u => {
        const picked = !!selected.find(x => x.id === u.id);
        return h('div', { key: u.id, className: 'flex items-center gap-3 px-2 py-2.5 cursor-pointer', onClick: () => toggle(u) },
          h(Avatar, { url: u.photoURL, name: u.fullName, size: 44 }),
          h('div', { className: 'flex-1 min-w-0' }, h('p', { className: 'font-semibold text-sm' }, u.fullName), h('p', { className: 'text-xs text-slate-400' }, '@' + u.username)),
          h('div', { className: 'w-5 h-5 rounded-full border-2 flex items-center justify-center ' + (picked ? 'bg-brand-600 border-brand-600' : 'border-slate-300') }, picked && h('i', { className: 'fa-solid fa-check text-white text-[10px]' }))
        );
      })
    ),
    h('div', { className: 'p-4 border-t border-slate-100 dark:border-ink-800' },
      h('textarea', { className: inputCls, rows: 2, placeholder: 'Broadcast message', value: text, onChange: e => setText(e.target.value) }),
      h('button', { onClick: send, disabled: sending, className: 'w-full bg-brand-600 text-white rounded-xl py-2.5 font-semibold text-sm disabled:opacity-40' }, sending ? 'Sending…' : 'Send to ' + selected.length)
    )
  );
}

function SelectContactScreen({ onBack, onOpenChat, onNewGroup, onNewChannel }) {
  const { profile } = useAuth();
  const toast = useToast();
  const [all, setAll] = useState(null); // null = loading
  const [q, setQ] = useState('');
  const [syncing, setSyncing] = useState(false);
  const [contactMatches, setContactMatches] = useState(null); // null = not synced yet
  const contactSyncSupported = typeof navigator !== 'undefined' && !!(navigator.contacts && navigator.contacts.select);

  useEffect(() => {
    db.collection('smiletak_users').orderBy('fullName').limit(300).get()
      .then(s => setAll(s.docs.map(d => Object.assign({ id: d.id }, d.data())).filter(u => u.id !== profile.id)))
      .catch(e => { toast(e.message, 'error'); setAll([]); });
    // eslint-disable-next-line
  }, []);

  const startChat = async (other) => {
    try {
      const blocked = await db.collection('smiletak_blockedUsers').doc(other.id + '_' + profile.id).get().catch(() => null);
      if (blocked && blocked.exists) return toast("You can't message this user", 'error');
      const chatId = chatIdFor(profile.id, other.id);
      await db.collection('smiletak_chats').doc(chatId).set({ members: [profile.id, other.id], createdAt: FieldValue.serverTimestamp() }, { merge: true });
      await db.collection('smiletak_chatMembers').doc(chatId + '_' + profile.id).set({ chatId, uid: profile.id, pinned: false, archived: false, muted: false, unreadCount: 0, lastReadAt: FieldValue.serverTimestamp() }, { merge: true });
      onOpenChat({ chatId, other });
    } catch (e) { toast((e.code || 'error') + ': ' + (e.message || 'Could not start chat'), 'error'); }
  };

  const inviteFriend = async () => {
    const url = window.location.origin + window.location.pathname;
    const text = 'Chat with me on SmileTak: ' + url;
    if (navigator.share) {
      navigator.share({ title: 'SmileTak', text, url }).catch(() => {});
    } else {
      try { await navigator.clipboard.writeText(text); toast('Invite link copied', 'success'); }
      catch (e) { toast(text, 'info'); }
    }
  };

  // Opens the phone's own native contact picker (Chrome on Android only —
  // no website can read your address book without this kind of explicit,
  // one-time OS-level picker; there's no silent/background way to do it).
  // Whatever numbers come back get matched against everyone already loaded
  // in `all`, exactly like WhatsApp's "Contacts on WhatsApp" list.
  const syncContacts = async () => {
    if (!contactSyncSupported) {
      toast('Contact sync needs Chrome on Android. Use "Invite a friend" to share your number instead.', 'info');
      return;
    }
    setSyncing(true);
    try {
      const picked = await navigator.contacts.select(['name', 'tel'], { multiple: true });
      const nameByKey = {};
      picked.forEach(c => {
        const name = (c.name && c.name[0]) || null;
        (c.tel || []).forEach(t => {
          const key = phoneMatchKey(t);
          if (key.length >= 7 && !nameByKey[key]) nameByKey[key] = name;
        });
      });
      const matched = (all || [])
        .filter(u => u.phone && nameByKey[phoneMatchKey(u.phone)])
        .map(u => Object.assign({}, u, { contactName: nameByKey[phoneMatchKey(u.phone)] }));
      setContactMatches(matched);
      toast((matched.length ? matched.length : 'None of') + ' of your contacts ' + (matched.length === 1 ? 'is' : 'are') + ' on SmileTak', matched.length ? 'success' : 'info');
    } catch (e) {
      if (e.name !== 'AbortError') toast('Could not read contacts: ' + e.message, 'error');
    }
    setSyncing(false);
  };

  const matchedIds = new Set((contactMatches || []).map(u => u.id));
  const filtered = (all || []).filter(u => !matchedIds.has(u.id) && (!q.trim() || (u.fullName || '').toLowerCase().includes(q.toLowerCase()) || (u.username || '').toLowerCase().includes(q.toLowerCase())));
  const filteredMatches = (contactMatches || []).filter(u => !q.trim() || (u.fullName || '').toLowerCase().includes(q.toLowerCase()) || (u.contactName || '').toLowerCase().includes(q.toLowerCase()) || (u.username || '').toLowerCase().includes(q.toLowerCase()));

  return h('div', { className: 'h-full flex flex-col' },
    h('div', { className: 'flex items-center gap-3 px-3 py-2.5 border-b border-slate-100 dark:border-ink-800' },
      h('button', { onClick: onBack, className: 'text-slate-500' }, h('i', { className: 'fa-solid fa-arrow-left' })),
      h('div', null, h('p', { className: 'font-semibold' }, 'Select contact'), h('p', { className: 'text-[11px] text-slate-400' }, (all ? all.length : '…') + ' contacts on SmileTak'))
    ),
    h('div', { className: 'px-4 pt-3 pb-1' },
      h('input', { className: 'w-full px-4 py-2.5 rounded-full bg-slate-100 dark:bg-ink-800 text-sm focus:outline-none', placeholder: 'Search name or username', value: q, onChange: e => setQ(e.target.value) })
    ),
    h('div', { className: 'flex-1 overflow-y-auto no-scrollbar' },
      h('div', { className: 'py-1' },
        h('button', { className: 'w-full flex items-center gap-3 px-4 py-2.5 hover:bg-slate-50 dark:hover:bg-ink-800', onClick: onNewGroup },
          h('div', { className: 'w-11 h-11 rounded-full bg-brand-100 dark:bg-ink-700 text-brand-600 flex items-center justify-center' }, h('i', { className: 'fa-solid fa-users' })),
          h('p', { className: 'font-semibold text-sm' }, 'New group')
        ),
        h('button', { className: 'w-full flex items-center gap-3 px-4 py-2.5 hover:bg-slate-50 dark:hover:bg-ink-800', onClick: onNewChannel },
          h('div', { className: 'w-11 h-11 rounded-full bg-brand-100 dark:bg-ink-700 text-brand-600 flex items-center justify-center' }, h('i', { className: 'fa-solid fa-bullhorn' })),
          h('p', { className: 'font-semibold text-sm' }, 'New channel')
        ),
        h('button', { className: 'w-full flex items-center gap-3 px-4 py-2.5 hover:bg-slate-50 dark:hover:bg-ink-800', onClick: syncContacts, disabled: syncing },
          h('div', { className: 'w-11 h-11 rounded-full bg-brand-100 dark:bg-ink-700 text-brand-600 flex items-center justify-center' },
            syncing ? h('div', { className: 'w-4 h-4 border-2 border-brand-600 border-t-transparent rounded-full spinner' }) : h('i', { className: 'fa-solid fa-address-book' })
          ),
          h('div', { className: 'text-left' },

      ))

}

/* ============================== DISCOVER / SEARCH USERS ============================== */
function DiscoverScreen({ onOpenChat, onViewProfile }) {
  const { profile } = useAuth();
  const toast = useToast();
  const [q, setQ] = useState('');
  const [results, setResults] = useState([]);
  const [busy, setBusy] = useState(false);

  const runSearch = async () => {
    const term = q.trim();
    if (!term) { setResults([]); return; }
    setBusy(true);
    try {
      const lower = term.toLowerCase();
      const digits = term.replace(/\D/g, '');
      const queries = [
        db.collection('smiletak_users').orderBy('username').startAt(lower).endAt(lower + '\uf8ff').limit(10).get(),
        db.collection('smiletak_users').orderBy('fullName').startAt(term).endAt(term + '\uf8ff').limit(10).get()
      ];
      if (digits.length >= 4) queries.push(db.collection('smiletak_users').where('phone', '>=', digits).where('phone', '<=', digits + '\uf8ff').limit(10).get());
      const snaps = await Promise.all(queries);
      const map = {};
      snaps.forEach(s => s.docs.forEach(d => { if (d.id !== profile.id) map[d.id] = Object.assign({ id: d.id }, d.data()); }));
      setResults(Object.values(map));
    } catch (e) { toast(e.message, 'error'); }
    setBusy(false);
  };

  const startChat = async (other) => {
    // Only ever write MY OWN chatMembers doc (see the long comment in
    // UserProfileScreen.message() for why the other person's doc isn't
    // written here — their client self-heals it themselves).
    try {
      const chatId = chatIdFor(profile.id, other.id);
      try {
        const blocked = await db.collection('smiletak_blockedUsers').doc(other.id + '_' + profile.id).get();
        if (blocked.exists) return toast("You can't message this user", 'error');
      } catch (e) { /* if the block check itself can't be read, don't let that block messaging */ }
      await db.collection('smiletak_chats').doc(chatId).set({ members: [profile.id, other.id], createdAt: FieldValue.serverTimestamp() }, { merge: true });
      await db.collection('smiletak_chatMembers').doc(chatId + '_' + profile.id).set({ chatId, uid: profile.id, pinned: false, archived: false, muted: false, unreadCount: 0, lastReadAt: FieldValue.serverTimestamp() }, { merge: true });
      onOpenChat({ chatId, other });
    } catch (e) {
      console.error('[SmileTak] startChat() failed:', e.code, e.message, e);
      toast((e.code || 'error') + ': ' + (e.message || 'Could not start chat'), 'error');
    }
  };

  return h('div', { className: 'h-full flex flex-col' },
    h('div', { className: 'px-4 pt-4 pb-2' }, h('h1', { className: 'text-xl font-extrabold' }, 'Discover people')),
    h('div', { className: 'px-4 pb-2 flex gap-2' },
      h('input', {
        className: 'flex-1 px-3 py-2 rounded-full bg-slate-100 dark:bg-ink-700 text-sm focus:outline-none',
        placeholder: 'Search by username, name, or phone',
        value: q, onChange: e => setQ(e.target.value), onKeyDown: e => e.key === 'Enter' && runSearch()
      }),
      h('button', { className: 'px-4 rounded-full bg-brand-600 text-white text-sm font-semibold', onClick: runSearch }, busy ? '…' : 'Go')
    ),
    h('div', { className: 'flex-1 overflow-y-auto no-scrollbar px-2' },
      results.length === 0 && h('p', { className: 'text-center text-sm text-slate-400 mt-10' }, 'Search for someone to start chatting'),
      results.map(u => h('div', { key: u.id, className: 'flex items-center gap-3 px-2 py-2.5 hover:bg-slate-50 dark:hover:bg-ink-800 rounded-xl' },
        h('div', { onClick: () => onViewProfile(u.id), className: 'cursor-pointer' }, h(Avatar, { url: u.photoURL, name: u.fullName, online: u.online })),
        h('div', { className: 'flex-1 min-w-0 cursor-pointer', onClick: () => onViewProfile(u.id) },
          h('p', { className: 'font-semibold text-sm' }, u.fullName),
          h('p', { className: 'text-xs text-slate-400' }, '@' + u.username)
        ),
        h('button', { className: 'text-brand-600 px-3 py-1.5 rounded-full border border-brand-600 text-xs font-semibold', onClick: () => startChat(u) }, 'Message')
      ))
    )
  );
}

/* ============================== CHAT WINDOW ============================== */
function ChatWindow({ chatId, other, onBack, onViewProfile }) {
  const { profile } = useAuth();
  const toast = useToast();
  const call = useCall();
  const [messages, setMessages] = useState([]);
  const [messagesLoaded, setMessagesLoaded] = useState(false);
  const [chat, setChat] = useState(null);
  const [otherLive, setOtherLive] = useState(other);
  const [text, setText] = useState('');
  const [replyTo, setReplyTo] = useState(null);
  const [search, setSearch] = useState(null);
  const [menuMsg, setMenuMsg] = useState(null);
  const [pinPickerMsg, setPinPickerMsg] = useState(null);
  const [starredIds, setStarredIds] = useState({});
  useEffect(() => {
    const unsub = db.collection('smiletak_starredMessages').where('uid', '==', profile.id).where('chatId', '==', chatId).onSnapshot(snap => {
      const m = {}; snap.docs.forEach(d => { m[d.data().messageId] = true; }); setStarredIds(m);
    });
    return unsub;
  }, [chatId, profile.id]);
  const [forwardMsg, setForwardMsg] = useState(null);
  const [recording, setRecording] = useState(false);
  const [recordSecs, setRecordSecs] = useState(0);
  const [uploadPct, setUploadPct] = useState(null);
  const bottomRef = useRef(null);
  const fileRef = useRef(null);
  const typingTimeout = useRef(null);
  const mediaRecorder = useRef(null);
  const audioChunks = useRef([]);
  const recordStartedAt = useRef(null);
  const recordTimerId = useRef(null);
  const recordingStream = useRef(null);

  useEffect(() => {
    const unsub = db.collection('smiletak_chats').doc(chatId).onSnapshot(s => setChat(s.exists ? s.data() : null));
    return unsub;
  }, [chatId]);

  useEffect(() => {
    const unsub = db.collection('smiletak_users').doc(other.id).onSnapshot(s => s.exists && setOtherLive(Object.assign({ id: s.id }, s.data())));
    return unsub;
  }, [other.id]);

  useEffect(() => {
    setMessagesLoaded(false);
    const unsub = db.collection('smiletak_chats').doc(chatId).collection('messages').orderBy('createdAt', 'asc').limit(500)
      .onSnapshot(snap => {
        const msgs = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
        setMessages(msgs);
        setMessagesLoaded(true);
        // mark delivered + read for messages from the other person
        const batch = db.batch();
        let any = false;
        snap.docs.forEach(d => {
          const m = d.data();
          if (m.senderId !== profile.id || m.isAutoReply) {
            if (!(m.deliveredTo || []).includes(profile.id)) { batch.update(d.ref, { deliveredTo: FieldValue.arrayUnion(profile.id) }); any = true; }
            if (profile.readReceipts !== false && !(m.readBy || []).includes(profile.id)) { batch.update(d.ref, { readBy: FieldValue.arrayUnion(profile.id) }); any = true; }
          }
        });
        if (any) batch.commit().catch(() => {});
      });
    return unsub;
  }, [chatId, profile.id]);

  useEffect(() => { bottomRef.current && bottomRef.current.scrollIntoView({ behavior: 'smooth' }); }, [messages.length]);

  useEffect(() => {
    db.collection('smiletak_chatMembers').doc(chatId + '_' + profile.id).update({ unreadCount: 0, lastReadAt: FieldValue.serverTimestamp() }).catch(() => {});
  }, [chatId, messages.length]);

  const setTyping = (isTyping) => {
    db.collection('smiletak_chats').doc(chatId).update({ ['typing.' + profile.id]: isTyping ? FieldValue.serverTimestamp() : null }).catch(() => {});
  };
  const onTextChange = (e) => {
    setText(e.target.value);
    setTyping(true);
    clearTimeout(typingTimeout.current);
    typingTimeout.current = setTimeout(() => setTyping(false), 2500);
  };

  const sendMessage = async (payload) => {
    const base = { senderId: profile.id, createdAt: FieldValue.serverTimestamp(), readBy: [], deliveredTo: [], deletedFor: [], deletedForEveryone: false };
    if (replyTo) base.replyTo = { id: replyTo.id, senderId: replyTo.senderId, snippet: (replyTo.text || (replyTo.type + ' message')).slice(0, 80) };
    await db.collection('smiletak_chats').doc(chatId).collection('messages').add(Object.assign(base, payload));
    const preview = payload.type === 'text' ? payload.text : ('📎 ' + payload.type);
    await db.collection('smiletak_chats').doc(chatId).set({ lastMessage: preview.slice(0, 100), lastMessageAt: FieldValue.serverTimestamp(), lastSenderId: profile.id }, { merge: true });
    // This bumps the OTHER person's unread badge, which is a cross-user
    // write to their chatMembers doc — typically blocked by security
    // rules (uid must equal auth.uid), same as the chat-start writes.
    // Non-fatal: caught here so a rules mismatch never breaks sending the
    // actual message or resetting the compose box below.
    db.collection('smiletak_chatMembers').doc(chatId + '_' + other.id).set({ unreadCount: FieldValue.increment(1) }, { merge: true }).catch(() => {});
    fireLocalNotification(profile.fullName, preview, profile.photoURL);
    // Business auto-reply: written by the CUSTOMER'S own client (there's no
    // Cloud Function here), which is the only reason this is allowed to set
    // a senderId other than its own uid — the chat message rule only checks
    // chat membership, not senderId. Logged as its own analytics event
    // rather than a cross-user counter update on the business's profile doc.
    if (otherLive && otherLive.isBusiness && otherLive.businessProfile && otherLive.businessProfile.autoReplyEnabled) {
      db.collection('smiletak_businessEvents').add({ businessUid: otherLive.id, viewerUid: profile.id, type: 'message', createdAt: FieldValue.serverTimestamp() }).catch(() => {});
      const last = chat && chat.lastAutoReplyAt ? chat.lastAutoReplyAt.toMillis() : 0;
      if (Date.now() - last > 24 * 3600 * 1000) {
        const reply = otherLive.businessProfile.autoReplyMessage || 'Thanks for reaching out! We will get back to you shortly.';
        // NOTE: senderId is set to the CUSTOMER's own uid (profile.id), not the
        // business's uid. Firestore security rules require senderId ==
        // request.auth.uid on message writes; setting it to the business's uid
        // (a different account) got silently rejected by those rules, which is
        // why the message flashed on screen (optimistic local write) and then
        // vanished (server rollback) instead of staying. The isAutoReply flag
        // below is what makes the bubble still render as if sent by the
        // business, so nothing else about the feature changes.
        db.collection('smiletak_chats').doc(chatId).collection('messages').add({
          type: 'text', text: reply, senderId: profile.id, isAutoReply: true, createdAt: FieldValue.serverTimestamp(),
          readBy: [], deliveredTo: [], deletedFor: [], deletedForEveryone: false
        }).then(() => db.collection('smiletak_chats').doc(chatId).set({
          lastAutoReplyAt: FieldValue.serverTimestamp(), lastMessage: reply.slice(0, 100), lastMessageAt: FieldValue.serverTimestamp(), lastSenderId: profile.id
        }, { merge: true })).catch(() => {});
      }
    }
    setReplyTo(null);
    setText('');
    setTyping(false);
  };

  const onSend = () => {
    const t = text.trim();
    if (!t) return;
    sendMessage({ type: 'text', text: t });
  };

  const onPickFile = async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    fileRef.current.value = '';
    const capMB = isPremiumActive(profile) ? 200 : 25;
    if (f.size > capMB * 1024 * 1024) { toast('File must be under ' + capMB + 'MB' + (isPremiumActive(profile) ? '' : ' — go Premium for higher limits'), 'error'); return; }
    let type = 'document';
    if (f.type.startsWith('image/')) type = 'image';
    else if (f.type.startsWith('video/')) type = 'video';
    else if (f.type.startsWith('audio/')) type = 'audio';
    try {
      setUploadPct(0);
      const url = await uploadFile('smiletak/chatMedia/' + chatId + '/' + Date.now() + '_' + f.name, f, p => setUploadPct(p));
      await sendMessage({ type, mediaURL: url, mediaName: f.name, mediaSize: f.size, text: '' });
    } catch (err) { toast('Upload failed: ' + err.message, 'error'); }
    setUploadPct(null);
  };

  const startRecording = async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: MIC_CONSTRAINTS });
      recordingStream.current = stream;
      // Pick the best-quality Opus container this browser actually supports
      // instead of leaving MediaRecorder's format/bitrate to chance, which is
      // where a lot of "voice notes sound garbled" reports come from.
      const preferredTypes = ['audio/webm;codecs=opus', 'audio/ogg;codecs=opus', 'audio/webm', 'audio/mp4'];
      const mimeType = preferredTypes.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
      const rec = new MediaRecorder(stream, mimeType ? { mimeType, audioBitsPerSecond: 96000 } : undefined);
      mediaRecorder.current = rec;
      audioChunks.current = [];
      rec.ondataavailable = e => { if (e.data && e.data.size > 0) audioChunks.current.push(e.data); };
      rec.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        recordingStream.current = null;
        if (rec.__cancelled) { audioChunks.current = []; return; }
        const durationMs = Date.now() - recordStartedAt.current;
        // Sub-second taps are almost always an accidental tap, not a real note.
        if (durationMs < 800) { audioChunks.current = []; toast('Recording too short', 'info'); return; }
        const rawType = rec.mimeType || 'audio/webm';
        let blob = new Blob(audioChunks.current, { type: rawType });
        // Chrome's webm muxer omits the file's Duration header for
        // MediaRecorder output, which is why played-back voice notes were
        // showing "0:00 / 0:00" and couldn't be seeked/stopped by their own
        // scrubber. This patches the correct duration into the file so
        // playback controls work properly.
        if (typeof ysFixWebmDuration === 'function' && rawType.includes('webm')) {
          try { blob = await new Promise(res => ysFixWebmDuration(blob, durationMs, res)); } catch (e) { /* ship the unpatched blob rather than fail the whole send */ }
        }
        setUploadPct(0);
        try {
          const ext = rawType.includes('mp4') ? 'm4a' : rawType.includes('ogg') ? 'ogg' : 'webm';
          const url = await uploadFile('smiletak/voiceNotes/' + chatId + '/' + Date.now() + '.' + ext, blob, p => setUploadPct(p));
          await sendMessage({ type: 'voice', mediaURL: url, durationSecs: Math.round(durationMs / 1000), text: '' });
        } catch (err) { toast('Voice note failed: ' + err.message, 'error'); }
        setUploadPct(null);
      };
      rec.start();
      recordStartedAt.current = Date.now();
      setRecordSecs(0);
      recordTimerId.current = setInterval(() => setRecordSecs(s => s + 1), 1000);
      setRecording(true);
    } catch (e) { toast('Microphone permission denied', 'error'); }
  };
  const stopAndSendRecording = () => {
    if (mediaRecorder.current && mediaRecorder.current.state !== 'inactive') mediaRecorder.current.stop();
    if (recordTimerId.current) { clearInterval(recordTimerId.current); recordTimerId.current = null; }
    setRecording(false);
  };
  const cancelRecording = () => {
    if (mediaRecorder.current && mediaRecorder.current.state !== 'inactive') {
      mediaRecorder.current.__cancelled = true;
      mediaRecorder.current.stop();
    } else if (recordingStream.current) {
      recordingStream.current.getTracks().forEach(t => t.stop());
    }
    if (recordTimerId.current) { clearInterval(recordTimerId.current); recordTimerId.current = null; }
    setRecording(false);
  };
  useEffect(() => () => { if (recordTimerId.current) clearInterval(recordTimerId.current); }, []);

  const deleteForMe = (m) => db.collection('smiletak_chats').doc(chatId).collection('messages').doc(m.id).update({ deletedFor: FieldValue.arrayUnion(profile.id) });
  const deleteForEveryone = (m) => db.collection('smiletak_chats').doc(chatId).collection('messages').doc(m.id).update({ deletedForEveryone: true, text: '', mediaURL: null });
  const copyText = (m) => { navigator.clipboard.writeText(m.text || ''); toast('Copied', 'success'); };
  const isStarred = (m) => !!starredIds[m.id];
  const toggleStar = async (m) => {
    const docId = profile.id + '_' + m.id;
    try {
      if (isStarred(m)) {
        await db.collection('smiletak_starredMessages').doc(docId).delete();
      } else {
        const senderName = (m.senderId === profile.id && !m.isAutoReply) ? profile.fullName : (other && other.fullName) || 'Unknown';
        await db.collection('smiletak_starredMessages').doc(docId).set({
          uid: profile.id, chatId, messageId: m.id, msgType: m.type, text: m.text || null,
          senderName, createdAt: m.createdAt || FieldValue.serverTimestamp(), starredAt: FieldValue.serverTimestamp()
        });
      }
    } catch (e) { toast(e.message, 'error'); }
  };
  // Chat-wide pin (like WhatsApp): stored on the chat doc itself so either
  // person sees the same pinned banner, not just a personal bookmark.
  // durationMs mirrors WhatsApp's 24h/7d/30d choices; null means "keep
  // pinned until manually unpinned".
  const pinMessage = async (m, durationMs, durationLabel) => {
    const preview = m.deletedForEveryone ? 'This message was deleted' : m.type === 'text' ? (m.text || '') : ('📎 ' + m.type);
    try {
      await db.collection('smiletak_chats').doc(chatId).set({
        pinnedMessageId: m.id, pinnedMessageText: preview.slice(0, 100),
        pinnedMessageSenderId: m.senderId, pinnedAt: FieldValue.serverTimestamp(), pinnedBy: profile.id,
        pinnedDurationLabel: durationLabel || null,
        pinnedExpiresAt: durationMs ? Timestamp.fromMillis(Date.now() + durationMs) : FieldValue.delete()
      }, { merge: true });
      toast('Message pinned', 'success');
    } catch (e) { toast(e.message, 'error'); }
  };
  const unpinMessage = async () => {
    try {
      await db.collection('smiletak_chats').doc(chatId).update({
        pinnedMessageId: FieldValue.delete(), pinnedMessageText: FieldValue.delete(),
        pinnedMessageSenderId: FieldValue.delete(), pinnedAt: FieldValue.delete(), pinnedBy: FieldValue.delete(),
        pinnedExpiresAt: FieldValue.delete(), pinnedDurationLabel: FieldValue.delete()
      });
    } catch (e) { toast(e.message, 'error'); }
  };
  // Nothing runs on a schedule (no Cloud Functions in this app), so an
  // expired pin is cleared out the same way a stale value ever gets fixed
  // here: whichever client next has the chat open notices and self-heals it.
  const pinExpired = !!(chat && chat.pinnedMessageId && chat.pinnedExpiresAt && chat.pinnedExpiresAt.toMillis() < Date.now());
  useEffect(() => { if (pinExpired) unpinMessage(); }, [pinExpired]);
  const scrollToPinned = () => {
    if (!chat || !chat.pinnedMessageId) return;
    const el = document.getElementById('msg-' + chat.pinnedMessageId);
    if (!el) { toast('Scroll up to find the pinned message', 'info'); return; }
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.add('flash-highlight');
    setTimeout(() => el.classList.remove('flash-highlight'), 1100);
  };

  const doForward = async (targetChatId, targetOtherId) => {
    await db.collection('smiletak_chats').doc(targetChatId).collection('messages').add({
      senderId: profile.id, createdAt: FieldValue.serverTimestamp(), readBy: [], deliveredTo: [], deletedFor: [], deletedForEveryone: false,
      type: forwardMsg.type, text: forwardMsg.text || '', mediaURL: forwardMsg.mediaURL || null, mediaName: forwardMsg.mediaName || null, forwarded: true
    });
    await db.collection('smiletak_chats').doc(targetChatId).set({ lastMessage: '↪ forwarded message', lastMessageAt: FieldValue.serverTimestamp(), lastSenderId: profile.id }, { merge: true });
    // Cross-user write — see the comment in sendMessage() above.
    db.collection('smiletak_chatMembers').doc(targetChatId + '_' + targetOtherId).set({ unreadCount: FieldValue.increment(1) }, { merge: true }).catch(() => {});
    toast('Forwarded', 'success');
    setForwardMsg(null);
  };

  const visible = messages.filter(m => !(m.deletedFor || []).includes(profile.id))
    .filter(m => !search || (m.text || '').toLowerCase().includes(search.toLowerCase()));

  const typingNow = chat && chat.typing && chat.typing[other.id] &&
    (Date.now() - (chat.typing[other.id].toMillis ? chat.typing[other.id].toMillis() : 0) < 5000);

  let lastDay = null;

  return h('div', { className: 'h-full flex flex-col bg-slate-50 dark:bg-ink-900' },
    h('div', { className: 'flex items-center gap-3 px-3 py-2.5 bg-white dark:bg-ink-800 border-b border-slate-200 dark:border-ink-700 shrink-0' },
      h('button', { onClick: onBack, className: 'text-slate-500 px-1' }, h('i', { className: 'fa-solid fa-arrow-left' })),
      h('div', { className: 'cursor-pointer flex items-center gap-2 flex-1 min-w-0', onClick: () => onViewProfile(other.id) },
        h(Avatar, { url: otherLive.photoURL, name: otherLive.fullName, size: 36, online: otherLive.online }),
        h('div', { className: 'min-w-0' },
          h('p', { className: 'font-semibold text-sm truncate' }, h(NameWithBadges, { name: otherLive.fullName, user: otherLive })),
          h('p', { className: 'text-[11px] text-slate-400' }, typingNow ? h('span', { className: 'text-brand-600' }, 'typing…') : (otherLive.showLastSeen === false ? '' : (otherLive.online ? 'Online' : otherLive.lastSeen ? 'last seen ' + timeAgo(otherLive.lastSeen) : '')))
        )
      ),

/* WhatsApp-style compact voice note bubble: play/pause button, a scrubbable
   waveform, a small circular avatar with a mic badge sitting to the right
   of the waveform, and a bold mm:ss duration underneath — matching the
   native WhatsApp voice-note layout. Uses one shared <audio> element per
   bubble, driven entirely by our own UI. */
function VoiceMessagePlayer({ src, mine, avatarURL, avatarName, durationSecs, createdAt, status }) {
  const { profile } = useAuth();
  const audioRef = useRef(null);
  const [playing, setPlaying] = useState(false);
  const [curTime, setCurTime] = useState(0);
  const [duration, setDuration] = useState(durationSecs || 0);
  const barRef = useRef(null);

  useEffect(() => {
    const el = audioRef.current;
    if (!el) return;
    const onTime = () => setCurTime(el.currentTime);
    const onMeta = () => { if (isFinite(el.duration) && el.duration > 0) setDuration(el.duration); };
    const onEnd = () => { setPlaying(false); setCurTime(0); };
    el.addEventListener('timeupdate', onTime);
    el.addEventListener('loadedmetadata', onMeta);
    el.addEventListener('durationchange', onMeta);
    el.addEventListener('ended', onEnd);
    return () => {
      el.removeEventListener('timeupdate', onTime);
      el.removeEventListener('loadedmetadata', onMeta);
      el.removeEventListener('durationchange', onMeta);
      el.removeEventListener('ended', onEnd);
    };
  }, []);

  const toggle = () => {
    const el = audioRef.current;
    if (!el) return;
    if (playing) { el.pause(); setPlaying(false); }
    else { el.play().catch(() => {}); setPlaying(true); }
  };
  const seek = (e) => {
    const el = audioRef.current;
    if (!el || !duration || !barRef.current) return;
    const rect = barRef.current.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    el.currentTime = ratio * duration;
    setCurTime(el.currentTime);
  };
  const fmt = (s) => { s = Math.max(0, Math.round(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const pct = duration ? Math.min(100, (curTime / duration) * 100) : 0;

  // A fixed pseudo-random bar-height pattern (WhatsApp-style waveform look).
  // This doesn't reflect the actual audio amplitude — a real waveform would
  // need decoding the audio client-side, which is unnecessary cost for a
  // purely decorative visual. The same seeded pattern is reused every
  // render so bars don't jump around while playing.
  const BAR_COUNT = 24;
  const barHeights = useMemo(() => {
    let seed = 0;
    for (let i = 0; i < src.length; i++) seed = (seed * 31 + src.charCodeAt(i)) >>> 0;
    const rand = () => { seed = (seed * 1103515245 + 12345) >>> 0; return (seed >>> 8) / 0xFFFFFF; };
    return Array.from({ length: BAR_COUNT }, () => 4 + Math.round(rand() * 12));
  }, [src]);

  const playedBars = Math.round((pct / 100) * BAR_COUNT);
  const fillColor = mine ? 'bg-white' : 'bg-brand-500';
  const dimColor = mine ? 'bg-white/35' : 'bg-slate-300 dark:bg-ink-600';

  // Avatar sits to the right of the waveform on BOTH sent and received
  // bubbles, matching WhatsApp's voice-note layout: your own photo on
  // bubbles you sent, the sender's photo on bubbles you received.
  const displayAvatarURL = mine ? (profile && profile.photoURL) : avatarURL;
  const displayAvatarName = mine ? (profile && profile.fullName) : avatarName;

  // Tight WhatsApp-style two-row layout, hugging its content instead of
  // reserving a wide fixed box:
  //   row 1 — play button, waveform, small avatar (mic badge)
  //   row 2 — duration on the left, send-time + read ticks on the right
  // This replaces the old design where the outer message bubble ALSO drew
  // its own separate timestamp line below the player — that extra line was
  // the redundant height users were seeing. Now there's exactly one compact
  // row of "meta" text, same as native WhatsApp, and nothing else.
  return h('div', { className: 'w-[172px]' },
    h('div', { className: 'flex items-center gap-1.5' },
      h('audio', { ref: audioRef, src, preload: 'metadata', className: 'hidden' }),
      h('button', { onClick: toggle, className: 'shrink-0 w-7 h-7 rounded-full flex items-center justify-center ' + (mine ? 'bg-white text-brand-600' : 'bg-brand-500 text-white') },
        h('i', { className: 'fa-solid ' + (playing ? 'fa-pause' : 'fa-play') + ' text-[10px]' })
      ),
      h('div', {
        ref: barRef, onClick: seek,
        className: 'flex-1 min-w-0 h-6 flex items-center gap-[2px] cursor-pointer'
      },
        barHeights.map((hgt, i) => h('span', {
          key: i,
          className: 'flex-1 rounded-full ' + (i < playedBars ? fillColor : dimColor),
          style: { height: hgt }
        }))
      ),
      h('div', { className: 'relative shrink-0' },
        h(Avatar, { url: displayAvatarURL, name: displayAvatarName, size: 24 }),
        h('span', { className: 'absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full bg-brand-500 flex items-center justify-center border-2 border-white dark:border-ink-800' },
          h('i', { className: 'fa-solid fa-microphone text-white', style: { fontSize: 5 } })
        )
      )
    ),
    h('div', { className: 'flex items-center justify-between mt-0.5 pl-[34px]' },
      h('span', { className: 'text-[10px] font-bold tabular-nums ' + (mine ? 'text-white' : 'text-slate-700 dark:text-slate-200') }, fmt(playing || curTime ? curTime : duration)),
      createdAt !== undefined && h('span', { className: 'flex items-center gap-1' },
        h('span', { className: 'text-[10px] ' + (mine ? 'text-white/70' : 'text-slate-400') }, fmtClock(createdAt)),
        mine && status && h('i', { className: 'fa-solid ' + (status === 'read' ? 'fa-check-double text-sky-300' : status === 'delivered' ? 'fa-check-double text-white/70' : 'fa-check text-white/70') + ' text-[10px]' })
      )
    )
  );
}

function MessageBubble({ m, mine, onMenu, onReply, senderAvatar, senderName }) {
  // Swipe-to-reply: drag the bubble right (like WhatsApp) to reply to it —
  // works for both text replies and a voice-note reply, since sendMessage()
  // already attaches whatever replyTo is set to any message type sent next,
  // voice notes included.
  const [dragX, setDragX] = useState(0);
  // Tapping a photo message opens it full-screen, WhatsApp-style, with a
  // download button — see ImageViewerModal below.
  const [imageViewerOpen, setImageViewerOpen] = useState(false);
  const dragState = useRef({ startX: 0, active: false, pointerId: null });
  const SWIPE_TRIGGER = 60;
  const SWIPE_MAX = 84;

  const onPointerDown = (e) => {
    if (m.deletedForEveryone) return;
    dragState.current = { startX: e.clientX, active: true, pointerId: e.pointerId };
    e.currentTarget.setPointerCapture && e.currentTarget.setPointerCapture(e.pointerId);
  };
  const onPointerMove = (e) => {
    if (!dragState.current.active) return;
    const dx = e.clientX - dragState.current.startX;
    // Only allow dragging right, and only far enough to reveal the reply icon —
    // dragging left does nothing (matches the one-directional swipe pattern
    // people already know from WhatsApp/Telegram).
    setDragX(Math.max(0, Math.min(SWIPE_MAX, dx)));
  };
  const endDrag = () => {
    if (!dragState.current.active) return;
    dragState.current.active = false;
    if (dragX > SWIPE_TRIGGER) onReply();
    setDragX(0);
  };

  if (m.deletedForEveryone) {
    return h('div', { id: 'msg-' + m.id, className: 'flex ' + (mine ? 'justify-end' : 'justify-start') + ' mb-1.5' },
      h('div', { className: 'italic text-xs text-slate-400 bg-white dark:bg-ink-800 px-3 py-2 rounded-2xl' }, h('i', { className: 'fa-solid fa-ban mr-1' }), 'This message was deleted')
    );
  }
  const status = mine ? (m.readBy && m.readBy.length ? 'read' : (m.deliveredTo && m.deliveredTo.length ? 'delivered' : 'sent')) : null;
  return h('div', { id: 'msg-' + m.id, className: 'flex ' + (mine ? 'justify-end' : 'justify-start') + ' mb-1 group relative' },
    // Reply icon revealed behind the bubble as it's dragged right.
    h('div', {
      className: 'absolute left-2 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full bg-slate-200 dark:bg-ink-700 flex items-center justify-center pointer-events-none transition-opacity',
      style: { opacity: Math.min(1, dragX / SWIPE_TRIGGER) }
    }, h('i', { className: 'fa-solid fa-reply text-slate-500 text-xs' })),
    h('div', {
      className: 'flex items-end gap-1 max-w-[78%] touch-pan-y ' + (mine ? 'flex-row-reverse' : ''),
      style: { transform: 'translateX(' + dragX + 'px)', transition: dragState.current.active ? 'none' : 'transform .15s ease-out' },
      onPointerDown, onPointerMove, onPointerUp: endDrag, onPointerCancel: endDrag
    },
      h('div', {
        className: 'msg-in flow-root px-3 py-2 rounded-2xl text-sm shadow-sm ' + (mine ? 'bg-brand-600 text-white rounded-br-md' : 'bg-white dark:bg-ink-800 rounded-bl-md')
      },
        m.forwarded && h('p', { className: 'text-[10px] italic opacity-70 mb-0.5' }, h('i', { className: 'fa-solid fa-share mr-1' }), 'Forwarded'),
        m.replyTo && h('div', { className: 'border-l-2 pl-2 mb-1 text-xs opacity-75 ' + (mine ? 'border-white/60' : 'border-brand-500') }, m.replyTo.snippet),
        // Text messages: the timestamp+ticks float at the end of the text
        // (WhatsApp-style) instead of sitting on their own row below, so a
        // short message's bubble hugs the text instead of always reserving
        // a full extra line of height for the time.
        m.type === 'text' && h('p', { className: 'whitespace-pre-wrap break-words leading-snug' },
          m.text,
          h('span', { className: 'float-right ml-2 inline-flex items-center gap-1 relative top-[3px]' },
            h('span', { className: 'text-[10px] ' + (mine ? 'text-white/70' : 'text-slate-400') }, fmtClock(m.createdAt)),
            mine && h('i', { className: 'fa-solid ' + (status === 'read' ? 'fa-check-double text-sky-300' : status === 'delivered' ? 'fa-check-double text-white/70' : 'fa-check text-white/70') + ' text-[10px]' })
          )
        ),
        m.type === 'image' && h('img', {
          src: m.mediaURL,
          className: 'rounded-lg max-w-full max-h-64 mb-1 cursor-pointer',
          onClick: () => setImageViewerOpen(true)
        }),
        m.type === 'video' && h('video', { src: m.mediaURL, controls: true, className: 'rounded-lg max-w-full max-h-64 mb-1' }),
        m.type === 'audio' && h('audio', { src: m.mediaURL, controls: true, className: 'max-w-full' }),
        m.type === 'voice' && m.mediaURL && h(VoiceMessagePlayer, { src: m.mediaURL, mine, avatarURL: senderAvatar, avatarName: senderName, durationSecs: m.durationSecs, createdAt: m.createdAt, status }),
        m.type === 'document' && h('a', { href: m.mediaURL, target: '_blank', rel: 'noreferrer', className: 'flex items-center gap-2 underline' }, h('i', { className: 'fa-solid fa-file' }), h('span', null, m.mediaName, ' ', m.mediaSize ? h('span', { className: 'opacity-70' }, '(' + bytesToSize(m.mediaSize) + ')') : null)),
        m.type !== 'text' && m.type !== 'voice' && h('div', { className: 'flex items-center gap-1 justify-end mt-0.5' },
          h('span', { className: 'text-[10px] ' + (mine ? 'text-white/70' : 'text-slate-400') }, fmtClock(m.createdAt)),
          mine && h('i', { className: 'fa-solid ' + (status === 'read' ? 'fa-check-double text-sky-300' : status === 'delivered' ? 'fa-check-double text-white/70' : 'fa-check text-white/70') + ' text-[10px]' })
        )
      ),
      h('button', { className: 'opacity-0 group-hover:opacity-100 text-slate-300 text-xs px-1', onClick: onMenu }, h('i', { className: 'fa-solid fa-chevron-down' }))
    ),
    m.type === 'image' && imageViewerOpen && h(ImageViewerModal, { url: m.mediaURL, onClose: () => setImageViewerOpen(false) })
  );
}

/* Full-screen photo viewer for tapped image messages — mirrors WhatsApp:

  const options = [
    { label: '24 hours', ms: DAY },
    { label: '7 days', ms: 7 * DAY },
    { label: '30 days', ms: 30 * DAY },

  return h('div', { className: 'fixed inset-0 z-50 flex items-end justify-center bg-black/30', onClick: onClose },
    h('div', { className: 'bg-white dark:bg-ink-800 w-full max-w-sm rounded-t-2xl p-2 pb-4', onClick: e => e.stopPropagation() },

function ForwardPicker({ onClose, onPick }) {
  const { profile } = useAuth();
  const [chats, setChats] = useState([]);
  useEffect(() => {
    const unsub = db.collection('smiletak_chatMembers').where('uid', '==', profile.id).onSnapshot(async snap => {
      const rows = await Promise.all(snap.docs.map(async d => {
        const meta = d.data();
        const cSnap = await db.collection('smiletak_chats').doc(meta.chatId).get();
        if (!cSnap.exists) return null;
        const c = cSnap.data();
        const otherId = (c.members || []).find(u => u !== profile.id);
        const uSnap = await db.collection('smiletak_users').doc(otherId).get();
        return { chatId: meta.chatId, otherId, other: uSnap.exists ? uSnap.data() : {} };
      }));
      setChats(rows.filter(Boolean));
    });
    return unsub;
  }, [profile.id]);
  return h('div', { className: 'fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4', onClick: onClose },
    h('div', { className: 'bg-white dark:bg-ink-800 rounded-2xl w-full max-w-sm max-h-[70vh] overflow-y-auto p-3', onClick: e => e.stopPropagation() },
      h('p', { className: 'font-semibold px-2 pb-2' }, 'Forward to…'),
      chats.map(c => h('div', { key: c.chatId, className: 'flex items-center gap-3 px-2 py-2 hover:bg-slate-50 dark:hover:bg-ink-700 rounded-xl cursor-pointer', onClick: () => onPick(c.chatId, c.otherId) },
        h(Avatar, { url: c.other.photoURL, name: c.other.fullName, size: 34 }),
        h('p', { className: 'text-sm font-medium' }, c.other.fullName)
      ))
    )
  );
}

function StatusScreen({ onViewProfile, onOpenChannel, onNewChannel, onExploreChannels, onStarred, onNavigate, onSettings, onOpenChat }) {

  useEffect(() => {

      const ids = snap.docs.map(d => d.data().channelId);
      const chans = await Promise.all(ids.map(id => db.collection('smiletak_channels').doc(id).get()));
      const list = chans.filter(c => c.exists).map(c => Object.assign({ id: c.id }, c.data()));

      setMyChannels(list.map((c, i) => Object.assign({}, c, { owner: owners[i] && owners[i].exists ? owners[i].data() : null })));

    return unsub;

  useEffect(() => {
    const cutoff = Timestamp.fromMillis(Date.now() - 24 * 3600 * 1000);
    const unsub = db.collection('smiletak_statuses').where('createdAt', '>', cutoff).orderBy('createdAt', 'desc').onSnapshot(async snap => {
      const all = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));

      const others = all.filter(s => s.uid !== profile.id);

      others.forEach(s => { (byUser[s.uid] = byUser[s.uid] || []).push(s); });

        const uSnap = await db.collection('smiletak_users').doc(uid).get();
        return { uid, user: uSnap.exists ? uSnap.data() : {}, items: byUser[uid] };

      setStatuses(list);

    return unsub;

          h('p', { className: 'relative text-white text-sm font-semibold px-2.5 pb-3 truncate w-full' }, myStatuses.length ? 'My status' : 'Add status')

        statuses.map((s, i) => h('div', {
          key: s.uid,

          h('p', { className: 'relative text-white text-sm font-semibold px-2.5 pb-3 truncate w-full' }, s.user.fullName)

          h('span', { className: 'absolute top-3 left-3 bg-amber-400 text-ink-900 text-[10px] font-bold px-2 py-0.5 rounded-full tracking-wide' }, 'SPONSORED'),
          h('p', { className: 'relative text-white text-sm font-semibold px-2.5 pb-3 truncate w-full' }, statusAd.headline || statusAd.advertiserName || 'Ad')

/* Downloads a status's media to the device by fetching it as a blob first —
   a plain <a download> is silently ignored by browsers for cross-origin
   URLs (like Firebase Storage links), so we pull the bytes ourselves. */
async function saveMediaFile(url, filename) {
  // fetch() can fail outright ("Failed to fetch") on a flaky connection or
  // if the storage bucket doesn't send CORS headers for this origin — that
  // failure gave no way to actually save the file. Fall back to opening the
  // media in a new tab so the browser's own long-press-to-save/download
  // still works even when the blob fetch can't complete.
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('Download failed');
    const blob = await res.blob();
    const objUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = objUrl; a.download = filename || 'status';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(objUrl), 4000);
  } catch (e) {
    window.open(url, '_blank');
    throw new Error('Could not auto-save (' + (e.message || 'network error') + ') — opened it in a new tab, long-press the image there to save it');
  }
}

/* Full-screen list of the signed-in user's own statuses — mirrors WhatsApp's
   "My status" screen: a thumbnail + view count + timestamp per item, with a
   per-item menu to delete, save, or share. Tapping a row jumps straight into
   the auto-playing story viewer starting at that item. */
function MyStatusListScreen({ myStatuses, profile, onClose, onAdd, onDelete, onView }) {
  const [menuFor, setMenuFor] = useState(null); // index of item whose sheet is open
  const closeMenu = useBackClose(menuFor !== null, () => setMenuFor(null));
  const sorted = myStatuses.slice().sort((a, b) => (b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0) - (a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0));

  return h('div', { className: 'fixed inset-0 z-50 bg-white dark:bg-ink-900 flex flex-col' },
    h('div', { className: 'flex items-center gap-4 px-4 pt-4 pb-3' },
      h('button', { onClick: onClose, className: 'text-xl' }, h('i', { className: 'fa-solid fa-arrow-left' })),
      h('h1', { className: 'text-xl font-extrabold' }, 'My status')
    ),
    h('div', { className: 'flex-1 overflow-y-auto no-scrollbar' },
      sorted.map((item, i) => h(MyStatusRow, { key: item.id, item, onOpen: () => onView(i), onMenu: () => setMenuFor(i) })),
      h('p', { className: 'px-6 py-6 text-center text-xs text-slate-400 flex items-center justify-center gap-1.5' },
        h('i', { className: 'fa-solid fa-lock text-[10px]' }),
        h('span', null, 'Your statuses are ', h('span', { className: 'text-brand-600 font-semibold' }, 'end-to-end encrypted'), '. They will disappear after 24 hours.')
      )
    ),
    h('div', { className: 'absolute bottom-5 right-5 flex flex-col items-center gap-3' },
      h('button', { onClick: onAdd, className: 'w-11 h-11 rounded-full bg-slate-700 dark:bg-ink-700 text-white shadow-lg flex items-center justify-center text-base active:scale-95 transition' }, h('i', { className: 'fa-solid fa-pen' })),
      h('button', { onClick: onAdd, className: 'w-14 h-14 rounded-full bg-brand-600 text-white shadow-lg flex items-center justify-center text-xl active:scale-95 transition' }, h('i', { className: 'fa-solid fa-camera' }))
    ),
    menuFor !== null && sorted[menuFor] && h(MyStatusRowMenu, {
      item: sorted[menuFor],
      onClose: closeMenu,
      onDelete: async () => { closeMenu(); if (onDelete) await onDelete(sorted[menuFor]); },
    })
  );
}

function MyStatusRow({ item, onOpen, onMenu }) {
  const [views, setViews] = useState(0);
  useEffect(() => {
    const unsub = db.collection('smiletak_statuses').doc(item.id).collection('views').onSnapshot(snap => setViews(snap.size));
    return unsub;
  }, [item.id]);
  const thumbStyle = item.type === 'text' ? { background: item.bgColor } : item.type === 'image' ? { backgroundImage: 'url(' + item.mediaURL + ')', backgroundSize: 'cover', backgroundPosition: 'center' } : {};
  return h('div', { className: 'flex items-center gap-3 px-4 py-2.5 cursor-pointer hover:bg-slate-50 dark:hover:bg-ink-800', onClick: onOpen },
    h('div', { className: 'w-12 h-12 rounded-full overflow-hidden shrink-0 relative ring-2 ring-brand-500', style: thumbStyle },
      item.type === 'video' && h('video', { src: item.mediaURL, className: 'absolute inset-0 w-full h-full object-cover', muted: true, playsInline: true, preload: 'metadata' }),
      item.type === 'text' && h('div', { className: 'absolute inset-0 flex items-center justify-center text-white text-[9px] font-semibold px-1 text-center' }, (item.content || '').slice(0, 12))
    ),
    h('div', { className: 'flex-1 min-w-0' },
      h('p', { className: 'text-[15px] font-bold flex items-center gap-1.5' }, views, ' view' + (views === 1 ? '' : 's')),
      h('p', { className: 'text-[13px] text-slate-400' }, fmtDay(item.createdAt) + ', ' + fmtClock(item.createdAt))
    ),
    h('button', { onClick: (e) => { e.stopPropagation(); onMenu(); }, className: 'text-slate-400 px-2' }, h('i', { className: 'fa-solid fa-ellipsis-vertical' }))
  );
}

function MyStatusRowMenu({ item, onClose, onDelete }) {
  const toast = useToast();
  const canSaveOrShare = item.type === 'image' || item.type === 'video';
  const save = async () => {
    onClose();
    try { await saveMediaFile(item.mediaURL, 'status_' + item.id + (item.type === 'video' ? '.mp4' : '.jpg')); toast('Saved', 'success'); }
    catch (e) { toast('Could not save — opening in a new tab instead', 'info'); window.open(item.mediaURL, '_blank'); }
  };
  const share = async () => {
    onClose();
    try {
      const shareData = { title: 'SmileTak status' };
      if (item.type === 'text') shareData.text = item.content;
      else { shareData.url = item.mediaURL; shareData.text = item.caption || ''; }
      if (navigator.share) await navigator.share(shareData);
      else { await navigator.clipboard.writeText(shareData.url || shareData.text || ''); toast('Copied to clipboard', 'success'); }
    } catch (e) { /* user cancelled the native share sheet */ }
  };
  return h('div', { className: 'fixed inset-0 z-[60] bg-black/50 flex items-end justify-center', onClick: onClose },
    h('div', { className: 'bg-white dark:bg-ink-800 w-full max-w-sm rounded-t-2xl p-2', onClick: e => e.stopPropagation() },
      canSaveOrShare && h('button', { className: 'w-full flex items-center gap-3 text-left px-3 py-3 rounded-xl hover:bg-slate-100 dark:hover:bg-white/5 text-sm', onClick: save }, h('i', { className: 'fa-solid fa-download w-5' }), 'Save to device'),
      canSaveOrShare && h('button', { className: 'w-full flex items-center gap-3 text-left px-3 py-3 rounded-xl hover:bg-slate-100 dark:hover:bg-white/5 text-sm', onClick: share }, h('i', { className: 'fa-solid fa-arrow-up-from-bracket w-5' }), 'Share via…'),
      h('button', { className: 'w-full flex items-center gap-3 text-left px-3 py-3 rounded-xl hover:bg-slate-100 dark:hover:bg-white/5 text-sm text-red-500', onClick: onDelete }, h('i', { className: 'fa-solid fa-trash w-5' }), 'Delete'),
      h('button', { className: 'w-full text-center px-3 py-3 mt-1 rounded-xl bg-slate-100 dark:bg-white/5 text-sm font-semibold', onClick: onClose }, 'Cancel')
    )
  );
}

/* Who can see your future status updates. This is a saved preference on the
   profile — since statuses in this app are visible to everyone the same way
   a public "Updates" feed is (there's no separate contacts graph to filter
   against), the options mirror WhatsApp's wording but the enforcement here
   is limited to hiding your status from anyone you've blocked. */
function StatusPrivacyModal({ profile, onClose }) {
  const toast = useToast();
  const [choice, setChoice] = useState(profile.statusPrivacy || 'contacts');
  const options = [
    { id: 'contacts', label: 'My contacts', desc: 'Share with all your contacts' },
    { id: 'contacts_except', label: 'My contacts except…', desc: 'Share with your contacts except people you\u2019ve blocked' },
    { id: 'only_share', label: 'Only share with…', desc: 'Share only with the people you choose' }
  ];
  const save = async (id) => {
    setChoice(id);
    await db.collection('smiletak_users').doc(profile.id).update({ statusPrivacy: id });
    toast('Status privacy updated', 'success');
    onClose();
  };
  return h('div', { className: 'fixed inset-0 z-[60] bg-black/50 flex items-end justify-center', onClick: onClose },
    h('div', { className: 'bg-white dark:bg-ink-800 w-full max-w-sm rounded-t-2xl p-4', onClick: e => e.stopPropagation() },
      h('p', { className: 'text-lg font-bold mb-1' }, 'Status privacy'),
      h('p', { className: 'text-xs text-slate-400 mb-3' }, 'People you\u2019ve blocked will never see your status, regardless of this setting.'),
      options.map(o => h('button', {
        key: o.id,
        onClick: () => save(o.id),
        className: 'w-full text-left px-3 py-3 rounded-xl flex items-start gap-3 hover:bg-slate-50 dark:hover:bg-white/5'
