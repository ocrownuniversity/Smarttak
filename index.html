            'relay' — this skips the direct/STUN path entirely and goes
            straight to TURN, which is what actually succeeds across two
            separate carrier networks
         3. only give up and show an error after relay-forced restart has
            also had a real chance (14s total) — TURN over TCP (needed when
            UDP is blocked, common on mobile carriers) takes noticeably
            longer to establish than a direct path, so the old flat 8s
            timeout could give up right as the TCP relay was about to work. */
    let iceFailTimer = null;
    let stage = 0; // 0 = not yet restarted, 1 = plain restart done, 2 = relay-forced restart done
    const scheduleCheck = (delayMs) => {
      if (iceFailTimer) clearTimeout(iceFailTimer);
      iceFailTimer = setTimeout(() => {
        const cur = pc.iceConnectionState;
        if (cur === 'failed' || cur === 'disconnected') {
          if (stage === 0) {
            stage = 1;
            if (typeof pc.restartIce === 'function') { try { pc.restartIce(); } catch (e) {} }
            scheduleCheck(6000);
          } else if (stage === 1) {
            stage = 2;
            try { pc.setConfiguration(buildRtcConfig(true)); } catch (e) {}
            if (typeof pc.restartIce === 'function') { try { pc.restartIce(); } catch (e) {} }
            scheduleCheck(8000);
          } else {
            toast('Call connection failed — check that both people have a stable internet connection', 'error');
            endCallRef.current && endCallRef.current();
          }
        }
      }, delayMs);
    };
    pc.oniceconnectionstatechange = () => {
      const st = pc.iceConnectionState;
      if (st === 'failed' || st === 'disconnected') {
        if (!iceFailTimer) scheduleCheck(stage === 0 ? 3000 : 6000);
      } else if (st === 'connected' || st === 'completed') {
        if (iceFailTimer) { clearTimeout(iceFailTimer); iceFailTimer = null; }
        stage = 0;
      }
    };
    return pc;
  };

  /* ---- MID-CALL AUDIO<->VIDEO SWITCH ----
     Either side can call switchCallType('video'|'audio') at any point during
     a connected 1:1 call. It renegotiates the existing RTCPeerConnection
     (adds/removes the local camera track and exchanges a fresh offer/answer
     through extra fields on the same call doc) rather than starting a new
     call, so audio never drops and the call ID/duration stay continuous. */
  const handleRenegotiation = async (data, pc, callId) => {
    if (!pc || !callId) return;
    // Someone (possibly us) sent a new offer for a type change.
    if (data.renegotiateOffer && data.renegotiateOffer.from !== profile.id
        && data.renegotiateOffer.offer.sdp !== lastHandledOfferSdp.current) {
      lastHandledOfferSdp.current = data.renegotiateOffer.offer.sdp;
      try {
        await pc.setRemoteDescription(new RTCSessionDescription(data.renegotiateOffer.offer));
        if (data.type === 'video' && localStreamRef.current && localStreamRef.current.getVideoTracks().length === 0) {
          try {
            const camStream = await navigator.mediaDevices.getUserMedia({ video: true });
            const track = camStream.getVideoTracks()[0];
            localStreamRef.current.addTrack(track);
            // Attach the camera track to the transceiver the offer already
            // created for video, explicitly, rather than calling
            // pc.addTrack(track, stream) and relying on the browser to
            // silently match it to the right transceiver. That implicit
            // matching is the standard-conformant behavior, but it's a
            // recognized source of inconsistent results across mobile
            // browsers/webviews. Finding the video transceiver directly
            // (it's the one the offer just created, receiving the caller's
            // camera) and calling replaceTrack + setting direction is more
            // deterministic and behaves the same everywhere.
            const videoTransceiver = pc.getTransceivers().find(t =>
              t.receiver && t.receiver.track && t.receiver.track.kind === 'video' && !t.sender.track
            );
            if (videoTransceiver) {
              await videoTransceiver.sender.replaceTrack(track);
              videoTransceiver.direction = 'sendrecv';
            } else {
              pc.addTrack(track, localStreamRef.current); // fallback if no matching transceiver was found
            }
            const refreshed = new MediaStream(localStreamRef.current.getTracks());
            localStreamRef.current = refreshed; setLocalStream(refreshed);
          } catch (e) { /* camera denied on this side — call continues audio-only for them */ }
        }
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        await db.collection('smiletak_calls').doc(callId).update({
          renegotiateAnswer: { answer: { type: answer.type, sdp: answer.sdp }, from: profile.id }
        });
        setCall(c => c ? Object.assign({}, c, { type: data.type }) : c);
      } catch (e) { /* renegotiation glitch — call stays on its current type */ }
    }
    // We sent the offer; this is the matching answer coming back.
    if (data.renegotiateAnswer && data.renegotiateAnswer.from !== profile.id
        && data.renegotiateAnswer.answer.sdp !== lastHandledAnswerSdp.current
        && pc.signalingState === 'have-local-offer') {
      lastHandledAnswerSdp.current = data.renegotiateAnswer.answer.sdp;
      try { await pc.setRemoteDescription(new RTCSessionDescription(data.renegotiateAnswer.answer)); } catch (e) {}
      setSwitchingType(false);
    }
  };

  const switchCallType = async (newType) => {
    const pc = pcRef.current;
    const stream = localStreamRef.current;
    if (!pc || !stream || !call || callStatus !== 'connected' || call.type === newType) return;
    if (pc.signalingState !== 'stable') return; // a switch is already mid-flight
    if (newType === 'video' && !callFeatures.videoEnabled) { toast('Video calls are currently disabled', 'info'); return; }
    const callId = call.id;
    setSwitchingType(true);
    try {
      if (newType === 'video') {
        if (stream.getVideoTracks().length === 0) {
          const camStream = await navigator.mediaDevices.getUserMedia({ video: true });
          const track = camStream.getVideoTracks()[0];
          stream.addTrack(track);
          pc.addTrack(track, stream);
        }
      } else {
        stream.getVideoTracks().forEach(t => {
          stream.removeTrack(t);
          t.stop();
          const sender = pc.getSenders().find(s => s.track === t);
          if (sender) pc.removeTrack(sender);
        });
      }
      const refreshed = new MediaStream(stream.getTracks());
      localStreamRef.current = refreshed; setLocalStream(refreshed);
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await db.collection('smiletak_calls').doc(callId).update({
        type: newType,
        renegotiateOffer: { offer: { type: offer.type, sdp: offer.sdp }, from: profile.id }
      });
      setCall(c => c ? Object.assign({}, c, { type: newType }) : c);
    } catch (e) {
      toast('Could not switch to ' + newType + ' call: ' + e.message, 'error');
      setSwitchingType(false);
    }
  };

  const startCall = async (other, type) => {
    if (!other || callStatus !== 'idle') return;
    // Respect the admin's kill switch. Checked here (not just hidden in the
    // UI) so a stale/cached page or a direct call to startCall() can't
    // bypass it.
    if (type === 'video' && !callFeatures.videoEnabled) { toast('Video calls are currently disabled', 'info'); return; }
    if (type !== 'video' && !callFeatures.voiceEnabled) { toast('Voice calls are currently disabled', 'info'); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: MIC_CONSTRAINTS, video: type === 'video' });
      localStreamRef.current = stream; setLocalStream(stream);
      const callRef = db.collection('smiletak_calls').doc();
      const callInfo = { id: callRef.id, callerId: profile.id, calleeId: other.id, type };
      const pc = setupPeer(callRef.id, true);
      stream.getTracks().forEach(t => pc.addTrack(t, stream));
      setRemoteUser(other); setCall(callInfo); setCallStatus('outgoing');

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await callRef.set({
        callerId: profile.id, calleeId: other.id, type,
        callerName: profile.fullName, callerPhoto: profile.photoURL || null,
        status: 'ringing', offer: { type: offer.type, sdp: offer.sdp },
        createdAt: FieldValue.serverTimestamp()
      });

      unsubCallDoc.current = db.collection('smiletak_calls').doc(callRef.id).onSnapshot(async snap => {
        if (!snap.exists) return;
        const data = snap.data();
        if (data.answer && !pc.currentRemoteDescription) {
          await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
        }
        if (data.deviceRinging) setCall(c => (c && !c.deviceRinging) ? Object.assign({}, c, { deviceRinging: true }) : c);
        if (data.status === 'accepted') { clearTimeout(ringTimeout.current); connectedAt.current = Date.now(); setCallStatus('connected'); }
        if (data.status === 'declined') { toast('Call declined', 'info'); cleanup(); }
        if (data.status === 'ended' || data.status === 'missed') cleanup();
        if (data.upgradeToGroupCallId) handleUpgrade(data.upgradeToGroupCallId, other.id, type);
        handleRenegotiation(data, pc, callRef.id);
      });
      const candUnsub = db.collection('smiletak_calls').doc(callRef.id).collection('calleeCandidates').onSnapshot(snap => {
        snap.docChanges().forEach(c => { if (c.type === 'added') pc.addIceCandidate(new RTCIceCandidate(c.doc.data())).catch(() => {}); });
      });
      unsubCandidates.current.push(candUnsub);

      ringTimeout.current = setTimeout(() => {
        db.collection('smiletak_calls').doc(callRef.id).update({ status: 'missed' }).catch(() => {});
        logCallMessage(callInfo, 'missed', null);
        toast('No answer', 'info'); cleanup();
      }, 45000);
    } catch (e) { toast('Could not start call: ' + e.message, 'error'); cleanup(); }
  };

  const acceptCall = async () => {
    if (!call) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: MIC_CONSTRAINTS, video: call.type === 'video' });
      localStreamRef.current = stream; setLocalStream(stream);
      const pc = setupPeer(call.id, false);
      stream.getTracks().forEach(t => pc.addTrack(t, stream));
      await pc.setRemoteDescription(new RTCSessionDescription(call.offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await db.collection('smiletak_calls').doc(call.id).update({ status: 'accepted', answer: { type: answer.type, sdp: answer.sdp } });
      connectedAt.current = Date.now();
      setCallStatus('connected');

      unsubCallDoc.current = db.collection('smiletak_calls').doc(call.id).onSnapshot(snap => {
        if (!snap.exists) return;
        const data = snap.data();
        if (data.status === 'ended') { cleanup(); return; }
        if (data.upgradeToGroupCallId) handleUpgrade(data.upgradeToGroupCallId, call.callerId, call.type);
        handleRenegotiation(data, pc, call.id);
      });
      const candUnsub = db.collection('smiletak_calls').doc(call.id).collection('callerCandidates').onSnapshot(snap => {
        snap.docChanges().forEach(c => { if (c.type === 'added') pc.addIceCandidate(new RTCIceCandidate(c.doc.data())).catch(() => {}); });
      });
      unsubCandidates.current.push(candUnsub);
    } catch (e) { toast('Could not join call: ' + e.message, 'error'); declineCall(); }
  };

  const declineCall = () => {
    if (call) {
      db.collection('smiletak_calls').doc(call.id).update({ status: 'declined' }).catch(() => {});
      logCallMessage(call, 'declined', null);
    }
    cleanup();
  };

  const endCall = () => {
    if (call) {
      const wasConnected = callStatus === 'connected' && connectedAt.current;
      const duration = wasConnected ? Math.round((Date.now() - connectedAt.current) / 1000) : null;
      db.collection('smiletak_calls').doc(call.id).update({ status: wasConnected ? 'ended' : 'cancelled' }).catch(() => {});
      logCallMessage(call, wasConnected ? 'completed' : 'cancelled', duration);
    }
    cleanup();
  };

  /* ---- GROUP CALLS (mesh: one RTCPeerConnection per other participant) ----
     Any current participant may update the call doc (see the
     smiletak_groupCalls rule) — including adding new people or writing
     their own join/decline/leave status — since everyone on a shared call
     already trusts each other, same as a group chat. */
  const [groupCall, setGroupCall] = useState(null);
  const [incomingGroupCall, setIncomingGroupCall] = useState(null);
  const groupPCs = useRef({});
  const groupLocalStream = useRef(null);
  const groupUnsubs = useRef([]);

  useEffect(() => {
    if (!profile) return;
    const unsub = db.collection('smiletak_groupCalls')
      .where('participantIds', 'array-contains', profile.id)
      .where('status', '==', 'active')
      .onSnapshot(snap => {
        snap.docChanges().forEach(change => {
          const data = change.doc.data();
          const id = change.doc.id;
          const myResp = (data.responses || {})[profile.id];
          if (!myResp && data.hostId !== profile.id) {
            setIncomingGroupCall(prev => (prev && prev.id === id) ? prev : { id, type: data.type, groupName: data.groupName, hostId: data.hostId });
          }
        });
      });
    return unsub;
  }, [profile]);

  const cleanupGroupPCs = () => {
    Object.values(groupPCs.current).forEach(pc => { try { pc.close(); } catch (e) {} });
    groupPCs.current = {};
    if (groupLocalStream.current) { groupLocalStream.current.getTracks().forEach(t => t.stop()); groupLocalStream.current = null; }
    groupUnsubs.current.forEach(u => u()); groupUnsubs.current = [];
  };

  const meshConnect = (callId, otherUid, pc) => {
    const pairKey = [profile.id, otherUid].sort().join('_');
    const amFirst = profile.id < otherUid;
    const sigRef = db.collection('smiletak_groupCalls').doc(callId).collection('signals').doc(pairKey);
    const myIce = sigRef.collection(amFirst ? 'iceA' : 'iceB');
    const theirIce = sigRef.collection(amFirst ? 'iceB' : 'iceA');
    pc.onicecandidate = e => { if (e.candidate) myIce.add(e.candidate.toJSON()).catch(() => {}); };
    groupUnsubs.current.push(theirIce.onSnapshot(snap => {
      snap.docChanges().forEach(c => { if (c.type === 'added') pc.addIceCandidate(new RTCIceCandidate(c.doc.data())).catch(() => {}); });
    }));
    if (amFirst) {
      groupUnsubs.current.push(sigRef.onSnapshot(async snap => {
        const d = snap.data();
        if (d && d.answer && !pc.currentRemoteDescription) await pc.setRemoteDescription(new RTCSessionDescription(d.answer)).catch(() => {});
      }));
      sigRef.get().then(async snap => {
        if (!snap.exists || !snap.data().offer) {
          const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
          await sigRef.set({ offer: { type: offer.type, sdp: offer.sdp } }, { merge: true });
        }
      });
    } else {
      groupUnsubs.current.push(sigRef.onSnapshot(async snap => {
        const d = snap.data();
        if (d && d.offer && !pc.currentRemoteDescription) {
          await pc.setRemoteDescription(new RTCSessionDescription(d.offer));
          const answer = await pc.createAnswer(); await pc.setLocalDescription(answer);
          await sigRef.set({ answer: { type: answer.type, sdp: answer.sdp } }, { merge: true });
        }
      }));
    }
  };

  const connectToParticipant = (callId, otherUid) => {
    if (groupPCs.current[otherUid]) return;
    const pc = new RTCPeerConnection(RTC_CONFIG);
    groupPCs.current[otherUid] = pc;
    const remote = new MediaStream();
    pc.ontrack = e => {
      e.streams[0].getTracks().forEach(t => remote.addTrack(t));
      setGroupCall(g => g && Object.assign({}, g, { participants: Object.assign({}, g.participants, { [otherUid]: { stream: remote } }) }));
    };
    if (groupLocalStream.current) groupLocalStream.current.getTracks().forEach(t => pc.addTrack(t, groupLocalStream.current));
    meshConnect(callId, otherUid, pc);
  };

  const watchGroupCallDoc = (callId) => {
    const unsub = db.collection('smiletak_groupCalls').doc(callId).onSnapshot(snap => {
      if (!snap.exists) return;
      const data = snap.data();
      if (data.status === 'ended') { cleanupGroupPCs(); setGroupCall(null); return; }
      const responses = data.responses || {};
      (data.participantIds || []).forEach(uid => {
        if (uid === profile.id) return;
        if (responses[uid] === 'joined' && !groupPCs.current[uid]) {
          connectToParticipant(callId, uid);
          setGroupCall(g => g && Object.assign({}, g, { participants: Object.assign({ [uid]: { stream: null } }, g.participants) }));
        }
        if ((responses[uid] === 'left' || responses[uid] === 'declined') && groupPCs.current[uid]) {
          try { groupPCs.current[uid].close(); } catch (e) {}
          delete groupPCs.current[uid];
          setGroupCall(g => { if (!g) return g; const p = Object.assign({}, g.participants); delete p[uid]; return Object.assign({}, g, { participants: p }); });
        }
      });
    });
    groupUnsubs.current.push(unsub);
  };

  /* ---- UPGRADING A NORMAL 1:1 CALL TO A GROUP CALL ----
     Lets either person on an ordinary call add a third (or more) people
     without hanging up. The person who taps "Add" creates a real
     smiletak_groupCalls doc (pre-marking both existing participants as
     'joined' so neither of them has to re-answer) and drops a pointer to it
     on the old 1:1 call doc. The OTHER original participant's 1:1 listener
     (above, in startCall/acceptCall) picks that pointer up and calls
     handleUpgrade too — so both sides swap their single peer connection for
     a mesh connection at the same time, reusing the mic/camera stream
     that's already flowing so nothing drops. The new person is rung the
     normal way, through the existing incoming-group-call listener. */
  const handleUpgrade = (groupCallId, otherUid, type) => {
    if (pcRef.current) { try { pcRef.current.close(); } catch (e) {} pcRef.current = null; }
    if (unsubCallDoc.current) { unsubCallDoc.current(); unsubCallDoc.current = null; }
    unsubCandidates.current.forEach(u => u()); unsubCandidates.current = [];
    if (ringTimeout.current) { clearTimeout(ringTimeout.current); ringTimeout.current = null; }
    connectedAt.current = null;
    groupLocalStream.current = localStreamRef.current;
    setLocalStream(null); setRemoteStream(null); setCall(null); setRemoteUser(null); setCallStatus('idle');
    setGroupCall(g => g && g.id === groupCallId ? g : { id: groupCallId, type, groupName: null, myStream: groupLocalStream.current, participants: {} });
    watchGroupCallDoc(groupCallId);
  };

  const upgradeToGroupCall = async (newUid) => {
    if (!call || callStatus !== 'connected' || groupCall) return;
    try {
      const otherUid = call.callerId === profile.id ? call.calleeId : call.callerId;
      const ref = db.collection('smiletak_groupCalls').doc();
      const responses = {}; responses[profile.id] = 'joined'; responses[otherUid] = 'joined';
      await ref.set({
        type: call.type, hostId: profile.id, groupId: null, groupName: null,
        participantIds: [profile.id, otherUid, newUid], responses,
        status: 'active', createdAt: FieldValue.serverTimestamp()
      });
      await db.collection('smiletak_calls').doc(call.id).update({ upgradeToGroupCallId: ref.id });
      handleUpgrade(ref.id, otherUid, call.type);
    } catch (e) { toast('Could not add to call: ' + e.message, 'error'); }
  };

  const startGroupCall = async (otherUids, type, groupId, groupName) => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: MIC_CONSTRAINTS, video: type === 'video' });
      groupLocalStream.current = stream;
      const ref = db.collection('smiletak_groupCalls').doc();
      const participantIds = [profile.id].concat(otherUids);
      const responses = {}; responses[profile.id] = 'joined';
      await ref.set({ type, hostId: profile.id, groupId: groupId || null, groupName: groupName || null, participantIds, responses, status: 'active', createdAt: FieldValue.serverTimestamp() });
      setGroupCall({ id: ref.id, type, groupName, myStream: stream, participants: {} });
      watchGroupCallDoc(ref.id);
    } catch (e) { toast('Could not start group call: ' + e.message, 'error'); }
  };

  const joinGroupCall = async (callInfo) => {
    // Accepts an explicit callInfo ({ id, type, groupName }) so a group's
    // "On call" banner can join an already-in-progress call directly,
    // without waiting for/needing the incoming-ring popup. Falls back to
    // incomingGroupCall for the existing ring-accept flow.
    const info = callInfo || incomingGroupCall;
    if (!info) return;
    const { id: callId, type, groupName } = info;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: MIC_CONSTRAINTS, video: type === 'video' });
      groupLocalStream.current = stream;
      const patch = {}; patch['responses.' + profile.id] = 'joined';
      await db.collection('smiletak_groupCalls').doc(callId).update(patch);
      setIncomingGroupCall(null);
      setGroupCall({ id: callId, type, groupName, myStream: stream, participants: {} });
      watchGroupCallDoc(callId);
    } catch (e) { toast('Could not join call: ' + e.message, 'error'); setIncomingGroupCall(null); }
  };

  const declineGroupCall = () => {
    if (!incomingGroupCall) return;
    const patch = {}; patch['responses.' + profile.id] = 'declined';
    db.collection('smiletak_groupCalls').doc(incomingGroupCall.id).update(patch).catch(() => {});
    setIncomingGroupCall(null);
  };

  const leaveGroupCall = () => {
    if (groupCall) {
      const patch = {}; patch['responses.' + profile.id] = 'left';
      db.collection('smiletak_groupCalls').doc(groupCall.id).update(patch).catch(() => {});
    }
    cleanupGroupPCs();
    setGroupCall(null);
  };

  const addToGroupCall = async (uid) => {
    if (!groupCall) return;
    try {
      const patch = { participantIds: FieldValue.arrayUnion(uid) };
      patch['responses.' + uid] = FieldValue.delete();
      await db.collection('smiletak_groupCalls').doc(groupCall.id).update(patch);
    } catch (e) { toast(e.message, 'error'); }
  };

  return h(CallCtx.Provider, { value: { callStatus, call, startCall, switchCallType, switchingType, callFeatures, groupCall, incomingGroupCall, startGroupCall, joinGroupCall, declineGroupCall, leaveGroupCall, addToGroupCall, upgradeToGroupCall } },
    children,
    callStatus === 'incoming' && h(IncomingCallScreen, { call, remoteUser, onAccept: acceptCall, onDecline: declineCall }),
    (callStatus === 'outgoing' || callStatus === 'connected') && h(ActiveCallScreen, { call, remoteUser, status: callStatus, localStream, remoteStream, onEnd: endCall, onAdd: upgradeToGroupCall, onSwitchType: switchCallType, switchingType, videoEnabled: callFeatures.videoEnabled }),
    incomingGroupCall && !groupCall && h(IncomingGroupCallScreen, { call: incomingGroupCall, onAccept: joinGroupCall, onDecline: declineGroupCall }),
    groupCall && h(GroupCallScreen, { call: groupCall, onLeave: leaveGroupCall, onAdd: addToGroupCall })
  );
}

function IncomingCallScreen({ remoteUser, call, onAccept, onDecline }) {
  useRingTone(true);
  useEffect(() => {
    if (!navigator.vibrate) return;
    navigator.vibrate([400, 200, 400, 200, 400]);
    const t = setInterval(() => navigator.vibrate([400, 200, 400, 200, 400]), 3000);
    return () => clearInterval(t);
  }, []);
  return h('div', { className: 'fixed inset-0 z-[999] bg-ink-900 text-white flex flex-col items-center justify-between py-16 px-6' },
    h('div', { className: 'flex flex-col items-center gap-3 mt-10' },
      h('p', { className: 'text-sm opacity-70' }, (call && call.type === 'video') ? 'Incoming video call' : 'Incoming voice call'),
      h(Avatar, { url: remoteUser && remoteUser.photoURL, name: remoteUser && remoteUser.fullName, size: 96 }),
      h('p', { className: 'text-xl font-bold mt-2' }, (remoteUser && remoteUser.fullName) || 'Unknown')
    ),
    h('div', { className: 'flex items-center gap-16' },
      h('button', { onClick: onDecline, className: 'w-16 h-16 rounded-full bg-red-500 flex items-center justify-center text-2xl' }, h('i', { className: 'fa-solid fa-phone-slash' })),
      h('button', { onClick: onAccept, className: 'w-16 h-16 rounded-full bg-green-500 flex items-center justify-center text-2xl' }, h('i', { className: 'fa-solid fa-phone' }))
    )
  );
}

function ActiveCallScreen({ remoteUser, status, call, localStream, remoteStream, onEnd, onAdd, onSwitchType, switchingType, videoEnabled }) {
  const [muted, setMuted] = useState(false);
  const [camOff, setCamOff] = useState(false);
  const [secs, setSecs] = useState(0);
  const [adding, setAdding] = useState(false);
  const [onSpeaker, setOnSpeaker] = useState(true); // browsers default remote audio to the loudspeaker
  const [speakerSupported, setSpeakerSupported] = useState(true);
  const remoteVidRef = useRef(null);
  const remoteAudioRef = useRef(null); // dedicated element so voice-only calls actually play sound
  const localVidRef = useRef(null);
  const isVideo = call && call.type === 'video';
  const toast = useToast();
  useRingTone(status === 'outgoing');

  useEffect(() => {
    if (status !== 'connected') return;
    const t = setInterval(() => setSecs(s => s + 1), 1000);
    return () => clearInterval(t);
  }, [status]);

  useEffect(() => { if (remoteVidRef.current && remoteStream) { remoteVidRef.current.srcObject = remoteStream; remoteVidRef.current.play().catch(() => {}); } }, [remoteStream, isVideo]);
  useEffect(() => { if (remoteAudioRef.current && remoteStream) { remoteAudioRef.current.srcObject = remoteStream; remoteAudioRef.current.play().catch(() => {}); } }, [remoteStream, isVideo]);
  // Includes isVideo in the deps (matching the remoteStream effect above) so
  // that switching voice -> video re-runs this after the local <video> tag
  // actually mounts. isVideo only flips true once call.type updates, which
  // happens *after* a Firestore round-trip — later than localStream itself
  // gets updated with the new camera track. Without isVideo here, the local
  // preview element mounts with no srcObject ever assigned to it, so the
  // remote person shows up fine but you never see your own camera.
  // The explicit .play() call after assigning srcObject matters here too:
  // some mobile browsers (notably iOS Safari) don't reliably auto-start
  // playback when srcObject is set on a video element outside of a direct
  // user-tap gesture, especially on a tag that just mounted moments ago —
  // it can sit there silently showing nothing even though the stream is
  // correctly attached. Calling .play() explicitly forces it to start.
  useEffect(() => { if (localVidRef.current && localStream) { localVidRef.current.srcObject = localStream; localVidRef.current.play().catch(() => {}); } }, [localStream, isVideo]);

  const toggleMute = () => { if (localStream) { localStream.getAudioTracks().forEach(t => t.enabled = muted); setMuted(m => !m); } };
  const toggleCam = () => { if (localStream) { localStream.getVideoTracks().forEach(t => t.enabled = camOff); setCamOff(c => !c); } };
  const fmt = (s) => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');

  // Best-effort loudspeaker <-> earpiece routing via the Audio Output Devices
  // API (HTMLMediaElement.setSinkId). Support varies a lot by browser/OS —
  // notably iOS Safari doesn't support it at all — so this quietly no-ops
  // with a toast rather than breaking the call if the device can't do it.
  const toggleSpeaker = async () => {
    const el = isVideo ? remoteVidRef.current : remoteAudioRef.current;
    if (!el || typeof el.setSinkId !== 'function') {
      setSpeakerSupported(false);
      toast('This device/browser doesn\u2019t support switching audio output', 'info');
      return;
    }
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const outputs = devices.filter(d => d.kind === 'audiooutput');
      const earpiece = outputs.find(d => /earpiece|receiver/i.test(d.label));
      const speaker = outputs.find(d => /speaker/i.test(d.label)) || outputs.find(d => d.deviceId === 'default');
      const goingToSpeaker = !onSpeaker;
      const target = goingToSpeaker ? speaker : earpiece;
      if (!target) {
        toast('No earpiece output found on this device', 'info');
        return;
      }
      await el.setSinkId(target.deviceId);
      setOnSpeaker(goingToSpeaker);
    } catch (e) { toast('Could not switch audio output: ' + e.message, 'error'); }
  };

  return h('div', { className: 'fixed inset-0 z-[999] bg-ink-900 text-white flex flex-col items-center justify-between py-10 px-6 overflow-hidden' },
    isVideo && remoteStream && h('video', { ref: remoteVidRef, autoPlay: true, playsInline: true, className: 'absolute inset-0 w-full h-full object-cover' }),
    !isVideo && remoteStream && h('audio', { ref: remoteAudioRef, autoPlay: true }),
    isVideo && h('video', { ref: localVidRef, autoPlay: true, playsInline: true, muted: true, className: 'absolute top-4 right-4 w-24 h-32 rounded-xl object-cover border border-white/30' }),
    h('div', { className: 'relative z-10 flex flex-col items-center gap-3 mt-6' },
      (!isVideo || !remoteStream) && h(Avatar, { url: remoteUser && remoteUser.photoURL, name: remoteUser && remoteUser.fullName, size: 96 }),
      h('p', { className: 'text-xl font-bold mt-2' }, (remoteUser && remoteUser.fullName) || 'Unknown'),
      h('p', { className: 'text-sm opacity-70' }, status === 'connected' ? fmt(secs) : (call && call.deviceRinging ? 'Ringing…' : 'Calling…')),
      status === 'connected' && switchingType && h('p', { className: 'text-xs opacity-60' }, 'Switching…')
    ),
    h('div', { className: 'relative z-10 flex flex-wrap items-center justify-center gap-4' },
      h('button', { onClick: toggleMute, className: 'w-14 h-14 rounded-full flex items-center justify-center ' + (muted ? 'bg-white text-ink-900' : 'bg-white/20') }, h('i', { className: 'fa-solid ' + (muted ? 'fa-microphone-slash' : 'fa-microphone') })),
      status === 'connected' && speakerSupported && h('button', { onClick: toggleSpeaker, className: 'w-14 h-14 rounded-full flex items-center justify-center ' + (onSpeaker ? 'bg-white text-ink-900' : 'bg-white/20') }, h('i', { className: 'fa-solid ' + (onSpeaker ? 'fa-volume-high' : 'fa-ear-listen') })),
      status === 'connected' && onSwitchType && (isVideo || videoEnabled !== false) && h('button', {
        onClick: () => onSwitchType(isVideo ? 'audio' : 'video'),
        disabled: switchingType,
        className: 'w-14 h-14 rounded-full flex items-center justify-center bg-white/20 ' + (switchingType ? 'opacity-50' : '')
      }, h('i', { className: 'fa-solid ' + (isVideo ? 'fa-video-slash' : 'fa-video') })),
      status === 'connected' && onAdd && h('button', { onClick: () => setAdding(true), className: 'w-14 h-14 rounded-full bg-white/20 flex items-center justify-center' }, h('i', { className: 'fa-solid fa-user-plus' })),
      h('button', { onClick: onEnd, className: 'w-16 h-16 rounded-full bg-red-500 flex items-center justify-center text-2xl' }, h('i', { className: 'fa-solid fa-phone-slash' })),
      isVideo && h('button', { onClick: toggleCam, className: 'w-14 h-14 rounded-full flex items-center justify-center ' + (camOff ? 'bg-white text-ink-900' : 'bg-white/20') }, h('i', { className: 'fa-solid ' + (camOff ? 'fa-video-slash' : 'fa-video') }))
    ),
    adding && h(AddToCallModal, { onClose: () => setAdding(false), onPick: (uid) => { onAdd(uid); setAdding(false); } })
  );
}

/* ============================== GROUP CALL SCREENS ============================== */
function IncomingGroupCallScreen({ call, onAccept, onDecline }) {
  useRingTone(true);
  useEffect(() => {
    if (!navigator.vibrate) return;
    navigator.vibrate([400, 200, 400, 200, 400]);
    const t = setInterval(() => navigator.vibrate([400, 200, 400, 200, 400]), 3000);
    return () => clearInterval(t);
  }, []);
  return h('div', { className: 'fixed inset-0 z-[999] bg-ink-900 text-white flex flex-col items-center justify-between py-16 px-6' },
    h('div', { className: 'flex flex-col items-center gap-3 mt-10' },
      h('p', { className: 'text-sm opacity-70' }, call.type === 'video' ? 'Incoming group video call' : 'Incoming group call'),
      h('div', { className: 'w-24 h-24 rounded-full bg-brand-600 flex items-center justify-center text-3xl' }, h('i', { className: 'fa-solid fa-users' })),
      h('p', { className: 'text-xl font-bold mt-2' }, call.groupName || 'Group call')
    ),
    h('div', { className: 'flex items-center gap-16' },
      h('button', { onClick: onDecline, className: 'w-16 h-16 rounded-full bg-red-500 flex items-center justify-center text-2xl' }, h('i', { className: 'fa-solid fa-phone-slash' })),
      h('button', { onClick: onAccept, className: 'w-16 h-16 rounded-full bg-green-500 flex items-center justify-center text-2xl' }, h('i', { className: 'fa-solid fa-phone' }))
    )
  );
}

function GroupCallScreen({ call, onLeave, onAdd }) {
  const isVideo = call.type === 'video';
  const localVidRef = useRef(null);
  const [adding, setAdding] = useState(false);
  const [muted, setMuted] = useState(false);
  const [onSpeaker, setOnSpeaker] = useState(true);
  const [speakerSupported, setSpeakerSupported] = useState(true);
  const [sinkId, setSinkId] = useState(null); // propagated to every participant tile's audio/video element
  const toast = useToast();
  useEffect(() => { if (localVidRef.current && call.myStream) localVidRef.current.srcObject = call.myStream; }, [call.myStream]);
  const tiles = Object.keys(call.participants || {});

  const toggleMute = () => { if (call.myStream) { call.myStream.getAudioTracks().forEach(t => t.enabled = muted); setMuted(m => !m); } };

  // Same best-effort loudspeaker/earpiece routing as 1:1 calls, applied to
  // every participant tile at once since a group call has one remote
  // audio/video element per person. See the 1:1 ActiveCallScreen comment
  // for the iOS Safari caveat — this silently no-ops there.
  const toggleSpeaker = async () => {
    const probe = document.createElement('audio');
    if (typeof probe.setSinkId !== 'function') {
      setSpeakerSupported(false);
      toast('This device/browser doesn\u2019t support switching audio output', 'info');
      return;
    }
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const outputs = devices.filter(d => d.kind === 'audiooutput');
      const earpiece = outputs.find(d => /earpiece|receiver/i.test(d.label));
      const speaker = outputs.find(d => /speaker/i.test(d.label)) || outputs.find(d => d.deviceId === 'default');
      const goingToSpeaker = !onSpeaker;
      const target = goingToSpeaker ? speaker : earpiece;
      if (!target) { toast('No earpiece output found on this device', 'info'); return; }
      setSinkId(target.deviceId);
      setOnSpeaker(goingToSpeaker);
    } catch (e) { toast('Could not switch audio output: ' + e.message, 'error'); }
  };

  return h('div', { className: 'fixed inset-0 z-[999] bg-ink-900 text-white flex flex-col' },
    h('div', { className: 'px-4 pt-4 pb-2 text-sm text-white/70' }, call.groupName || 'Group call'),
    h('div', { className: 'flex-1 grid grid-cols-2 gap-1 p-1 overflow-y-auto no-scrollbar auto-rows-[140px]' },
      tiles.length === 0 && h('div', { className: 'col-span-2 flex items-center justify-center text-sm text-white/60' }, 'Waiting for others to join…'),
      tiles.map(uid => h(GroupCallTile, { key: uid, uid, stream: call.participants[uid].stream, isVideo, sinkId }))
    ),
    isVideo && h('video', { ref: localVidRef, autoPlay: true, playsInline: true, muted: true, className: 'absolute top-16 right-4 w-20 h-28 rounded-xl object-cover border border-white/30' }),
    h('div', { className: 'flex items-center justify-center gap-4 py-6 flex-wrap' },
      h('button', { onClick: toggleMute, className: 'w-14 h-14 rounded-full flex items-center justify-center ' + (muted ? 'bg-white text-ink-900' : 'bg-white/20') }, h('i', { className: 'fa-solid ' + (muted ? 'fa-microphone-slash' : 'fa-microphone') })),
      speakerSupported && h('button', { onClick: toggleSpeaker, className: 'w-14 h-14 rounded-full flex items-center justify-center ' + (onSpeaker ? 'bg-white text-ink-900' : 'bg-white/20') }, h('i', { className: 'fa-solid ' + (onSpeaker ? 'fa-volume-high' : 'fa-ear-listen') })),
      h('button', { onClick: () => setAdding(true), className: 'w-14 h-14 rounded-full bg-white/20 flex items-center justify-center' }, h('i', { className: 'fa-solid fa-user-plus' })),
      h('button', { onClick: onLeave, className: 'w-16 h-16 rounded-full bg-red-500 flex items-center justify-center text-2xl' }, h('i', { className: 'fa-solid fa-phone-slash' }))
    ),
    adding && h(AddToCallModal, { onClose: () => setAdding(false), onPick: (uid) => { onAdd(uid); setAdding(false); } })
  );
}
function GroupCallTile({ uid, stream, isVideo, sinkId }) {
  const [user, setUser] = useState(null);
  const vidRef = useRef(null);
  const audioRef = useRef(null); // used whenever this tile isn't showing a <video> so voice-only participants are still heard
  const showsVideo = isVideo && !!stream;
  useEffect(() => { db.collection('smiletak_users').doc(uid).get().then(s => { if (s.exists) setUser(s.data()); }); }, [uid]);
  useEffect(() => { if (vidRef.current && stream) vidRef.current.srcObject = stream; }, [stream, showsVideo]);
  useEffect(() => { if (audioRef.current && stream) audioRef.current.srcObject = stream; }, [stream, showsVideo]);
  useEffect(() => {
    if (!sinkId) return;
    const el = showsVideo ? vidRef.current : audioRef.current;
    if (el && typeof el.setSinkId === 'function') el.setSinkId(sinkId).catch(() => {});
  }, [sinkId, showsVideo]);
  return h('div', { className: 'relative bg-ink-800 rounded-lg overflow-hidden flex items-center justify-center' },
    showsVideo ? h('video', { ref: vidRef, autoPlay: true, playsInline: true, className: 'w-full h-full object-cover' }) : h(Avatar, { url: user && user.photoURL, name: user && user.fullName, size: 56 }),
    !showsVideo && stream && h('audio', { ref: audioRef, autoPlay: true }),
    h('span', { className: 'absolute bottom-1 left-1 text-[10px] bg-black/50 px-1.5 py-0.5 rounded' }, (user && user.fullName) || '…')
  );
}
function AddToCallModal({ onClose, onPick }) {
  const { profile } = useAuth();
  const [q, setQ] = useState('');
  const [results, setResults] = useState([]);
  const runSearch = async () => {
    const term = q.trim();
    if (!term) { setResults([]); return; }
    const snaps = await Promise.all([
      db.collection('smiletak_users').orderBy('username').startAt(term.toLowerCase()).endAt(term.toLowerCase() + '\uf8ff').limit(10).get(),
      db.collection('smiletak_users').orderBy('fullName').startAt(term).endAt(term + '\uf8ff').limit(10).get()
    ]);
    const map = {};
    snaps.forEach(s => s.docs.forEach(d => { if (d.id !== profile.id) map[d.id] = Object.assign({ id: d.id }, d.data()); }));
    setResults(Object.values(map));
  };
  return h('div', { className: 'fixed inset-0 z-[1000] bg-black/60 flex items-end', onClick: onClose },
    h('div', { className: 'bg-white dark:bg-ink-800 text-slate-900 dark:text-white rounded-t-2xl w-full p-4 max-h-[70vh] overflow-y-auto', onClick: e => e.stopPropagation() },
      h('p', { className: 'font-semibold mb-3' }, 'Add to call'),
      h('input', { className: inputCls, placeholder: 'Search people', value: q, onChange: e => setQ(e.target.value), onKeyUp: runSearch }),
      results.map(u => h('div', { key: u.id, className: 'flex items-center gap-3 py-2 cursor-pointer', onClick: () => onPick(u.id) },
        h(Avatar, { url: u.photoURL, name: u.fullName, size: 40 }),
        h('p', { className: 'text-sm flex-1' }, u.fullName)
      ))
    )
  );
}

/* ============================== ROOT ============================== */
function Root() {
  const themeState = useTheme();
  const { user, profile, loading } = useAuth();
  if (loading) {
    return h('div', { className: 'h-full flex items-center justify-center' }, h('div', { className: 'w-6 h-6 border-2 border-brand-500 border-t-transparent rounded-full spinner' }));
  }
  return h(ThemeCtx.Provider, { value: themeState },
    !user || !profile ? h(AuthScreen, null) : h(CallProvider, null, h(AppShell, null), h(FloatingAdOverlay, null))
  );
}
function App() {
  return h(ToastProvider, null, h(AuthProvider, null, h(Root, null)));
}

/* Catches runtime errors anywhere in the tree (e.g. a bad screen crashing)
   and shows a clear "Something went wrong" + reload button instead of a
   silent blank screen — much easier to diagnose than a white page. */
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error('SmileTak crashed:', error, info); }
  render() {
    if (this.state.error) {
      return h('div', { style: { height: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 14, background: '#0b0f16', color: '#fff', padding: 24, textAlign: 'center', fontFamily: 'sans-serif' } },
        h('div', { style: { fontSize: 32 } }, '⚠️'),
        h('div', { style: { fontWeight: 700, fontSize: 16 } }, 'Something went wrong'),
        h('div', { style: { fontSize: 13, opacity: .7, maxWidth: 320 } }, (this.state.error && this.state.error.message) || 'Unknown error'),
        h('button', { onClick: () => { this.setState({ error: null }); location.reload(); }, style: { background: '#00A884', color: '#fff', border: 'none', padding: '10px 22px', borderRadius: 999, fontWeight: 600, fontSize: 14 } }, 'Reload')
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(h(ErrorBoundary, null, h(App, null)));

// Register the service worker so the app is installable and has an offline
// app shell. Registered after the initial render so it never delays first
// paint; a failed registration (e.g. sw.js missing, or running from a
// file:// context that doesn't support service workers) is swallowed since
// the app works fine without it, just without install/offline support.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
} catch (e) {
  document.getElementById('root').innerHTML =
    '<div style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0b0f16;color:#fff;padding:24px;text-align:center;font-family:sans-serif;">' +
    '<div style="font-size:32px;">⚠️</div>' +
    '<div style="font-weight:700;font-size:16px;">SmileTak failed to start</div>' +
    '<div style="font-size:13px;opacity:.7;max-width:320px;">' + (e && e.message ? e.message : 'Unknown error') + '</div>' +
    '<button onclick="location.reload()" style="background:#00A884;color:#fff;border:none;padding:10px 22px;border-radius:999px;font-weight:600;font-size:14px;">Retry</button>' +
    '</div>';
}

</script>
</body>
</html>
