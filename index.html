function CreateStatusModal({ onClose, onText, onMedia }) {
  const { profile } = useAuth();
  const [mode, setMode] = useState('text'); // 'text' | 'preview'
  const [text, setText] = useState('');
  const bgs = ['#00A884', '#075E54', '#128C7E', '#25D366', '#34495E', '#8E44AD'];
  const [bg, setBg] = useState(bgs[0]);
  const [pickedFile, setPickedFile] = useState(null);
  const [pickedType, setPickedType] = useState(null);
  const [previewUrl, setPreviewUrl] = useState(null);
  const [caption, setCaption] = useState('');
  const [uploading, setUploading] = useState(false);
  const [pct, setPct] = useState(0);
  const [stalled, setStalled] = useState(false);
  const imgRef = useRef(null);
  const vidRef = useRef(null);
  const cancelRef = useRef(null);
  const stallTimer = useRef(null);
  const toast = useToast();

  useEffect(() => () => { previewUrl && URL.revokeObjectURL(previewUrl); clearTimeout(stallTimer.current); }, [previewUrl]);

  const pickMedia = (file, type) => {
    if (!file) return;
    const capBonus = isPremiumActive(profile) ? 3 : 1;
    const maxMB = (type === 'video' ? 30 : 15) * capBonus;
    if (file.size > maxMB * 1024 * 1024) { toast(type + ' status must be under ' + maxMB + 'MB', 'error'); return; }
    setPickedFile(file);
    setPickedType(type);
    setPreviewUrl(URL.createObjectURL(file));
    setMode('preview');
  };

  const discardPreview = () => {
    if (uploading) return;
    previewUrl && URL.revokeObjectURL(previewUrl);
    setPickedFile(null); setPickedType(null); setPreviewUrl(null); setCaption('');
    setMode('text');
  };

  const send = async () => {
    setUploading(true);
    setPct(0);
    setStalled(false);
    try {
      await onMedia(pickedFile, pickedType, caption.trim(), (p) => {
        const rounded = Math.round(p * 100);
        setPct(rounded);
        clearTimeout(stallTimer.current);
        if (rounded >= 100) stallTimer.current = setTimeout(() => setStalled(true), 6000);
        else setStalled(false);
      }, cancelRef);
      onClose();
    } catch (e) {
      if (e && e.code === 'storage/canceled') toast('Upload canceled', 'info');
      else toast('Upload failed: ' + (e.message || 'check your connection and try again'), 'error');
      setUploading(false);
    }
  };
  const cancelUpload = () => { if (cancelRef.current) cancelRef.current(); };

  if (mode === 'preview') {
    return h('div', { className: 'fixed inset-0 z-50 bg-black flex flex-col' },
      h('div', { className: 'flex items-center gap-3 p-3' },
        h('button', { className: 'text-white w-8 h-8 flex items-center justify-center shrink-0', onClick: discardPreview, disabled: uploading }, h('i', { className: 'fa-solid fa-xmark text-xl' })),
        uploading && h('div', { className: 'flex-1' },
          h('div', { className: 'flex justify-between text-white text-xs mb-1' },
            h('span', null, stalled ? 'Finishing up… this can take longer on a slow connection' : ('Uploading ' + pct + '%')),
            h('button', { className: 'text-red-300 font-semibold', onClick: cancelUpload }, 'Cancel')
          ),
          h('div', { className: 'h-1.5 bg-white/20 rounded-full overflow-hidden' }, h('div', { className: 'h-full bg-brand-500 transition-all', style: { width: pct + '%' } }))
        )
      ),
      h('div', { className: 'flex-1 flex items-center justify-center overflow-hidden bg-black' },
        pickedType === 'image'
          ? h('img', { src: previewUrl, className: 'max-h-full max-w-full object-contain' })
          : h('video', { src: previewUrl, controls: true, autoPlay: true, className: 'max-h-full max-w-full object-contain' })
      ),
      h('div', { className: 'flex items-center gap-2 p-3 bg-black' },
        h('input', {
          className: 'flex-1 px-4 py-3 rounded-full bg-white/10 text-white text-sm placeholder-white/50 focus:outline-none',
          placeholder: 'Add a caption…', value: caption, onChange: e => setCaption(e.target.value), disabled: uploading
        }),
        h('button', {
          onClick: send, disabled: uploading,
          className: 'w-12 h-12 rounded-full bg-brand-600 disabled:opacity-50 text-white flex items-center justify-center shrink-0'
        }, uploading ? h('span', { className: 'w-4 h-4 border-2 border-white/50 border-t-white rounded-full spinner' }) : h('i', { className: 'fa-solid fa-paper-plane' }))
      )
    );
  }

  return h('div', { className: 'fixed inset-0 z-50 bg-black/70 flex flex-col' },
    h('div', { className: 'flex justify-between items-center p-4' },
      h('button', { className: 'text-white', onClick: onClose }, h('i', { className: 'fa-solid fa-xmark text-xl' })),
      h('div', { className: 'flex gap-4' },
        h('input', { type: 'file', accept: 'image/*', ref: imgRef, className: 'hidden', onChange: e => pickMedia(e.target.files[0], 'image') }),
        h('input', { type: 'file', accept: 'video/*', ref: vidRef, className: 'hidden', onChange: e => pickMedia(e.target.files[0], 'video') }),
        h('button', { className: 'text-white', onClick: () => imgRef.current.click() }, h('i', { className: 'fa-solid fa-image text-xl' })),
        h('button', { className: 'text-white', onClick: () => vidRef.current.click() }, h('i', { className: 'fa-solid fa-video text-xl' }))
      )
    ),
    h('div', { className: 'flex-1 flex items-center justify-center', style: { background: bg } },
      h('textarea', { autoFocus: true, value: text, onChange: e => setText(e.target.value), placeholder: 'Type a status…', className: 'bg-transparent text-white text-2xl font-semibold text-center w-4/5 outline-none placeholder-white/60', rows: 4 })
    ),
    h('div', { className: 'flex justify-center gap-2 p-4' }, bgs.map(c => h('button', { key: c, className: 'w-7 h-7 rounded-full border-2 ' + (bg === c ? 'border-white' : 'border-transparent'), style: { background: c }, onClick: () => setBg(c) }))),
    h('button', { disabled: !text.trim(), onClick: () => { onText(text.trim(), bg); onClose(); }, className: 'mx-4 mb-4 bg-brand-600 disabled:opacity-40 text-white rounded-full py-3 font-semibold' }, 'Post status')
  );
}

function StatusViewer({ groups, startIndex, startItemIndex, onClose, onOpenChat }) {
  const { profile } = useAuth();
  const toast = useToast();
  const [groupIndex, setGroupIndex] = useState(startIndex || 0);
  const [idx, setIdx] = useState(startItemIndex || 0);
  const data = groups[groupIndex];
  const mine = data.uid === profile.id;
  const item = data.items[idx];
  const [viewers, setViewers] = useState([]);
  const [sharing, setSharing] = useState(false);
  const [forwardOpen, setForwardOpen] = useState(false);
  const [replyText, setReplyText] = useState('');
  const [sendingReply, setSendingReply] = useState(false);
  const closeSharing = useBackClose(sharing, () => setSharing(false));
  const closeForward = useBackClose(forwardOpen, () => setForwardOpen(false));
  useEffect(() => {
    db.collection('smiletak_statuses').doc(item.id).collection('views').doc(profile.id).set({ viewedAt: FieldValue.serverTimestamp() }, { merge: true }).catch(() => {});
  }, [item.id, profile.id]);
  useEffect(() => {
    if (!mine) { setViewers([]); return; }
    const unsub = db.collection('smiletak_statuses').doc(item.id).collection('views').onSnapshot(async snap => {
      const list = await Promise.all(snap.docs.map(async d => {
        const uSnap = await db.collection('smiletak_users').doc(d.id).get();
        return uSnap.exists ? Object.assign({ id: d.id }, uSnap.data()) : null;
      }));
      setViewers(list.filter(Boolean));
    });
    return unsub;
  }, [item.id, mine]);
  // Advancing past the last item of this person moves on to the next
  // person's status automatically, like Instagram/WhatsApp stories —
  // only closing the viewer once everyone in `groups` has been shown.
  const next = () => {
    if (idx < data.items.length - 1) { setIdx(idx + 1); return; }
    if (groupIndex < groups.length - 1) { setGroupIndex(groupIndex + 1); setIdx(0); return; }
    onClose();
  };
  const prev = () => {
    if (idx > 0) { setIdx(idx - 1); return; }
    if (groupIndex > 0) { setGroupIndex(groupIndex - 1); setIdx(groups[groupIndex - 1].items.length - 1); }
  };

  // ---- Auto-playback: every status (text, image, or video) advances to the
  // next one on its own, exactly like WhatsApp/Instagram stories. Text and
  // image items play for a fixed 5s; video items play for their own length
  // and advance the instant they finish. Press-and-hold pauses playback;
  // releasing resumes it (a quick tap still taps to go prev/next). ----
  const IMAGE_DURATION_MS = 5000;
  const [progress, setProgress] = useState(0);
  const [paused, setPaused] = useState(false);
  const [muted, setMuted] = useState(false);
  const videoRef = useRef(null);
  const rafRef = useRef(null);
  const elapsedRef = useRef(0);
  const runStartRef = useRef(null);
  const holdStartRef = useRef(0);
  const itemKey = groupIndex + '-' + idx;

  // Reset progress whenever the active item changes.
  useEffect(() => { elapsedRef.current = 0; runStartRef.current = null; setProgress(0); setMuted(false); }, [itemKey]);

  // Time-based auto-advance for text/image items.
  useEffect(() => {
    if (item.type === 'video') return; // videos drive their own progress below
    if (paused) { runStartRef.current = null; return; }
    runStartRef.current = performance.now() - elapsedRef.current;
    const tick = (now) => {
      const elapsed = now - runStartRef.current;
      elapsedRef.current = elapsed;
      const pct = Math.min(100, (elapsed / IMAGE_DURATION_MS) * 100);
      setProgress(pct);
      if (pct >= 100) { next(); return; }
      rafRef.current = requestAnimationFrame(tick);
    };
    rafRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(rafRef.current);
  }, [itemKey, paused]);

  // Video items: autoplay immediately (falling back to muted playback if the
  // browser blocks audio autoplay), sync the progress bar to playback time,
  // and auto-advance the moment the clip ends — no tap or play button needed.
  useEffect(() => {
    if (item.type !== 'video') return;
    const v = videoRef.current;
    if (!v) return;
    if (paused) { v.pause(); return; }
    v.muted = false;
    const p = v.play();
    if (p && p.catch) p.catch(() => { v.muted = true; setMuted(true); v.play().catch(() => {}); });
  }, [itemKey, paused]);
  useEffect(() => {
    if (item.type !== 'video') return;
    const v = videoRef.current;
    if (!v) return;
    const onTime = () => { if (v.duration) setProgress((v.currentTime / v.duration) * 100); };
    v.addEventListener('timeupdate', onTime);
    v.addEventListener('ended', next);
    return () => { v.removeEventListener('timeupdate', onTime); v.removeEventListener('ended', next); };
  }, [itemKey]);

  const holdDown = () => { holdStartRef.current = Date.now(); setPaused(true); };
  const holdUp = (side) => () => {
    const held = Date.now() - holdStartRef.current;
    setPaused(false);
    if (held < 300) { side === 'prev' ? prev() : next(); }
  };

  // ---- Reshare a status: forward it into a chat as a message, repost it
  // to your own status, or hand it off to the device's native share sheet. ----
  const repost = async () => {
    try {
      const payload = { uid: profile.id, createdAt: FieldValue.serverTimestamp(), repostedFrom: data.uid };
      if (item.type === 'text') Object.assign(payload, { type: 'text', content: item.content, bgColor: item.bgColor });
      else Object.assign(payload, { type: item.type, mediaURL: item.mediaURL, caption: item.caption || '' });
      await db.collection('smiletak_statuses').add(payload);
      toast('Reposted to your status', 'success');
    } catch (e) { toast(e.message || 'Could not repost', 'error'); }
    setSharing(false);
  };
  const forwardToChat = async (chatId, otherId) => {
    try {
      const msg = item.type === 'text' ? { type: 'text', text: item.content } : { type: item.type, mediaURL: item.mediaURL, text: item.caption || '' };
      await db.collection('smiletak_chats').doc(chatId).collection('messages').add(Object.assign({
        senderId: profile.id, createdAt: FieldValue.serverTimestamp(), readBy: [], deliveredTo: [], deletedFor: [], deletedForEveryone: false, forwarded: true
      }, msg));
      await db.collection('smiletak_chats').doc(chatId).set({ lastMessage: '↪ shared a status', lastMessageAt: FieldValue.serverTimestamp(), lastSenderId: profile.id }, { merge: true });
      // Cross-user write — see the comment in ChatWindow.sendMessage().
      db.collection('smiletak_chatMembers').doc(chatId + '_' + otherId).set({ unreadCount: FieldValue.increment(1) }, { merge: true }).catch(() => {});
      toast('Status shared', 'success');
    } catch (e) { toast(e.message || 'Could not share status', 'error'); }
    setForwardOpen(false);
    setSharing(false);
  };
  // ---- Reply to a status: exactly like WhatsApp, typing a comment here
  // sends it as a normal chat message to the status owner and takes you
  // straight into that normal one-to-one chat. ----
  const sendReply = async () => {
    const text = replyText.trim();
    if (!text || sendingReply) return;
    setSendingReply(true);
    try {
      const chatId = chatIdFor(profile.id, data.uid);
      await db.collection('smiletak_chats').doc(chatId).collection('messages').add({
        senderId: profile.id, createdAt: FieldValue.serverTimestamp(), readBy: [], deliveredTo: [], deletedFor: [], deletedForEveryone: false,
        type: 'text', text: text, statusReplyTo: item.id
      });
      await db.collection('smiletak_chats').doc(chatId).set({ lastMessage: text, lastMessageAt: FieldValue.serverTimestamp(), lastSenderId: profile.id }, { merge: true });
      // Cross-user write — see the comment in ChatWindow.sendMessage().
      db.collection('smiletak_chatMembers').doc(chatId + '_' + data.uid).set({ unreadCount: FieldValue.increment(1) }, { merge: true }).catch(() => {});
      setReplyText('');
      onOpenChat && onOpenChat(Object.assign({}, data.user, { id: data.uid }));
      onClose();
    } catch (e) { toast(e.message || 'Could not send reply', 'error'); }
    setSendingReply(false);
  };
  const shareExternally = async () => {
    setSharing(false);
    try {
      const shareData = { title: 'SmileTak status' };
      if (item.type === 'text') shareData.text = item.content;
      else { shareData.text = item.caption || ''; shareData.url = item.mediaURL; }
      if (navigator.share) await navigator.share(shareData);
      else { await navigator.clipboard.writeText(shareData.url || shareData.text || ''); toast('Copied to clipboard', 'success'); }
    } catch (e) { /* user cancelled the native share sheet — not an error */ }
  };

  return h('div', { className: 'fixed inset-0 z-50 bg-black flex flex-col' },
    h('div', { className: 'flex gap-1 p-2' }, data.items.map((_, i) => h('div', { key: i, className: 'flex-1 h-1 rounded-full bg-white/30 overflow-hidden' },
      h('div', { className: 'h-full bg-white', style: { width: (i < idx ? 100 : i === idx ? progress : 0) + '%' } })
    ))),
    h('div', { className: 'flex items-center gap-2 px-3 pb-2' }, h(Avatar, { url: data.user.photoURL, name: data.user.fullName, size: 32 }), h('p', { className: 'text-white text-sm font-semibold' }, data.user.fullName), h('span', { className: 'text-white/60 text-xs' }, timeAgo(item.createdAt)),
      h('div', { className: 'ml-auto flex items-center gap-4' },
        paused && h('i', { className: 'fa-solid fa-pause text-white/70 text-xs' }),
        h('button', { className: 'text-white', onClick: () => setSharing(true), title: 'Share status' }, h('i', { className: 'fa-solid fa-share' })),
        h('button', { className: 'text-white', onClick: onClose }, h('i', { className: 'fa-solid fa-xmark' }))
      )
    ),
    h('div', { className: 'flex-1 flex items-center justify-center relative select-none', style: item.type === 'text' ? { background: item.bgColor } : {} },
      h('div', {
        className: 'absolute inset-y-0 left-0 w-1/3 z-10',
        onPointerDown: holdDown, onPointerUp: holdUp('prev'), onPointerLeave: () => setPaused(false), onPointerCancel: () => setPaused(false)
      }),
      h('div', {
        className: 'absolute inset-y-0 right-0 w-2/3 z-10',
        onPointerDown: holdDown, onPointerUp: holdUp('next'), onPointerLeave: () => setPaused(false), onPointerCancel: () => setPaused(false)
      }),
      item.type === 'text' && h('p', { className: 'text-white text-2xl font-semibold text-center w-4/5' }, item.content),
      item.type === 'image' && h('img', { src: item.mediaURL, className: 'max-h-full max-w-full object-contain' }),
      item.type === 'video' && h('video', { ref: videoRef, src: item.mediaURL, playsInline: true, className: 'max-h-full max-w-full' }),
      item.type === 'video' && muted && h('button', {
        className: 'absolute bottom-4 right-4 z-20 w-9 h-9 rounded-full bg-black/50 text-white flex items-center justify-center',
        onClick: (e) => { e.stopPropagation(); const v = videoRef.current; if (v) { v.muted = false; v.play().catch(() => {}); setMuted(false); } }
      }, h('i', { className: 'fa-solid fa-volume-xmark text-sm' })),
      item.caption && (item.type === 'image' || item.type === 'video') && h('div', { className: 'absolute bottom-4 left-0 right-0 px-6 text-center pointer-events-none' },
        h('span', { className: 'inline-block text-white text-sm font-medium bg-black/40 px-3 py-1.5 rounded-xl' }, item.caption)
      )
    ),
    mine && h('div', { className: 'p-3 text-white text-sm' }, h('i', { className: 'fa-solid fa-eye mr-2' }), viewers.length, ' view(s)',
      viewers.length > 0 && h('div', { className: 'flex flex-wrap gap-2 mt-2' }, viewers.map(v => h('div', { key: v.id, className: 'flex items-center gap-1 bg-white/10 rounded-full px-2 py-1' }, h(Avatar, { url: v.photoURL, name: v.fullName, size: 18 }), h('span', { className: 'text-xs' }, v.fullName))))
    ),
    // Reply bar — commenting here sends a normal chat message to the
    // status owner and opens that one-to-one chat, same as WhatsApp.
    !mine && h('div', { className: 'p-3 flex items-center gap-2', onClick: e => e.stopPropagation() },
      h('input', {
        type: 'text', value: replyText, placeholder: 'Reply to ' + (data.user.fullName || 'status') + '…',
        className: 'flex-1 bg-white/10 text-white placeholder-white/50 text-sm rounded-full px-4 py-2.5 outline-none',
        onChange: e => setReplyText(e.target.value),

        h('button', { className: 'w-full flex items-center gap-3 text-left px-3 py-3 rounded-xl hover:bg-white/5 text-white text-sm', onClick: () => { setSharing(false); setForwardOpen(true); } }, h('i', { className: 'fa-solid fa-share w-5' }), 'Forward to a chat'),

      )

}

/* ============================== CALLS ============================== */
function CallsScreen({ onOpenChat }) {
  const { profile } = useAuth();
  const call = useCall();
  const [asCaller, setAsCaller] = useState([]);
  const [asCallee, setAsCallee] = useState([]);
  const [usersMap, setUsersMap] = useState({});

  useEffect(() => {
    const unsub = db.collection('smiletak_calls').where('callerId', '==', profile.id).onSnapshot(snap => {
      setAsCaller(snap.docs.map(d => Object.assign({ id: d.id }, d.data())));
    });
    return unsub;
  }, [profile.id]);
  useEffect(() => {
    const unsub = db.collection('smiletak_calls').where('calleeId', '==', profile.id).onSnapshot(snap => {
      setAsCallee(snap.docs.map(d => Object.assign({ id: d.id }, d.data())));
    });
    return unsub;
  }, [profile.id]);

  // Merge both sides of the conversation, drop the diagnostics test call
  // (written by the admin-only "Run test" tool), dedupe, and sort newest first.
  const merged = asCaller.concat(asCallee)
    .filter(c => c.id.indexOf('__diag_') !== 0)
    .filter((c, i, arr) => arr.findIndex(x => x.id === c.id) === i)
    .sort((a, b) => (b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0) - (a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0))
    .slice(0, 50);

  useEffect(() => {
    merged.forEach(c => {
      const otherUid = c.callerId === profile.id ? c.calleeId : c.callerId;
      if (otherUid && !usersMap[otherUid]) {
        db.collection('smiletak_users').doc(otherUid).get().then(s => {
          if (s.exists) setUsersMap(prev => Object.assign({}, prev, { [otherUid]: Object.assign({ id: s.id }, s.data()) }));
        }).catch(() => {});
      }
    });
    // eslint-disable-next-line
  }, [merged.map(c => c.id).join(',')]);

  return h('div', { className: 'h-full flex flex-col bg-white dark:bg-ink-900' },
    h('div', { className: 'px-4 pt-4 pb-3 flex items-center justify-between' },
      h('h1', { className: 'text-2xl font-extrabold' }, 'Calls')
    ),
    h('div', { className: 'flex-1 overflow-y-auto no-scrollbar' },
      merged.length === 0 && h('p', { className: 'px-4 text-sm text-slate-400 mt-2' }, 'No calls yet. Open a chat and tap the phone or video icon to start one.'),
      merged.map(c => {
        const otherUid = c.callerId === profile.id ? c.calleeId : c.callerId;
        const other = usersMap[otherUid];
        const outgoing = c.callerId === profile.id;
        const missed = !outgoing && (c.status === 'missed' || c.status === 'cancelled');
        const declined = c.status === 'declined';
        const flagged = missed || declined;
        return h('div', { key: c.id, className: 'flex items-center gap-3 px-4 py-2.5' },
          h(Avatar, { url: other && other.photoURL, name: other ? other.fullName : '?', size: 44 }),
          h('div', { className: 'flex-1 min-w-0 cursor-pointer', onClick: () => other && onOpenChat && onOpenChat(other) },
            h('p', { className: 'text-[15px] font-semibold truncate' }, other ? other.fullName : 'Unknown'),
            h('p', { className: 'text-[13px] flex items-center gap-1.5 ' + (flagged ? 'text-red-500' : 'text-slate-400') },
              h('i', { className: 'fa-solid ' + (outgoing ? 'fa-arrow-up-right' : 'fa-arrow-down-left') + ' text-[10px]' }),
              (missed ? 'Missed' : declined ? 'Declined' : outgoing ? 'Outgoing' : 'Incoming') + (c.durationSecs ? ' · ' + fmtDuration(c.durationSecs) : ''),
              h('span', { className: 'text-slate-400' }, ' · ' + timeAgo(c.createdAt))
            )
          ),
          other && h('button', { className: 'text-slate-400 px-2', onClick: () => call.startCall(other, c.type || 'audio') }, h('i', { className: 'fa-solid ' + (c.type === 'video' ? 'fa-video' : 'fa-phone') }))
        );
      })
    )
  );
}

  const [bio, setBio] = useState(profile.bio || '');

  const save = async () => {
    await db.collection('smiletak_users').doc(profile.id).update({ fullName: fullName.trim(), bio: bio.trim() });
    toast('Profile updated', 'success');
    setEditing(false);
  };
  const changeAvatar = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    const url = await uploadFile('smiletak/avatars/' + profile.id + '/' + Date.now() + '_' + f.name, f);
    await db.collection('smiletak_users').doc(profile.id).update({ photoURL: url });

  const runDiagnostics = async () => {
    if (!profile.isAdmin) return;
    setDiag('running');
    const results = [];
    const test = async (name, fn) => {
      try { await fn(); results.push({ name, ok: true }); }
      catch (e) { results.push({ name, ok: false, code: e.code || '?', message: e.message || String(e) }); }
    };
    await test('Read my own profile (smiletak_users)', () => db.collection('smiletak_users').doc(profile.id).get({ source: 'server' }).then(s => { if (!s.exists) throw new Error('doc missing'); }));
    await test('List my chats (smiletak_chats)', () => db.collection('smiletak_chats').where('members', 'array-contains', profile.id).limit(1).get({ source: 'server' }));
    await test('List my chatMembers (smiletak_chatMembers)', () => db.collection('smiletak_chatMembers').where('uid', '==', profile.id).limit(1).get({ source: 'server' }));
    await test('List statuses (smiletak_statuses)', () => db.collection('smiletak_statuses').limit(1).get({ source: 'server' }));
    await test('Write test call doc (smiletak_calls)', async () => {
      const ref = db.collection('smiletak_calls').doc('__diag_' + profile.id);
      await ref.set({ callerId: profile.id, calleeId: profile.id, type: 'audio', status: 'ended', createdAt: FieldValue.serverTimestamp() });
    });
    await test('Write ICE candidate (smiletak_calls/{id}/callerCandidates)', () =>
      db.collection('smiletak_calls').doc('__diag_' + profile.id).collection('callerCandidates').doc('t').set({ test: true }));
    await test('Delete test call doc', async () => {
      const ref = db.collection('smiletak_calls').doc('__diag_' + profile.id);

      await ref.delete();
    });
    if (profile.isAdmin) {

        db.collection('smiletak_settings').doc('paymentAccount').set({ __diag: true }, { merge: true }));
      await test('List all payment requests (smiletak_paymentRequests) [admin]', () =>
        db.collection('smiletak_paymentRequests').orderBy('createdAt', 'desc').limit(5).get({ source: 'server' }));
      await test('Approve a payment request (smiletak_paymentRequests) [admin]', async () => {
        const ref = db.collection('smiletak_paymentRequests').doc('__diag_' + profile.id);
        await ref.set({ uid: profile.id, type: 'premium', plan: 'monthly', amount: 0, currency: '₦', status: 'pending', createdAt: FieldValue.serverTimestamp() });
        await ref.update({ status: 'approved', reviewedAt: FieldValue.serverTimestamp(), reviewedBy: profile.id });
        await ref.delete();
      });
    }
    await test('Create + delete test channel (smiletak_channels)', async () => {
      const ref = db.collection('smiletak_channels').doc();
      await ref.set({ name: '__diag', description: '', photoURL: null, ownerId: profile.id, admins: [profile.id], createdAt: FieldValue.serverTimestamp() });
      await db.collection('smiletak_channelSubs').doc(ref.id + '_' + profile.id).set({ channelId: ref.id, uid: profile.id, subscribedAt: FieldValue.serverTimestamp() });
      await db.collection('smiletak_channelSubs').doc(ref.id + '_' + profile.id).delete();
      await ref.delete();
    });
    setDiag(results);
  };

  return h('div', { className: 'h-full overflow-y-auto no-scrollbar' },

function ChatsSettingsScreen({ onBack }) {
  const { profile } = useAuth();
  const toast = useToast();
  const [stats, setStats] = useState({ active: 0, archived: 0 });
  const [archiving, setArchiving] = useState(false);

  useEffect(() => {
    const unsub = db.collection('smiletak_chatMembers').where('uid', '==', profile.id).onSnapshot(snap => {
      const docs = snap.docs.map(d => d.data());
      setStats({ active: docs.filter(d => !d.archived).length, archived: docs.filter(d => d.archived).length });
    });
    return unsub;
  }, [profile.id]);

  const archiveAll = async () => {
    setArchiving(true);
    try {
      const snap = await db.collection('smiletak_chatMembers').where('uid', '==', profile.id).where('archived', '==', false).get();
      const batch = db.batch();
      snap.docs.forEach(d => batch.update(d.ref, { archived: true }));
      await batch.commit();
      toast('All chats archived', 'success');
    } catch (e) { toast(e.message, 'error'); }
    setArchiving(false);
  };

  return h('div', { className: 'h-full overflow-y-auto no-scrollbar' },
    h(SettingsSubHeader, { onBack, title: 'Chats' }),
    h('div', { className: 'px-4' },
      h('div', { className: 'flex gap-3 py-2' },
        h(StatCard, { label: 'Active chats', value: stats.active }),
        h(StatCard, { label: 'Archived chats', value: stats.archived })
      ),
      h('div', { className: 'flex items-center justify-between py-3 border-t border-slate-100 dark:border-ink-800' },
        h('div', null,
          h('p', { className: 'font-medium text-sm' }, 'Chat backup'),
          h('p', { className: 'text-xs text-slate-400' }, 'Your chats are saved to your SmileTak account automatically')
        )
      ),
      h('button', { onClick: archiveAll, disabled: archiving || stats.active === 0, className: 'w-full mt-3 border border-slate-200 dark:border-ink-600 rounded-xl py-2.5 font-semibold text-sm disabled:opacity-50' }, archiving ? 'Archiving…' : 'Archive all chats')

  );
}

/* ============================== MY QR CODE ============================== */
function MyQrCodeScreen({ onBack }) {
  const { profile } = useAuth();
  const toast = useToast();
  const link = window.location.origin + window.location.pathname + '#u/' + profile.username;
  const cells = useMemo(() => {
    // Deterministic pseudo-QR mosaic derived from the profile link — a
    // lightweight visual identifier without pulling in an external QR lib.
    let seed = 0;
    for (let i = 0; i < link.length; i++) seed = (seed * 31 + link.charCodeAt(i)) >>> 0;
    const rand = () => { seed = (seed * 1103515245 + 12345) >>> 0; return (seed >>> 16) % 100; };
    const n = 21;
    const grid = [];
    for (let r = 0; r < n; r++) { const row = []; for (let c = 0; c < n; c++) row.push(rand() < 46); grid.push(row); }
    const stampFinder = (r0, c0) => {
      for (let r = 0; r < 7; r++) for (let c = 0; c < 7; c++) {
        const onBorder = r === 0 || r === 6 || c === 0 || c === 6;
        const inCore = r >= 2 && r <= 4 && c >= 2 && c <= 4;
        grid[r0 + r][c0 + c] = onBorder || inCore;
      }
    };
    stampFinder(0, 0); stampFinder(0, n - 7); stampFinder(n - 7, 0);
    return grid;
  }, [link]);

  const copyLink = async () => { await navigator.clipboard.writeText(link); toast('Profile link copied', 'success'); };
  const share = async () => {
    try {
      if (navigator.share) await navigator.share({ title: profile.fullName, text: 'Add me on SmileTak', url: link });
      else copyLink();
    } catch (e) {}
  };

  return h('div', { className: 'h-full overflow-y-auto no-scrollbar' },
    h(SettingsSubHeader, { onBack, title: 'My QR code' }),
    h('div', { className: 'flex flex-col items-center px-6 pb-8' },
      h('div', { className: 'bg-white p-4 rounded-2xl shadow-sm border border-slate-100' },
        h('div', { className: 'grid', style: { gridTemplateColumns: 'repeat(21, 8px)', gridTemplateRows: 'repeat(21, 8px)' } },
          cells.flatMap((row, r) => row.map((on, c) => h('div', { key: r + '_' + c, style: { width: 8, height: 8, background: on ? '#0b1220' : 'transparent' } })))
        )
      ),
      h('p', { className: 'font-bold text-lg mt-4' }, profile.fullName),
      h('p', { className: 'text-slate-400 text-sm' }, '@' + profile.username),
      h('p', { className: 'text-xs text-slate-400 mt-3 text-center' }, 'Others can scan this code or use your link to open your profile and start a chat.'),
      h('div', { className: 'flex gap-2 w-full mt-5' },
        h('button', { onClick: copyLink, className: 'flex-1 border border-slate-200 dark:border-ink-600 rounded-xl py-2.5 font-semibold text-sm' }, 'Copy link'),
        h('button', { onClick: share, className: 'flex-1 bg-brand-600 text-white rounded-xl py-2.5 font-semibold text-sm' }, 'Share')
      )
    )
  );
}

      h('button', { className: 'w-full mb-3 px-3 py-2.5 rounded-xl border ' + (proofFile ? 'border-slate-200 dark:border-ink-600' : 'border-red-300 dark:border-red-500/50') + ' text-sm text-left', onClick: () => proofRef.current.click() }, proofFile ? proofFile.name : h('span', { className: 'text-red-500' }, 'Attach payment receipt/screenshot (required)')),
      h('button', { onClick: submit, disabled: submitting, className: 'w-full bg-brand-600 text-white rounded-xl py-2.5 font-semibold text-sm' }, submitting ? 'Submitting…' : 'I have paid — submit for review'),

      myRequests.length > 0 && h('div', { className: 'mt-6' },
        h('p', { className: 'font-semibold text-sm mb-2' }, 'Your ad submissions'),
        myRequests.map(r => h('div', { key: r.id, className: 'py-2.5 border-b border-slate-100 dark:border-ink-800 text-sm' },
          h('p', { className: 'flex items-center justify-between' },
            h('span', { className: 'font-semibold' }, r.headline || r.advertiserName),
            h('span', { className: 'text-xs font-semibold px-2 py-1 rounded-full ' + (r.status === 'approved' ? 'bg-green-100 text-green-700' : r.status === 'rejected' ? 'bg-red-100 text-red-600' : 'bg-amber-100 text-amber-700') }, r.status)
          ),
          h('p', { className: 'text-xs text-slate-400' }, (r.placements || []).map(p => (AD_PLACEMENTS.find(a => a.value === p) || {}).label || p).join(', '), ' · ', r.days, ' days · ', (r.currency || '₦') + r.amount, ' · ', timeAgo(r.createdAt))
        ))
      )
    )

/* ============================== BUSINESS ACCOUNT ============================== */
function BusinessScreen({ onBack }) {
  const { profile } = useAuth();
  const toast = useToast();
  const bp = profile.businessProfile || {};
  const [name, setName] = useState(bp.name || '');
  const [category, setCategory] = useState(bp.category || '');
  const [description, setDescription] = useState(bp.description || '');
  const [phone, setPhone] = useState(bp.phone || '');
  const [email, setEmail] = useState(bp.email || '');
  const [address, setAddress] = useState(bp.address || '');
  const [hours, setHours] = useState(bp.hours || '');
  const [website, setWebsite] = useState(bp.website || '');
  const [fbName, setFbName] = useState((bp.facebook && bp.facebook.name) || '');
  const [fbLikes, setFbLikes] = useState((bp.facebook && bp.facebook.likes) || '');
  const [igHandle, setIgHandle] = useState((bp.instagram && bp.instagram.handle) || '');
  const [igFollowers, setIgFollowers] = useState((bp.instagram && bp.instagram.followers) || '');
  const [autoReplyEnabled, setAutoReplyEnabled] = useState(!!bp.autoReplyEnabled);
  const [autoReplyMessage, setAutoReplyMessage] = useState(bp.autoReplyMessage || '');
  const [catalog, setCatalog] = useState(bp.catalog || []);
  const [newItem, setNewItem] = useState({ name: '', price: '', desc: '' });
  const [saving, setSaving] = useState(false);
  const [tab, setTab] = useState('profile');
  const [counts, setCounts] = useState({ views: 0, messages: 0 });
  const vStatus = profile.businessVerificationStatus || 'none';

  // Business Premium (paid upgrade) state
  const bizPremiumActive = isBusinessPremiumActive(profile);
  const [bizPricing, setBizPricing] = useState({ businessPremiumMonthly: 3000, businessPremiumYearly: 30000, currency: '₦' });
  const [bizAccount, setBizAccount] = useState(null);
  const [bizPlan, setBizPlan] = useState('monthly');
  const [bizReference, setBizReference] = useState('');
  const [bizProofFile, setBizProofFile] = useState(null);
  const [bizSubmitting, setBizSubmitting] = useState(false);
  const [myBizRequests, setMyBizRequests] = useState([]);
  const bizFileRef = useRef(null);
  const bizPrice = bizPlan === 'monthly' ? bizPricing.businessPremiumMonthly : bizPricing.businessPremiumYearly;

  useEffect(() => {
    if (tab !== 'analytics') return;
    Promise.all([
      db.collection('smiletak_businessEvents').where('businessUid', '==', profile.id).where('type', '==', 'view').get(),
      db.collection('smiletak_businessEvents').where('businessUid', '==', profile.id).where('type', '==', 'message').get()
    ]).then(([v, m]) => setCounts({ views: v.size, messages: m.size })).catch(() => {});
  }, [tab, profile.id]);

  useEffect(() => {
    if (tab !== 'premium') return;
    db.collection('smiletak_settings').doc('pricing').get().then(s => { if (s.exists) setBizPricing(p => Object.assign({}, p, s.data())); }).catch(() => {});
    db.collection('smiletak_settings').doc('paymentAccount').get().then(s => setBizAccount(s.exists ? s.data() : null)).catch(() => {});
  }, [tab]);

  useEffect(() => {
    if (tab !== 'premium') return;
    const unsub = db.collection('smiletak_paymentRequests').where('uid', '==', profile.id).where('type', '==', 'business').onSnapshot(snap => {
      const rows = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      rows.sort((a, b) => (b.createdAt ? b.createdAt.toMillis() : 0) - (a.createdAt ? a.createdAt.toMillis() : 0));
      setMyBizRequests(rows);
    });
    return unsub;
  }, [tab, profile.id]);

  const submitBizPremium = async () => {
    if (!name.trim()) return toast('Save your business profile first', 'error');
    if (!bizReference.trim()) return toast('Enter your payment reference / teller number', 'error');
    if (!bizProofFile) return toast('Attach your payment receipt/screenshot to continue', 'error');
    setBizSubmitting(true);
    try {
      let proofURL = null;
      if (bizProofFile) proofURL = await uploadFile('smiletak/payment-proofs/' + profile.id + '/' + Date.now() + '_' + bizProofFile.name, bizProofFile);
      await db.collection('smiletak_paymentRequests').add({
        uid: profile.id, type: 'business', plan: bizPlan, amount: bizPrice, currency: bizPricing.currency || '₦',
        businessName: name.trim(), reference: bizReference.trim(), proofURL, status: 'pending', createdAt: FieldValue.serverTimestamp()
      });
      toast('Submitted — an admin will review your payment', 'success');
      setBizReference(''); setBizProofFile(null);
    } catch (e) { toast('Could not submit: ' + e.message, 'error'); }
    setBizSubmitting(false);
  };

  const save = async () => {
    if (!name.trim()) return toast('Enter a business name', 'error');

        isBusiness: true,
        businessProfile: { name: name.trim(), category: category.trim(), description: description.trim(), phone: phone.trim(), email: email.trim(), address: address.trim(), hours: hours.trim(), website: website.trim(), facebook: (fbName.trim() || fbLikes) ? { name: fbName.trim(), likes: fbLikes } : null, instagram: (igHandle.trim() || igFollowers) ? { handle: igHandle.trim(), followers: igFollowers } : null, autoReplyEnabled, autoReplyMessage: autoReplyMessage.trim(), catalog },

  const addItem = () => {

  const removeItem = (id) => setCatalog(c => c.filter(i => i.id !== id));

  const requestVerification = async () => {
    if (!name.trim()) return toast('Save your business profile first', 'error');

      await db.collection('smiletak_businessVerificationRequests').add({ uid: profile.id, businessName: name.trim(), status: 'pending', createdAt: FieldValue.serverTimestamp() });

      h('p', { className: 'font-semibold' }, 'Business account')

    h('div', { className: 'flex gap-1 px-4 py-3 overflow-x-auto no-scrollbar' },
      ['profile', 'catalog', 'analytics', 'premium', 'verification'].map(t => h('button', { key: t, onClick: () => setTab(t), className: 'px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap ' + (tab === t ? 'bg-brand-600 text-white' : 'bg-slate-100 dark:bg-ink-700') }, t === 'premium' ? 'Premium' : t[0].toUpperCase() + t.slice(1)))
    ),
    h('div', { className: 'px-4 pb-8' },
      tab === 'profile' && h('div', null,

        h('textarea', { className: inputCls, rows: 3, placeholder: 'Description', value: description, onChange: e => setDescription(e.target.value) }),
        h('input', { className: inputCls, placeholder: 'Contact phone', value: phone, onChange: e => setPhone(e.target.value) }),
        h('input', { className: inputCls, placeholder: 'Contact email', value: email, onChange: e => setEmail(e.target.value) }),
        h('input', { className: inputCls, placeholder: 'Address', value: address, onChange: e => setAddress(e.target.value) }),
        h('input', { className: inputCls, placeholder: 'Business hours (e.g. Open 24 hours)', value: hours, onChange: e => setHours(e.target.value) }),

function UserProfileScreen({ uid, onBack, onMessage }) {
  const { profile } = useAuth();
  const toast = useToast();
  const [user, setUser] = useState(null);
  const [blocked, setBlocked] = useState(false);
  const [reporting, setReporting] = useState(false);

  useEffect(() => { const unsub = db.collection('smiletak_users').doc(uid).onSnapshot(s => setUser(s.exists ? Object.assign({ id: s.id }, s.data()) : null)); return unsub; }, [uid]);
  useEffect(() => { db.collection('smiletak_blockedUsers').doc(profile.id + '_' + uid).get().then(s => setBlocked(s.exists)); }, [uid, profile.id]);
  useEffect(() => {
    // Log a profile-view analytics event for business accounts. Written by
    // the VIEWER about themselves (viewerUid == auth.uid), never as a
    // cross-user field update on the business's own doc — see the
    // smiletak_businessEvents rule.
    if (uid === profile.id) return;
    db.collection('smiletak_users').doc(uid).get().then(s => {
      if (s.exists && s.data().isBusiness) {
        db.collection('smiletak_businessEvents').add({ businessUid: uid, viewerUid: profile.id, type: 'view', createdAt: FieldValue.serverTimestamp() }).catch(() => {});
      }
    });
  }, [uid, profile.id]);

  if (!user) return h('div', { className: 'p-6 flex items-center justify-center' }, h('div', { className: 'w-6 h-6 border-2 border-brand-500 border-t-transparent rounded-full spinner' }));

  const toggleBlock = async () => {
    if (blocked) { await db.collection('smiletak_blockedUsers').doc(profile.id + '_' + uid).delete(); setBlocked(false); toast('Unblocked', 'success'); }
    else { await db.collection('smiletak_blockedUsers').doc(profile.id + '_' + uid).set({ blockerUid: profile.id, blockedUid: uid, createdAt: FieldValue.serverTimestamp() }); setBlocked(true); toast('User blocked', 'success'); }
  };
  const submitReport = async (reason) => {
    await db.collection('smiletak_reports').add({ reporterUid: profile.id, reportedUid: uid, reason, status: 'pending', createdAt: FieldValue.serverTimestamp() });
    toast('Report submitted', 'success');
    setReporting(false);
  };
  const message = async () => {
    // Only ever write MY OWN chatMembers doc. Writing the other person's
    // chatMembers doc from here would be a cross-user write, which
    // security rules correctly block (uid must equal auth.uid) — there's
    // no server/Cloud Function to do it on their behalf. Their own client
    // self-heals their chatMembers doc the next time they open their
    // Chats tab (see ChatsListScreen).
    try {
      const chatId = chatIdFor(profile.id, uid);
      await db.collection('smiletak_chats').doc(chatId).set({ members: [profile.id, uid], createdAt: FieldValue.serverTimestamp() }, { merge: true });
      await db.collection('smiletak_chatMembers').doc(chatId + '_' + profile.id).set({ chatId, uid: profile.id, pinned: false, archived: false, muted: false, unreadCount: 0, lastReadAt: FieldValue.serverTimestamp() }, { merge: true });
      onMessage(chatId, user);
    } catch (e) {
      console.error('[SmileTak] message() failed:', e.code, e.message, e);
      toast((e.code || 'error') + ': ' + (e.message || 'Could not start chat'), 'error');
    }
  };

  const call = () => { const num = (user.businessProfile && user.businessProfile.phone) || user.phone; if (num) window.location.href = 'tel:' + num.replace(/[^\d+]/g, ''); };
  const share = async () => {
    const shareData = { title: user.fullName, text: 'Check out ' + user.fullName + ' on SmileTak', url: window.location.href };
    try {
      if (navigator.share) await navigator.share(shareData);
      else { await navigator.clipboard.writeText(shareData.url); toast('Link copied', 'success'); }
    } catch (e) {}
  };

  if (user.isBusiness && user.businessProfile) {
    const bp = user.businessProfile;
    const rows = [
      bp.phone && { icon: 'fa-phone', node: h('span', null, bp.phone) },
      bp.hours && { icon: 'fa-clock', node: h('span', { className: 'flex items-center gap-2' }, h('span', { className: 'text-green-600 font-medium' }, 'Open now'), h('span', null, bp.hours)) },
      (bp.category) && { icon: 'fa-shapes', node: h('span', null, [bp.category, 'Other Business'].filter(Boolean).join(', ')) },
      bp.email && { icon: 'fa-envelope', node: h('a', { href: 'mailto:' + bp.email, className: 'text-brand-500' }, bp.email) },
      bp.website && { icon: 'fa-globe', node: h('a', { href: bp.website, target: '_blank', rel: 'noopener', className: 'text-brand-500' }, bp.website) }
    ].filter(Boolean);

    return h('div', { className: 'h-full overflow-y-auto no-scrollbar bg-white dark:bg-ink-900' },
      h('div', { className: 'flex items-center justify-between px-3 py-2.5' },
        h('button', { onClick: onBack, className: 'text-slate-500 dark:text-slate-300' }, h('i', { className: 'fa-solid fa-arrow-left' })),
        h('button', { onClick: () => setReporting(true), className: 'text-slate-500 dark:text-slate-300', title: 'More' }, h('i', { className: 'fa-solid fa-ellipsis-vertical' }))
      ),
      h('div', { className: 'flex flex-col items-center pb-5' },
        h(Avatar, { url: user.photoURL, name: user.fullName, size: 110, online: user.online }),

        )

        h('div', { className: 'w-8 h-8 rounded-lg bg-gradient-to-tr from-amber-400 via-pink-500 to-purple-600 text-white flex items-center justify-center text-sm shrink-0' }, h('i', { className: 'fa-brands fa-instagram' })),
        h('div', null,
          h('p', { className: 'text-sm text-green-600 font-medium' }, bp.instagram.handle),
          h('p', { className: 'text-xs text-slate-400' }, 'Instagram' + (bp.instagram.followers ? ' \u00b7 ' + bp.instagram.followers + ' Followers' : ''))
        )
      ),
      h('div', { className: 'flex items-center gap-4 px-4 py-3.5 mt-2' },
        h('div', { className: 'w-6 text-slate-400 dark:text-slate-300 text-center' }, h('i', { className: 'fa-solid fa-circle-info' })),
        h('div', null,
          h('p', { className: 'text-sm font-medium' }, 'Business Account'),
          h('p', { className: 'text-xs text-slate-400' }, 'This account uses SmileTak Business')
        )
      ),
      (bp.catalog || []).length > 0 && h('div', { className: 'px-4 mt-4' },
        h('p', { className: 'text-xs font-semibold uppercase tracking-wide text-slate-400 mb-1' }, 'Products & services'),
        bp.catalog.map(item => h('div', { key: item.id, className: 'flex items-center justify-between py-2 border-b border-slate-100 dark:border-ink-800' },
          h('div', null, h('p', { className: 'text-sm font-semibold' }, item.name), item.desc && h('p', { className: 'text-xs text-slate-400' }, item.desc)),
          item.price && h('p', { className: 'text-sm font-semibold' }, item.price)
        ))
      ),

        h('button', { onClick: toggleBlock, className: 'w-full border border-slate-200 dark:border-ink-600 rounded-xl py-2.5 font-semibold text-sm' }, blocked ? 'Unblock user' : 'Block user'),
        h('button', { onClick: () => setReporting(true), className: 'w-full border border-red-200 text-red-500 rounded-xl py-2.5 font-semibold text-sm' }, 'Report user')
      ),

        h('div', { className: 'bg-white dark:bg-ink-800 rounded-2xl p-4 w-full max-w-sm', onClick: e => e.stopPropagation() },

        )
      )
    );
  }

  return h('div', { className: 'h-full overflow-y-auto no-scrollbar' },
    h('div', { className: 'flex items-center gap-3 px-3 py-2.5 border-b border-slate-100 dark:border-ink-800' },

    ),

    ),

      h('button', { onClick: toggleBlock, className: 'w-full border border-slate-200 dark:border-ink-600 rounded-xl py-2.5 font-semibold text-sm' }, blocked ? 'Unblock user' : 'Block user'),
      h('button', { onClick: () => setReporting(true), className: 'w-full border border-red-200 text-red-500 rounded-xl py-2.5 font-semibold text-sm' }, 'Report user')

/* ============================== ADMIN PANEL ============================== */
function AdminPanel() {
  const { profile } = useAuth();
  const toast = useToast();
  const [tab, setTab] = useState('dashboard');
  const [stats, setStats] = useState({ users: null, online: null, reports: null, suspended: null, premium: null, businessPremium: null, revenue: null });
  const [users, setUsers] = useState([]);
  const [reports, setReports] = useState([]);
  const [search, setSearch] = useState('');
  const [paymentReqs, setPaymentReqs] = useState([]);
  const [bizReqs, setBizReqs] = useState([]);
  const [ads, setAds] = useState([]);
  const [settingsForm, setSettingsForm] = useState({ bankName: '', accountNumber: '', accountName: '', instructions: '', premiumMonthly: 1000, premiumYearly: 10000, businessPremiumMonthly: 3000, businessPremiumYearly: 30000, adPricePerDay: 200, currency: '₦' });

  useEffect(() => {
    db.collection('smiletak_users').get().then(s => {
      const docs = s.docs;
      setStats(st => Object.assign({}, st, {
        users: docs.length,
        online: docs.filter(d => d.data().online).length,
        suspended: docs.filter(d => d.data().isSuspended).length,
        premium: docs.filter(d => isPremiumActive(d.data())).length,
        businessPremium: docs.filter(d => isBusinessPremiumActive(d.data())).length
      }));
    });
    db.collection('smiletak_reports').where('status', '==', 'pending').get().then(s => setStats(st => Object.assign({}, st, { reports: s.size })));
    db.collection('smiletak_paymentRequests').where('status', '==', 'approved').get().then(s => {
      const rev = s.docs.reduce((sum, d) => sum + (Number(d.data().amount) || 0), 0);
      setStats(st => Object.assign({}, st, { revenue: rev }));
    });
  }, []);

  useEffect(() => {
    if (tab !== 'users') return;
    const unsub = db.collection('smiletak_users').orderBy('createdAt', 'desc').limit(100).onSnapshot(s => setUsers(s.docs.map(d => Object.assign({ id: d.id }, d.data()))));
    return unsub;
  }, [tab]);

  useEffect(() => {
    if (tab !== 'reports') return;
    const unsub = db.collection('smiletak_reports').orderBy('createdAt', 'desc').limit(100).onSnapshot(s => setReports(s.docs.map(d => Object.assign({ id: d.id }, d.data()))));
    return unsub;
  }, [tab]);

  const [paymentsError, setPaymentsError] = useState(null);
  useEffect(() => {
    if (tab !== 'payments') return;
    setPaymentsError(null);
    const unsub = db.collection('smiletak_paymentRequests').orderBy('createdAt', 'desc').limit(200)
      .onSnapshot(
        s => setPaymentReqs(s.docs.map(d => Object.assign({ id: d.id }, d.data()))),
        e => setPaymentsError(e.code + ': ' + e.message)
      );
    return unsub;
  }, [tab]);

  useEffect(() => {
    if (tab !== 'business') return;
    const unsub = db.collection('smiletak_businessVerificationRequests').orderBy('createdAt', 'desc').limit(200).onSnapshot(s => setBizReqs(s.docs.map(d => Object.assign({ id: d.id }, d.data()))));
    return unsub;
  }, [tab]);

  useEffect(() => {
    if (tab !== 'ads') return;
    const unsub = db.collection('smiletak_adCampaigns').orderBy('createdAt', 'desc').limit(200).onSnapshot(s => setAds(s.docs.map(d => Object.assign({ id: d.id }, d.data()))));
    return unsub;
  }, [tab]);

  useEffect(() => {
    if (tab !== 'settings') return;
    Promise.all([
      db.collection('smiletak_settings').doc('paymentAccount').get(),
      db.collection('smiletak_settings').doc('pricing').get()
    ]).then(([a, p]) => setSettingsForm(f => Object.assign({}, f, a.exists ? a.data() : {}, p.exists ? p.data() : {})));
  }, [tab]);

  const toggleSuspend = (u) => db.collection('smiletak_users').doc(u.id).update({ isSuspended: !u.isSuspended }).then(() => toast(u.isSuspended ? 'Unsuspended' : 'Suspended', 'success'));
  const toggleAdmin = (u) => db.collection('smiletak_users').doc(u.id).update({ isAdmin: !u.isAdmin }).then(() => toast('Updated', 'success'));
  const resolveReport = (r) => db.collection('smiletak_reports').doc(r.id).update({ status: 'resolved' });

  const approvePayment = async (r) => {
    try {
      if (r.type === 'ad') {
        // Self-serve ad request: create one live campaign per placement the
        // user picked, all sharing the same creative. Revenue is recorded
        // once (on the first campaign) so the admin's totals aren't inflated
        // by having multiple placements from a single payment.
        const startAt = Timestamp.now();
        const endAt = Timestamp.fromMillis(Date.now() + (Number(r.days) || 1) * 24 * 3600 * 1000);
        const placements = r.placements && r.placements.length ? r.placements : ['app_banner'];
        await Promise.all(placements.map((type, i) => db.collection('smiletak_adCampaigns').add({
          advertiserName: r.advertiserName || 'Advertiser', type, mediaType: r.mediaType || 'text',
          mediaURL: r.mediaURL || null, headline: r.headline || '', body: r.body || '', targetURL: r.targetURL || '',
          startAt, endAt, enabled: true, impressions: 0, clicks: 0,
          amountPaid: i === 0 ? (Number(r.amount) || 0) : 0,
          ownerUid: r.uid, requestId: r.id, createdAt: FieldValue.serverTimestamp()
        })));
        await db.collection('smiletak_paymentRequests').doc(r.id).update({ status: 'approved', reviewedAt: FieldValue.serverTimestamp(), reviewedBy: profile.id });
        toast('Approved — ad campaign is now live', 'success');
        return;
      }
      const days = r.plan === 'yearly' ? 365 : 30;
      const expires = Timestamp.fromMillis(Date.now() + days * 24 * 3600 * 1000);
      if (r.type === 'business') {
        await db.collection('smiletak_users').doc(r.uid).update({ isBusinessPremium: true, businessPremiumPlan: r.plan, businessPremiumExpiresAt: expires, businessPremiumSince: FieldValue.serverTimestamp() });
      } else {
        await db.collection('smiletak_users').doc(r.uid).update({ isPremium: true, premiumPlan: r.plan, premiumExpiresAt: expires, premiumSince: FieldValue.serverTimestamp() });
      }
      await db.collection('smiletak_paymentRequests').doc(r.id).update({ status: 'approved', reviewedAt: FieldValue.serverTimestamp(), reviewedBy: profile.id });
      toast('Approved — user is now ' + (r.type === 'business' ? 'Business Premium' : 'Premium'), 'success');
    } catch (e) { toast(e.message, 'error'); }
  };
  const rejectPayment = (r) => db.collection('smiletak_paymentRequests').doc(r.id).update({ status: 'rejected', reviewedAt: FieldValue.serverTimestamp(), reviewedBy: profile.id }).then(() => toast('Rejected', 'info'));

  const approveBusiness = async (r) => {
    try {
      await db.collection('smiletak_users').doc(r.uid).update({ businessVerified: true, businessVerificationStatus: 'approved' });
      await db.collection('smiletak_businessVerificationRequests').doc(r.id).update({ status: 'approved', reviewedAt: FieldValue.serverTimestamp() });
      toast('Business verified', 'success');
    } catch (e) { toast(e.message, 'error'); }
  };
  const rejectBusiness = async (r) => {
    try {
      await db.collection('smiletak_users').doc(r.uid).update({ businessVerificationStatus: 'rejected' });
      await db.collection('smiletak_businessVerificationRequests').doc(r.id).update({ status: 'rejected', reviewedAt: FieldValue.serverTimestamp() });
      toast('Rejected', 'info');
    } catch (e) { toast(e.message, 'error'); }
  };

  const toggleAd = (ad) => db.collection('smiletak_adCampaigns').doc(ad.id).update({ enabled: !ad.enabled }).catch(e => toast(e.message, 'error'));
  const deleteAd = (ad) => { if (confirm('Delete this campaign?')) db.collection('smiletak_adCampaigns').doc(ad.id).delete().catch(e => toast(e.message, 'error')); };

  const [callFeatures, setCallFeatures] = useState({ voiceEnabled: true, videoEnabled: true });
  useEffect(() => {
    if (tab !== 'settings') return;
    const unsub = db.collection('smiletak_settings').doc('callFeatures').onSnapshot(s => {
      if (s.exists) setCallFeatures(f => Object.assign({}, f, s.data()));
    });
    return unsub;
  }, [tab]);
  const toggleCallFeature = (key) => {
    const next = !callFeatures[key];
    setCallFeatures(f => Object.assign({}, f, { [key]: next })); // optimistic
    db.collection('smiletak_settings').doc('callFeatures').set({ [key]: next }, { merge: true })
      .then(() => toast((key === 'videoEnabled' ? 'Video calls ' : 'Voice calls ') + (next ? 'enabled' : 'disabled'), 'success'))
      .catch(e => { setCallFeatures(f => Object.assign({}, f, { [key]: !next })); toast(e.message, 'error'); });
  };

  const saveSettings = async () => {
    try {
      await db.collection('smiletak_settings').doc('paymentAccount').set({ bankName: settingsForm.bankName || '', accountNumber: settingsForm.accountNumber || '', accountName: settingsForm.accountName || '', instructions: settingsForm.instructions || '' });
      await db.collection('smiletak_settings').doc('pricing').set({ premiumMonthly: Number(settingsForm.premiumMonthly) || 0, premiumYearly: Number(settingsForm.premiumYearly) || 0, businessPremiumMonthly: Number(settingsForm.businessPremiumMonthly) || 0, businessPremiumYearly: Number(settingsForm.businessPremiumYearly) || 0, adPricePerDay: Number(settingsForm.adPricePerDay) || 0, currency: settingsForm.currency || '₦' });
      toast('Settings saved', 'success');
    } catch (e) { toast(e.message, 'error'); }
  };

  const filteredUsers = users.filter(u => !search || (u.fullName || '').toLowerCase().includes(search.toLowerCase()) || (u.username || '').includes(search.toLowerCase()) || (u.phone || '').includes(search));

  return h('div', { className: 'h-full flex flex-col' },
    h('div', { className: 'px-4 pt-4 pb-2' }, h('h1', { className: 'text-xl font-extrabold' }, 'Admin Panel')),
    h('div', { className: 'flex gap-1 px-4 pb-2 overflow-x-auto no-scrollbar' },
      ['dashboard', 'users', 'reports', 'payments', 'business', 'ads', 'settings'].map(t => h('button', { key: t, onClick: () => setTab(t), className: 'px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap ' + (tab === t ? 'bg-brand-600 text-white' : 'bg-slate-100 dark:bg-ink-700') }, t[0].toUpperCase() + t.slice(1)))
    ),
    h('div', { className: 'flex-1 overflow-y-auto no-scrollbar px-4 pb-6' },
      tab === 'dashboard' && h('div', { className: 'grid grid-cols-2 gap-3' },
        h(StatCard, { label: 'Total users', value: stats.users }),
        h(StatCard, { label: 'Online now', value: stats.online }),
        h(StatCard, { label: 'Pending reports', value: stats.reports }),
        h(StatCard, { label: 'Suspended', value: stats.suspended }),
        h(StatCard, { label: 'Premium members', value: stats.premium }),
        h(StatCard, { label: 'Business Premium', value: stats.businessPremium }),
        h(StatCard, { label: 'Total revenue', value: stats.revenue === null ? null : '₦' + stats.revenue })
      ),
      tab === 'users' && h('div', null,
        h('input', { className: inputCls, placeholder: 'Search users…', value: search, onChange: e => setSearch(e.target.value) }),
        filteredUsers.map(u => h('div', { key: u.id, className: 'flex items-center gap-3 py-2.5 border-b border-slate-100 dark:border-ink-800' },
          h(Avatar, { url: u.photoURL, name: u.fullName, size: 36 }),
          h('div', { className: 'flex-1 min-w-0' }, h('p', { className: 'text-sm font-semibold truncate' }, u.fullName, u.isAdmin && h('span', { className: 'ml-1 text-[10px] bg-brand-100 text-brand-700 px-1.5 py-0.5 rounded-full' }, 'admin'), u.isSuspended && h('span', { className: 'ml-1 text-[10px] bg-red-100 text-red-600 px-1.5 py-0.5 rounded-full' }, 'suspended'), isPremiumActive(u) && h('span', { className: 'ml-1 text-[10px] bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded-full' }, 'premium'), isBusinessPremiumActive(u) && h('span', { className: 'ml-1 text-[10px] bg-sky-100 text-sky-700 px-1.5 py-0.5 rounded-full' }, 'biz premium'), u.businessVerified && h('span', { className: 'ml-1 text-[10px] bg-sky-100 text-sky-700 px-1.5 py-0.5 rounded-full' }, 'verified biz')),
            h('p', { className: 'text-xs text-slate-400' }, '@' + u.username, ' · +', u.phone)),
          h('div', { className: 'flex gap-1' },
            h('button', { className: 'text-xs px-2 py-1 rounded-lg border border-slate-200 dark:border-ink-600', onClick: () => toggleSuspend(u) }, u.isSuspended ? 'Unsuspend' : 'Suspend'),
            h('button', { className: 'text-xs px-2 py-1 rounded-lg border border-slate-200 dark:border-ink-600', onClick: () => toggleAdmin(u) }, u.isAdmin ? 'Revoke admin' : 'Make admin')
          )
        ))
      ),
      tab === 'reports' && h('div', null,
        reports.length === 0 && h('p', { className: 'text-sm text-slate-400 mt-4' }, 'No reports'),
        reports.map(r => h('div', { key: r.id, className: 'py-2.5 border-b border-slate-100 dark:border-ink-800' },
          h('p', { className: 'text-sm font-semibold' }, r.reason, r.status === 'resolved' && h('span', { className: 'ml-2 text-[10px] text-brand-600' }, 'resolved')),
          h('p', { className: 'text-xs text-slate-400' }, 'Reported user: ', r.reportedUid, ' · ', timeAgo(r.createdAt)),
          r.status === 'pending' && h('button', { className: 'text-xs text-brand-600 font-semibold mt-1', onClick: () => resolveReport(r) }, 'Mark resolved')
        ))
      ),
      tab === 'payments' && h('div', null,
        paymentsError && h('p', { className: 'text-sm text-red-500 mt-4' }, 'Could not load payments: ' + paymentsError),
        !paymentsError && paymentReqs.length === 0 && h('p', { className: 'text-sm text-slate-400 mt-4' }, 'No payment requests yet'),
        paymentReqs.map(r => h(PaymentRequestRow, { key: r.id, r, onApprove: () => approvePayment(r), onReject: () => rejectPayment(r) }))
      ),
      tab === 'business' && h('div', null,
        bizReqs.length === 0 && h('p', { className: 'text-sm text-slate-400 mt-4' }, 'No verification requests yet'),
        bizReqs.map(r => h('div', { key: r.id, className: 'py-2.5 border-b border-slate-100 dark:border-ink-800' },
          h('p', { className: 'text-sm font-semibold' }, r.businessName, h('span', { className: 'ml-2 text-[10px] font-semibold px-1.5 py-0.5 rounded-full ' + (r.status === 'approved' ? 'bg-green-100 text-green-700' : r.status === 'rejected' ? 'bg-red-100 text-red-600' : 'bg-amber-100 text-amber-700') }, r.status)),
          h('p', { className: 'text-xs text-slate-400' }, timeAgo(r.createdAt)),
          r.status === 'pending' && h('div', { className: 'flex gap-2 mt-1' },
            h('button', { className: 'text-xs text-green-600 font-semibold', onClick: () => approveBusiness(r) }, 'Approve'),
            h('button', { className: 'text-xs text-red-500 font-semibold', onClick: () => rejectBusiness(r) }, 'Reject')
          )
        ))
      ),
      tab === 'ads' && h(AdCampaignsAdmin, { ads, onToggle: toggleAd, onDelete: deleteAd }),
      tab === 'settings' && h('div', { className: 'space-y-1' },
        h('p', { className: 'font-semibold text-sm mt-2 mb-1' }, 'Calling'),
        h('div', { className: 'flex items-center justify-between py-2 border-b border-slate-100 dark:border-ink-800' },
          h('span', { className: 'text-sm' }, 'Voice calls'),
          h('button', {
            onClick: () => toggleCallFeature('voiceEnabled'),
            className: 'w-12 h-7 rounded-full relative transition-colors ' + (callFeatures.voiceEnabled ? 'bg-brand-600' : 'bg-slate-300 dark:bg-ink-600')
          }, h('span', { className: 'absolute top-1 w-5 h-5 rounded-full bg-white transition-all ' + (callFeatures.voiceEnabled ? 'left-6' : 'left-1') }))

/* ============================== CALLING (WebRTC) ==============================
   Voice/video calls, signaled through Firestore (smiletak_calls + per-call
   candidate subcollections) — no Cloud Functions, same pattern as the rest
   of the app. STUN + free public TURN relays (openrelay.metered.ca) are
   included so calls still connect when both people are on different
   networks (mobile data <-> wifi), not just on the same LAN.

   IF CALLS ONLY WORK BETWEEN TWO TABS ON YOUR OWN PHONE, BUT A REAL SECOND
   PERSON ON A DIFFERENT DEVICE CAN'T HEAR/SEE YOU, THE #1 CAUSE IS FIRESTORE
   SECURITY RULES — NOT THIS FILE. The other person's phone has to be able to
   WRITE into a call document that YOU created (and vice versa), which a
   typical "only the owner can write" rule blocks. Make sure your rules
   (Firebase Console → Firestore Database → Rules) include something like:

     match /smiletak_calls/{callId} {
       allow read, update: if request.auth != null &&
         (request.auth.uid == resource.data.callerId ||
          request.auth.uid == resource.data.calleeId);
       allow create: if request.auth != null &&
         request.auth.uid == request.resource.data.callerId;
       match /callerCandidates/{candidateId} {
         allow read, write: if request.auth != null &&
           (request.auth.uid == get(/databases/$(database)/documents/smiletak_calls/$(callId)).data.callerId ||
            request.auth.uid == get(/databases/$(database)/documents/smiletak_calls/$(callId)).data.calleeId);
       }
       match /calleeCandidates/{candidateId} {
         allow read, write: if request.auth != null &&
           (request.auth.uid == get(/databases/$(database)/documents/smiletak_calls/$(callId)).data.callerId ||
            request.auth.uid == get(/databases/$(database)/documents/smiletak_calls/$(callId)).data.calleeId);
       }
     }

   Without the candidate-subcollection rules specifically, each side can
   create/accept the call doc fine (so it *looks* like it connects), but the
   ICE candidates that carry actual audio/video never make it across —
   which matches exactly "connects but no one hears/sees anything." */
function buildRtcConfig(forceRelay) {
  return {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun2.l.google.com:19302' },
      { urls: 'stun:stun3.l.google.com:19302' },
      { urls: 'stun:stun4.l.google.com:19302' },
      // TWO independent free TURN providers (not just one) so that if either
      // one is rate-limited or briefly down, the call still has a working
      // relay path. This matters most exactly when two phones are on two
      // SEPARATE mobile data connections (as opposed to sharing one
      // hotspot) — mobile carriers almost always sit behind carrier-grade
      // NAT, so a direct/STUN-only path frequently can't be found and the
      // call has no choice but to relay through TURN.
      { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' },
      // Second, independent free/no-signup TURN provider as a fallback in
      // case Open Relay is down or overloaded at the moment of the call.
      { urls: 'turn:relay.freeturn.net:3478', username: 'freeturn', credential: 'freeturn' },
      { urls: 'turns:relay.freeturn.net:5349', username: 'freeturn', credential: 'freeturn' }
    ],
    iceCandidatePoolSize: 10,
    bundlePolicy: 'max-bundle',
    // On the *retry* after an initial connection stall, force every candidate
    // through TURN relay instead of also trying the direct/STUN path. Mobile
    // carriers often silently drop the direct path, so the browser can waste
    // its whole gathering window on candidates that were never going to work.
    // Forcing 'relay' skips straight to the path that actually succeeds
    // across two separate mobile networks.
    iceTransportPolicy: forceRelay ? 'relay' : 'all'
  };
}

// Applied to every microphone getUserMedia() call (calls, group calls, voice
// notes) so the browser actively cancels echo/feedback and normalizes mic
// gain instead of leaving that entirely to device defaults, which is where

const MIC_CONSTRAINTS = { echoCancellation: true, noiseSuppression: true, autoGainControl: true };

/* Simple phone-style ring cadence (beep ~1s, silent ~2s, repeat) built with
   the Web Audio API so no audio file is needed. */
function useRingTone(active) {
  useEffect(() => {
    if (!active) return;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    let stopped = false;
    const beep = () => {
      if (stopped) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = 440;
      gain.gain.value = 0.12;
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start();
      setTimeout(() => { try { osc.stop(); } catch (e) {} }, 900);
    };
    beep();
    const timer = setInterval(beep, 3000);
    return () => { stopped = true; clearInterval(timer); ctx.close().catch(() => {}); };
  }, [active]);
}

function CallProvider({ children }) {
